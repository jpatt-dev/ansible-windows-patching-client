---
# AAP survey for Windows - Full Patch (playbooks/windows/full_patch.yml).
# Per-run operator decisions only. Do not survey WSUS URLs or provider.
# Targeting is AAP Limit (required). Do not survey emergency bypass.
# Temporary exemptions may list exact inventory hostnames for this job only.
#
# Confirm survey-variable and Limit propagation during deployment acceptance
# testing.
name: "Windows Full Patch Survey"
description: >-
  Per-run authorization and maintenance context for the Windows full patch
  job. All remediation defaults are false.
spec:
  - variable: change_ticket_id
    question_name: "Change ticket ID"
    type: text
    default: ""
    required: false

  - variable: maintenance_window_start
    question_name: "Maintenance window start UTC"
    question_description: "ISO-8601 Z, e.g. 2026-08-17T02:00:00Z"
    type: text
    default: ""
    required: false

  - variable: maintenance_window_end
    question_name: "Maintenance window end UTC"
    question_description: "ISO-8601 Z, e.g. 2026-08-17T06:00:00Z"
    type: text
    default: ""
    required: false

  - variable: maintenance_window_acknowledged
    question_name: "Maintenance window acknowledged"
    type: multiplechoice
    choices:
      - "false"
      - "true"
    default: "false"
    required: true

  - variable: operator_authorize_patch_install
    question_name: "Authorize patch installation"
    question_description: >-
      Does not authorize reboot. Apply still validates WSUS, Limit, OS policy,
      pending reboot, and the maintenance window when that check is required.
    type: multiplechoice
    choices:
      - "false"
      - "true"
    default: "false"
    required: true

  - variable: operator_allow_pre_patch_reboot
    question_name: "Allow pre-patch reboot when required"
    question_description: Does not authorize install or post-patch reboot.
    type: multiplechoice
    choices:
      - "false"
      - "true"
    default: "false"
    required: true

  - variable: operator_allow_post_patch_reboot
    question_name: "Allow post-patch reboot when required"
    question_description: Does not authorize install or pre-patch reboot.
    type: multiplechoice
    choices:
      - "false"
      - "true"
    default: "false"
    required: true

  - variable: patch_temporary_exempt_hosts
    question_name: "Temporary exempt hosts"
    question_description: >-
      Comma-separated exact inventory hostnames for this job only. Leave empty
      for no temporary exemptions. Permanent Git inventory exemptions still apply.
    type: textarea
    default: ""
    required: false

  - variable: patch_temporary_exemption_reference
    question_name: "Temporary exemption reference"
    question_description: >-
      Required when temporary exempt hosts are listed. Example: EXC-12345.
      Does not change a host's permanent Git exemption or reference.
    type: text
    default: ""
    required: false
