---
# AAP survey spec for "Windows - Patch Discovery".
# Search-only. Do not survey patch/reboot authorization, provider, or WSUS URL.
name: "Windows Patch Discovery Survey"
description: >-
  Optional change context for search-only discovery. Never installs updates.
spec:
  - variable: change_ticket_id
    question_name: "Change ticket ID"
    type: text
    default: ""
    required: false

  - variable: snow_enabled
    question_name: "Enable ServiceNow integration"
    question_description: >-
      Credentials remain AAP Credentials. Enable only when a change record
      should receive work notes.
    type: multiplechoice
    choices:
      - "false"
      - "true"
    default: "false"
    required: true
