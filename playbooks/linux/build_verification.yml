---
# Read-only Linux distribution and kernel snapshot for AAP 2.7.
# Live data is ansible_distribution_version and ansible_kernel from minimal facts.
# An optional local RPM query adds the newest installed kernel. /proc/uptime
# adds a readable uptime when minimal facts do not include it. Neither query
# updates packages, refreshes repositories, or needs sudo.
# Inventory fields are inventory_hostname, fqdn, os, location, environment,
# and sys_id. Blank FQDN, OS release, and sys_id stay not_available.
# Location and environment stay empty strings. Live facts do not fill them.
# It does not update packages, reboot, or call ServiceNow.
#
# Both plays use hosts: linux_hosts, so a Limit only narrows that group.
# Blank Limit, all, and * are allowed.
#
# A failed OS fact gather is rescued so the other hosts and the report still
# run. The optional kernel query runs only after that gather succeeds, so an
# unreachable host is not contacted again. An optional kernel failure does not
# fail the collection. Failed and unreachable hosts are recorded, and the
# report is still written when every host fails. This playbook does not fail
# the AAP job for collection status.
#
# Job template: Linux - Build Verification
#   Inventory: the LAB, IST, UAT, or PROD inventory that contains linux_hosts
#   Credential: existing Linux SSH credential
#   Execution environment: an EE that can SSH to Linux
#   Limit: optional. Blank, all, *, hosts, or an inventory group.
#   Playbook: playbooks/linux/build_verification.yml
#
# Email is off unless the job template sets report_email_enabled=true.
# SMTP tasks are loaded only then.
# Example extra variables:
#   report_email_enabled: true
#   report_email_smtp_host: smtp.example.internal
#   report_email_smtp_port: 25
#   report_email_smtp_secure: never
#   report_email_from: patching@example.internal
#   report_email_to:
#     - ops@example.internal
#   report_email_attach_csv: true
#   report_email_fail_on_error: true

- name: Collect the Linux distribution version and running kernel
  hosts: linux_hosts
  gather_facts: false
  ignore_unreachable: true
  vars:
    report_email_enabled: false
    report_email_smtp_host: ""
    report_email_smtp_port: 25
    report_email_smtp_secure: "never"
    report_email_from: ""
    report_email_to: []
    report_email_attach_csv: true
    report_email_fail_on_error: true
    build_verify_output_dir: /tmp/aap-build-verification

  tasks:
    - name: Read minimal Linux facts
      block:
        - name: Gather distribution version and running kernel
          ansible.builtin.setup:
            gather_subset:
              - min
          register: linux_build_query
          timeout: 120
          changed_when: false

        - name: Read the newest installed kernel and the system uptime
          ansible.builtin.shell: |
            # bv-kernel-script
            running={{ ansible_kernel | default('') | quote }}
            uptime_text=
            latest=
            activation=Unknown
            secs=
            if [ -r /proc/uptime ]; then
              read -r up_raw _ < /proc/uptime || true
              secs=${up_raw%%.*}
              case "$secs" in
                ''|*[!0-9]*) secs= ;;
              esac
            fi
            if [ -n "$secs" ]; then
              days=$((secs / 86400))
              hours=$(((secs % 86400) / 3600))
              minutes=$(((secs % 3600) / 60))
              if [ "$days" -ge 1 ]; then
                if [ "$days" -eq 1 ]; then dunit=day; else dunit=days; fi
                if [ "$hours" -eq 1 ]; then hunit=hour; else hunit=hours; fi
                uptime_text="$days $dunit, $hours $hunit"
              elif [ "$hours" -ge 1 ]; then
                if [ "$hours" -eq 1 ]; then hunit=hour; else hunit=hours; fi
                if [ "$minutes" -eq 1 ]; then munit=minute; else munit=minutes; fi
                uptime_text="$hours $hunit, $minutes $munit"
              else
                if [ "$minutes" -eq 1 ]; then munit=minute; else munit=minutes; fi
                uptime_text="$minutes $munit"
              fi
            fi
            variant=special
            case "$running" in
              *+*|*.rt[0-9]*) ;;
              [0-9]*)
                run_arch=${running##*.}
                case "$run_arch" in
                  x86_64|aarch64|ppc64le|s390x) variant=standard ;;
                esac
                ;;
            esac
            have_lua=false
            probe=$(rpm --eval '%{lua:print(rpm.vercmp("1","1"))}' 2>/dev/null || true)
            if [ "$probe" = 0 ]; then
              have_lua=true
            fi
            pybin=/usr/libexec/platform-python
            have_py=false
            if [ -x "$pybin" ]; then
              probe=$("$pybin" -c 'import rpm,sys; print(rpm.labelCompare(("0","1","1"),("0","1","1")))' 2>/dev/null || true)
              if [ "$probe" = 0 ]; then
                have_py=true
              fi
            fi
            rpm_cmp() {
              left=$1
              right=$2
              if [ "$left" = "$right" ]; then
                printf '0\n'
                return 0
              fi
              if [ "$have_lua" = true ]; then
                result=$(rpm --define "kvleft ${left}" --define "kvright ${right}" \
                  --eval '%{lua:print(rpm.vercmp(rpm.expand("%{kvleft}"), rpm.expand("%{kvright}")))}' 2>/dev/null || true)
                case "$result" in
                  1|0|-1) printf '%s\n' "$result"; return 0 ;;
                esac
              fi
              if [ "$have_py" = true ]; then
                result=$("$pybin" -c 'import rpm, sys
            def parts(value):
                version, release = value.split("-", 1)
                return ("0", version, release)
            print(rpm.labelCompare(parts(sys.argv[1]), parts(sys.argv[2])))' "$left" "$right" 2>/dev/null || true)
                case "$result" in
                  1|0|-1) printf '%s\n' "$result"; return 0 ;;
                esac
              fi
              printf 'fail\n'
              return 1
            }
            rpm_out=$(rpm -q kernel kernel-core --qf '%{VERSION}-%{RELEASE}.%{ARCH}\n' 2>/dev/null || true)
            best=
            best_evr=
            reliable=true
            seen='|'
            while IFS= read -r line || [ -n "$line" ]; do
              case "$line" in
                ''|*'not installed'*) continue ;;
              esac
              arch=${line##*.}
              evr=${line%.*}
              case "$arch" in
                x86_64|aarch64|ppc64le|s390x) ;;
                *) continue ;;
              esac
              case "$evr" in
                [0-9]*-[0-9]*) ;;
                *) continue ;;
              esac
              case "$evr" in
                *[!0-9A-Za-z._~^+-]*) reliable=false; break ;;
              esac
              case "$seen" in
                *"|$line|"*) continue ;;
              esac
              seen="$seen$line|"
              if [ -z "$best" ]; then
                best=$line
                best_evr=$evr
                continue
              fi
              if [ "$evr" = "$best_evr" ]; then
                continue
              fi
              cmp=$(rpm_cmp "$evr" "$best_evr")
              case "$cmp" in
                1) best=$line; best_evr=$evr ;;
                0|-1) ;;
                *) reliable=false; break ;;
              esac
            done <<EOF
            $rpm_out
            EOF
            if [ "$reliable" = true ] && [ -n "$best" ]; then
              latest=$best
              if [ "$variant" = standard ] && [ "$running" = "$best" ]; then
                activation=No
              elif [ "$variant" = standard ] && [ "${running##*.}" = "${best##*.}" ]; then
                run_evr=${running%.*}
                case "$run_evr" in
                  *[!0-9A-Za-z._~^+-]*) activation=Unknown ;;
                  *)
                    cmp=$(rpm_cmp "$best_evr" "$run_evr")
                    case "$cmp" in
                      1) activation=Yes ;;
                      *) activation=Unknown ;;
                    esac
                    ;;
                esac
              fi
            fi
            printf '{"latest_installed_kernel":"%s","kernel_activation_pending":"%s","uptime":"%s"}\n' "$latest" "$activation" "$uptime_text"
            # bv-kernel-script-end
          register: linux_kernel_query
          changed_when: false
          failed_when: false
          timeout: 60
          when:
            - linux_build_query is defined
            - linux_build_query is mapping
            - (linux_build_query.unreachable | default(false)) == false
            - (linux_build_query.failed | default(false)) == false
            - (linux_build_query.rc | default(0) | int) == 0
      rescue:
        - name: Keep the failed fact gather for the host report row
          ansible.builtin.set_fact:
            linux_build_query: "{{ ansible_failed_result }}"
          when: >-
            linux_build_query is not defined
            or (linux_build_query.failed | default(false)) == true
            or (linux_build_query.unreachable | default(false)) == true
            or (linux_build_query.rc | default(0) | int) != 0
          changed_when: false
      always:
        - name: Record the Linux distribution and kernel
          ansible.builtin.include_tasks: tasks/build_verification_record.yml

- name: Report the Linux distribution and kernel
  hosts: linux_hosts
  connection: local
  gather_facts: false
  vars:
    report_email_enabled: false
    report_email_smtp_host: ""
    report_email_smtp_port: 25
    report_email_smtp_secure: "never"
    report_email_from: ""
    report_email_to: []
    report_email_attach_csv: true
    report_email_fail_on_error: true
    build_verify_output_dir: /tmp/aap-build-verification
    build_verify_platform: linux
    build_verify_build_kind: running_kernel
    build_verify_report_name: linux_build_verification_report
    build_verify_csv_name: linux_build_verification_csv
    build_verify_filename_prefix: linux-build-verification
    build_verify_subject_name: Linux
    build_verify_report_source: linux_build_verification
    build_verify_schema_version: "3"
    build_verify_linux_columns: true
    build_verify_email_scope: |
      Linux build verification collected the distribution version, the running kernel,
      the newest installed kernel, and system uptime.
      Current Build / Kernel is the running kernel.
      Kernel Activation Pending is not a reboot or compliance result.
      No packages were updated and no servers were rebooted.
    build_verify_email_tasks: "{{ playbook_dir }}/../build_verification/tasks/email.yml"

  tasks:
    - name: Aggregate and publish the build verification report
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../build_verification/tasks/report.yml"
      run_once: true
