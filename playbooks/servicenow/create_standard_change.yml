---
# Standalone proof of concept. One POST to the Standard Change API.
# This playbook is not part of Full Patch, Precheck, or change preparation.
#
# Confirmed endpoint:
#   POST /api/sn_chg_rest/change/standard/{snow_standard_change_template_id}
# The template id is one path token. It is not assumed to be a producer
# version sys_id. The body is snow_change_payload. Required fields are not
# filled in here because the client has not confirmed that contract.
#
# Authentication matches the working Incident Import Set path.
# servicenow.itsm 2.6.3 reads SN_USERNAME and SN_PASSWORD from the module
# environment. This playbook does not pass those lookups to the task.
# SN_HOST must be visible and must match the validated instance. The POST
# host is that validated instance, not an unbound credential URL.
#
# servicenow.itsm.api action post returns record, which is the JSON result
# member, only after HTTP 200 or 201. It does not return the HTTP status.
# HTTP 202 raises an error and stays unconfirmed. A module success still
# requires a number matching ^CHG[0-9]+$ and a 32-character hexadecimal
# sys_id. This playbook does not send a second request and does not claim
# that no Change was created. In check mode the collection would return the
# request payload as record, so this play ends before the module.
#
# Read-back is not implemented. servicenow.itsm.change_request_info can
# later query by number or sys_id, but only after the client confirms which
# returned field proves the record is a Standard Change. No read is sent
# until that contract exists. This playbook performs no other ServiceNow write.
#
# AAP job template:
#   Playbook: playbooks/servicenow/create_standard_change.yml
#   Inventory: localhost. Do not limit this job to a Windows wave.
#   Credential: the custom credential that injects SN_HOST, SN_USERNAME,
#               and SN_PASSWORD.
#   Extra vars: snow_instance_url must exactly match
#               snow_nonproduction_instance_url. snow_confirm_create
#               stays false until the nonproduction test is intended.

- name: Create one ServiceNow Standard Change from an approved template
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    snow_instance_url: ""
    snow_nonproduction_instance_url: ""
    snow_standard_change_template_id: ""
    snow_change_payload: {}
    snow_confirm_create: false
    snow_dev_error_diagnostics: false

  tasks:
    - name: Check the Standard Change request before any POST
      ansible.builtin.include_tasks: tasks/standard_change_preflight.yml

    - name: Show that creation was not confirmed
      when: snow_standard_change_preflight == 'not_confirmed'
      ansible.builtin.debug:
        msg:
          - "Standard Change creation: NOT CONFIRMED"
          - "snow_confirm_create is false. No ServiceNow request was sent."
          - "Set snow_confirm_create=true to send one POST."

    - name: Show that check mode does not create a change
      when: snow_standard_change_preflight == 'check_mode'
      ansible.builtin.debug:
        msg:
          - "Standard Change creation: CHECK MODE"
          - "No ServiceNow request was sent."

    - name: End before POST when creation is not confirmed or check mode is on
      when: snow_standard_change_preflight != 'proceed'
      ansible.builtin.meta: end_play

    - name: Check the ServiceNow credential against the validated instance
      ansible.builtin.include_tasks: tasks/standard_change_credential.yml

    - name: POST one Standard Change
      block:
        # Username and password come from the credential environment.
        # args[module] does not see that env fallback.
        - name: Send the Standard Change creation request  # noqa: args[module]
          servicenow.itsm.api:
            instance:
              host: "{{ snow_standard_change_instance }}"
              validate_certs: true
              timeout: 60
            api_path: "api/sn_chg_rest/change/standard/{{ snow_standard_change_template }}"
            action: post
            data: "{{ snow_change_payload }}"
          register: snow_standard_change_response
          no_log: true
      rescue:
        - name: Sanitize the module failure
          ansible.builtin.include_tasks: tasks/standard_change_module_failure.yml
          no_log: true
          vars:
            snow_standard_change_module_error: "{{ ansible_failed_result.msg | default('') }}"

    - name: Classify the Standard Change response
      ansible.builtin.include_tasks: tasks/classify_standard_change_response.yml

    - name: Show the confirmed Standard Change result
      ansible.builtin.debug:
        msg:
          - "Standard Change creation: SUCCEEDED"
          - "HTTP status: {{ snow_standard_change_summary.http_status }}"
          - "Change number: {{ snow_standard_change_summary.change_number }}"
          - "sys_id: {{ snow_standard_change_summary.sys_id }}"
          - "No further request was sent. Confirm the record in ServiceNow before using it."
