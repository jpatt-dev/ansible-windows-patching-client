---
# Read-only inspection of one existing Standard Change and its template version.
# Set existing_standard_cr_number below, or pass it as an extra variable.
# Does not create, update, or close a change or template.
# After the producer sys_id is known, performs one read-only GET:
#   /api/sn_sc/servicecatalog/items/{record_producer_sys_id}
# A successful GET does not prove that template submission is supported.
#
# AAP job template:
#   Playbook: playbooks/servicenow/inspect_standard_change.yml
#   Inventory: localhost is enough. Do not limit this job to a Windows wave.
#   Credential: the custom credential that injects SN_HOST, SN_USERNAME,
#               and SN_PASSWORD.
#   Execution environment: one that already includes servicenow.itsm.

- name: Read-only Standard Change field inspection
  hosts: localhost
  connection: local
  gather_facts: false

  vars:
    # <-- Put the number of your existing Standard Change here
    existing_standard_cr_number: "CHG0001234"

  tasks:
    - name: Read existing Standard Change Request
      servicenow.itsm.change_request_info:
        number: "{{ existing_standard_cr_number }}"
      register: cr
      no_log: true

    - name: Fail if not found
      ansible.builtin.assert:
        that:
          - cr.records | default([]) | length > 0
        fail_msg: "Change {{ existing_standard_cr_number }} not found."

    - name: Display sanitized field inspection
      ansible.builtin.debug:
        msg:
          - "Change number: {{ cr.records[0].number }}"
          - "Type: {{ cr.records[0].type | default('NOT SET') }}"
          - "Model (chg_model): {{ cr.records[0].chg_model | default('NOT SET') }}"
          - "Standard template (std_change_producer_version): {{ cr.records[0].std_change_producer_version | default('NOT SET') }}"
          - "Configuration Item (cmdb_ci): {{ 'POPULATED' if cr.records[0].cmdb_ci | default('') | length > 0 else 'EMPTY' }}"
          - "Assigned To (assigned_to): {{ 'POPULATED' if cr.records[0].assigned_to | default('') | length > 0 else 'EMPTY' }}"
          - "Planned Start (start_date): {{ cr.records[0].start_date | default('NOT SET') }}"
          - "Planned End (end_date): {{ cr.records[0].end_date | default('NOT SET') }}"
          - "Planned Start alt (planned_start_date): {{ cr.records[0].planned_start_date | default('NOT SET') }}"
          - "Planned End alt (planned_end_date): {{ cr.records[0].planned_end_date | default('NOT SET') }}"
          - "Test plan (test_plan): {{ 'POPULATED' if cr.records[0].test_plan | default('') | length > 0 else 'EMPTY' }}"
          - "Implementation plan (implementation_plan): {{ 'POPULATED' if cr.records[0].implementation_plan | default('') | length > 0 else 'EMPTY' }}"
          - "Backout plan (backout_plan): {{ 'POPULATED' if cr.records[0].backout_plan | default('') | length > 0 else 'EMPTY' }}"
          - "Short description: {{ cr.records[0].short_description | default('NOT SET') }}"
          - "Category: {{ cr.records[0].category | default('NOT SET') }}"
          - "Risk: {{ cr.records[0].risk | default('NOT SET') }}"
          - "Impact: {{ cr.records[0].impact | default('NOT SET') }}"
          - "Priority: {{ cr.records[0].priority | default('NOT SET') }}"

    - name: Capture the template version sys_id
      ansible.builtin.set_fact:
        std_change_version_sys_id: >-
          {{
            cr.records[0].std_change_producer_version.value
            if (
              cr.records[0].std_change_producer_version is defined
              and cr.records[0].std_change_producer_version is mapping
              and (
                cr.records[0].std_change_producer_version.value
                | default('') | string
              ) is match('^[0-9a-fA-F]{32}$')
            )
            else (
              cr.records[0].std_change_producer_version
              if (
                cr.records[0].std_change_producer_version is defined
                and cr.records[0].std_change_producer_version is string
                and (cr.records[0].std_change_producer_version | string)
                is match('^[0-9a-fA-F]{32}$')
              )
              else ''
            )
          }}

    - name: Read the Standard Change template version
      when: std_change_version_sys_id | length == 32
      servicenow.itsm.api_info:
        resource: std_change_producer_version
        sysparm_query: "sys_id={{ std_change_version_sys_id }}"
        exclude_reference_link: true
      register: std_version_lookup
      no_log: true

    - name: Select the template version row
      when: std_version_lookup is not skipped
      ansible.builtin.set_fact:
        std_version_row: "{{ (std_version_lookup.record | first) if (std_version_lookup.record is defined and std_version_lookup.record is not string and std_version_lookup.record is sequence and (std_version_lookup.record | length) > 0) else ((std_version_lookup.records | first) if (std_version_lookup.records is defined and std_version_lookup.records is not string and std_version_lookup.records is sequence and (std_version_lookup.records | length) > 0) else (std_version_lookup.record if (std_version_lookup.record is defined and std_version_lookup.record is mapping) else {})) }}"

    - name: Capture the record producer sys_id from the version
      when: std_version_row is defined
      ansible.builtin.set_fact:
        std_change_producer_sys_id: >-
          {{
            std_version_row.std_change_producer.value
            if (
              std_version_row.std_change_producer is defined
              and std_version_row.std_change_producer is mapping
              and (
                std_version_row.std_change_producer.value
                | default('') | string
              ) is match('^[0-9a-fA-F]{32}$')
            )
            else (
              std_version_row.std_change_producer
              if (
                std_version_row.std_change_producer is defined
                and std_version_row.std_change_producer is string
                and (std_version_row.std_change_producer | string)
                is match('^[0-9a-fA-F]{32}$')
              )
              else ''
            )
          }}

    - name: Read the Standard Change record producer
      when:
        - std_change_producer_sys_id is defined
        - std_change_producer_sys_id | length == 32
      servicenow.itsm.api_info:
        resource: std_change_record_producer
        sysparm_query: "sys_id={{ std_change_producer_sys_id }}"
        exclude_reference_link: true
      register: std_producer_lookup
      no_log: true

    - name: Select the record producer row
      when: std_producer_lookup is not skipped
      ansible.builtin.set_fact:
        std_producer_row: "{{ (std_producer_lookup.record | first) if (std_producer_lookup.record is defined and std_producer_lookup.record is not string and std_producer_lookup.record is sequence and (std_producer_lookup.record | length) > 0) else ((std_producer_lookup.records | first) if (std_producer_lookup.records is defined and std_producer_lookup.records is not string and std_producer_lookup.records is sequence and (std_producer_lookup.records | length) > 0) else (std_producer_lookup.record if (std_producer_lookup.record is defined and std_producer_lookup.record is mapping) else {})) }}"

    - name: Build the sanitized template lookup
      ansible.builtin.set_fact:
        std_template_lookup_lines: "{{ _std_template_lookup_json | from_json }}"
      vars:
        _std_safe_fields:
          - name
          - number
          - version
          - current
          - active
          - sys_class_name
        _std_template_lookup_json: |
          {% macro field_state(row, field_name) -%}
          {%- if row is not mapping or field_name not in row -%}
          NOT PRESENT
          {%- elif row[field_name] is mapping and (row[field_name].value | default('') | string | length) > 0 -%}
          POPULATED
          {%- elif row[field_name] is string and (row[field_name] | length) > 0 -%}
          POPULATED
          {%- elif row[field_name] is not string and row[field_name] is sequence and (row[field_name] | length) > 0 -%}
          POPULATED
          {%- elif row[field_name] is boolean or row[field_name] is number -%}
          POPULATED
          {%- else -%}
          EMPTY
          {%- endif -%}
          {% endmacro %}
          {% macro safe_value(row, field_name) -%}
          {%- if row is not mapping or field_name not in row -%}
          NOT PRESENT
          {%- elif row[field_name] is string and (row[field_name] | length) <= 80 and '\n' not in row[field_name] -%}
          {{ row[field_name] }}
          {%- elif row[field_name] is boolean or row[field_name] is number -%}
          {{ row[field_name] }}
          {%- else -%}
          {{ field_state(row, field_name) }}
          {%- endif -%}
          {% endmacro %}
          {% set version = std_version_row | default({}) %}
          {% set producer = std_producer_row | default({}) %}
          {% set ns = namespace(lines=[]) %}
          {% set ns.lines = ns.lines + ['Standard Change template lookup'] %}
          {% if std_change_version_sys_id | default('') | length != 32 %}
          {% set ns.lines = ns.lines + ['Version sys_id: NOT DETERMINED. std_change_producer_version was not a 32-character sys_id.'] %}
          {% else %}
          {% set ns.lines = ns.lines + ['Version table: std_change_producer_version'] %}
          {% set ns.lines = ns.lines + ['Version sys_id: ' ~ std_change_version_sys_id] %}
          {% if version is mapping and (version | length) > 0 %}
          {% set ns.lines = ns.lines + ['Version record: FOUND'] %}
          {% set ns.lines = ns.lines + ['Version field names: ' ~ (version.keys() | list | sort | join(', '))] %}
          {% for field_name in _std_safe_fields %}
          {% set ns.lines = ns.lines + ['Version ' ~ field_name ~ ': ' ~ (safe_value(version, field_name) | trim)] %}
          {% endfor %}
          {% set ns.lines = ns.lines + ['Version template field: ' ~ (field_state(version, 'template') | trim)] %}
          {% if version.template is defined and version.template is string and version.template is match('^\\s*\\{') %}
          {% set template_fields = version.template | regex_findall('"([A-Za-z0-9_]+)"\\s*:') %}
          {% set ns.lines = ns.lines + ['Version template JSON field names: ' ~ ((template_fields | unique | sort | join(', ')) if (template_fields | length) > 0 else 'NOT DETERMINED')] %}
          {% elif version.template is defined and version.template is mapping %}
          {% set ns.lines = ns.lines + ['Version template JSON field names: ' ~ (version.template.keys() | list | sort | join(', '))] %}
          {% else %}
          {% set ns.lines = ns.lines + ['Version template JSON field names: NOT DETERMINED'] %}
          {% endif %}
          {% else %}
          {% set ns.lines = ns.lines + ['Version record: NOT FOUND. The sys_id did not return a std_change_producer_version row.'] %}
          {% endif %}
          {% endif %}
          {% if std_change_producer_sys_id | default('') | length != 32 %}
          {% set ns.lines = ns.lines + ['Record producer: NOT DETERMINED. The version record has no std_change_producer sys_id.'] %}
          {% else %}
          {% set ns.lines = ns.lines + ['Record producer field: std_change_producer'] %}
          {% set ns.lines = ns.lines + ['Record producer table queried: std_change_record_producer'] %}
          {% set ns.lines = ns.lines + ['Record producer sys_id: ' ~ std_change_producer_sys_id] %}
          {% if producer is mapping and (producer | length) > 0 %}
          {% set ns.lines = ns.lines + ['Record producer record: FOUND'] %}
          {% set ns.lines = ns.lines + ['Record producer field names: ' ~ (producer.keys() | list | sort | join(', '))] %}
          {% for field_name in _std_safe_fields %}
          {% set ns.lines = ns.lines + ['Record producer ' ~ field_name ~ ': ' ~ (safe_value(producer, field_name) | trim)] %}
          {% endfor %}
          {% set ns.lines = ns.lines + ['Record producer template field: ' ~ (field_state(producer, 'template') | trim)] %}
          {% set ns.lines = ns.lines + ['Record producer script field: ' ~ (field_state(producer, 'script') | trim)] %}
          {% else %}
          {% set ns.lines = ns.lines + ['Record producer record: NOT FOUND on std_change_record_producer. The producer table or identifier could not be confirmed.'] %}
          {% endif %}
          {% endif %}
          {% set ns.lines = ns.lines + ['Creation field names: change_request.std_change_producer_version, std_change_producer_version.sys_id, std_change_producer_version.std_change_producer, std_change_record_producer.sys_id'] %}
          {% set ns.lines = ns.lines + ['Instantiation method: NOT DETERMINED. No API path was present. Template and script contents were not displayed.'] %}
          {{ ns.lines | to_json }}

    - name: Display sanitized template lookup
      ansible.builtin.debug:
        msg: "{{ std_template_lookup_lines }}"

    - name: Build the Service Catalog item URL
      when: std_change_producer_sys_id | default('') | length == 32
      ansible.builtin.set_fact:
        std_catalog_item_url: "{{ _std_catalog_base ~ '/api/sn_sc/servicecatalog/items/' ~ std_change_producer_sys_id }}"
      vars:
        _std_catalog_base: "{{ lookup('ansible.builtin.env', 'SN_HOST') | trim | regex_replace('/+$', '') }}"
      no_log: true

    - name: Read the record producer through the Service Catalog API
      when:
        - std_catalog_item_url is defined
        - std_catalog_item_url is match('^https://\S+/api/sn_sc/servicecatalog/items/[0-9a-fA-F]{32}$')
      ansible.builtin.uri:
        url: "{{ std_catalog_item_url }}"
        method: GET
        url_username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') }}"
        url_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') }}"
        force_basic_auth: true
        use_netrc: false
        validate_certs: true
        status_code:
          - 200
          - 401
          - 403
          - 404
        headers:
          Accept: application/json
      register: std_catalog_item
      no_log: true

    - name: Build the sanitized Service Catalog lookup
      ansible.builtin.set_fact:
        std_catalog_lookup_lines: "{{ _std_catalog_lookup_json | from_json }}"
      no_log: true
      vars:
        _std_catalog_safe_fields:
          - name
          - sys_class_name
          - type
          - active
        _std_catalog_lookup_json: |
          {% set producer_id = std_change_producer_sys_id | default('') %}
          {% set catalog_url = std_catalog_item_url | default('') %}
          {% set catalog = std_catalog_item | default({}) %}
          {% set result = {} %}
          {% if catalog is mapping and catalog.status is defined and catalog.json is defined and catalog.json is mapping and catalog.json.result is defined and catalog.json.result is mapping %}
          {% set result = catalog.json.result %}
          {% endif %}
          {% set ns = namespace(lines=[]) %}
          {% set ns.lines = ns.lines + ['Service Catalog item lookup'] %}
          {% if producer_id | length != 32 %}
          {% set ns.lines = ns.lines + ['Service Catalog API: NOT ATTEMPTED. The record producer sys_id was not available.'] %}
          {% elif catalog_url is not match('^https://\\S+/api/sn_sc/servicecatalog/items/[0-9a-fA-F]{32}$') %}
          {% set ns.lines = ns.lines + ['Service Catalog API: NOT ATTEMPTED. SN_HOST was not available as an https URL.'] %}
          {% elif catalog is not mapping or catalog is skipped or catalog.status is not defined %}
          {% set ns.lines = ns.lines + ['Service Catalog API: NOT ATTEMPTED. The GET did not return an HTTP status.'] %}
          {% else %}
          {% set ns.lines = ns.lines + ['Service Catalog request: GET /api/sn_sc/servicecatalog/items/' ~ producer_id] %}
          {% set ns.lines = ns.lines + ['HTTP status: ' ~ (catalog.status | string)] %}
          {% if catalog.status | int == 200 and (result | length) > 0 %}
          {% set ns.lines = ns.lines + ['Service Catalog item: RECOGNIZED'] %}
          {% set ns.lines = ns.lines + ['Result field names: ' ~ (result.keys() | list | sort | join(', '))] %}
          {% if result.sys_id is defined and result.sys_id is string and result.sys_id is match('^[0-9a-fA-F]{32}$') %}
          {% set ns.lines = ns.lines + ['Catalog item sys_id: ' ~ result.sys_id] %}
          {% set ns.lines = ns.lines + ['Catalog item sys_id matches record producer: ' ~ ((result.sys_id | lower) == (producer_id | lower))] %}
          {% else %}
          {% set ns.lines = ns.lines + ['Catalog item sys_id: NOT PRESENT'] %}
          {% endif %}
          {% for field_name in _std_catalog_safe_fields %}
          {% if result[field_name] is defined and result[field_name] is string and (result[field_name] | length) > 0 and (result[field_name] | length) <= 80 and '\n' not in result[field_name] %}
          {% set ns.lines = ns.lines + ['Catalog ' ~ field_name ~ ': ' ~ result[field_name]] %}
          {% elif result[field_name] is defined and (result[field_name] is boolean or result[field_name] is number) %}
          {% set ns.lines = ns.lines + ['Catalog ' ~ field_name ~ ': ' ~ (result[field_name] | string)] %}
          {% elif result[field_name] is defined and result[field_name] is string and (result[field_name] | length) == 0 %}
          {% set ns.lines = ns.lines + ['Catalog ' ~ field_name ~ ': EMPTY'] %}
          {% elif result[field_name] is defined %}
          {% set ns.lines = ns.lines + ['Catalog ' ~ field_name ~ ': POPULATED'] %}
          {% else %}
          {% set ns.lines = ns.lines + ['Catalog ' ~ field_name ~ ': NOT PRESENT'] %}
          {% endif %}
          {% endfor %}
          {% if result.category is defined and result.category is string and (result.category | length) > 0 and (result.category | length) <= 80 and '\n' not in result.category %}
          {% set ns.lines = ns.lines + ['Catalog category: ' ~ result.category] %}
          {% elif result.category is defined and result.category is mapping and result.category.title is defined and result.category.title is string and (result.category.title | length) > 0 and (result.category.title | length) <= 80 and '\n' not in result.category.title %}
          {% set ns.lines = ns.lines + ['Catalog category title: ' ~ result.category.title] %}
          {% elif result.category is defined and result.category is string and (result.category | length) == 0 %}
          {% set ns.lines = ns.lines + ['Catalog category: EMPTY'] %}
          {% elif result.category is defined %}
          {% set ns.lines = ns.lines + ['Catalog category: POPULATED'] %}
          {% else %}
          {% set ns.lines = ns.lines + ['Catalog category: NOT PRESENT'] %}
          {% endif %}
          {% if result.variables is defined and result.variables is not string and result.variables is sequence %}
          {% set variable_names = namespace(items=[]) %}
          {% for variable in result.variables %}
          {% if variable is mapping and variable.name is defined and variable.name is string and (variable.name | length) > 0 and (variable.name | length) <= 80 and '\n' not in variable.name %}
          {% set variable_names.items = variable_names.items + [variable.name] %}
          {% endif %}
          {% endfor %}
          {% set ns.lines = ns.lines + ['Catalog variable count: ' ~ (result.variables | length)] %}
          {% set ns.lines = ns.lines + ['Catalog variable names: ' ~ ((variable_names.items | join(', ')) if (variable_names.items | length) > 0 else 'NOT DETERMINED')] %}
          {% else %}
          {% set ns.lines = ns.lines + ['Catalog variables: NOT PRESENT'] %}
          {% endif %}
          {% elif catalog.status | int == 200 %}
          {% set ns.lines = ns.lines + ['Service Catalog item: NOT CONFIRMED. HTTP 200 did not include a result object.'] %}
          {% elif catalog.status | int == 401 %}
          {% set ns.lines = ns.lines + ['Service Catalog API access: DENIED. The existing credentials were not accepted.'] %}
          {% elif catalog.status | int == 403 %}
          {% set ns.lines = ns.lines + ['Service Catalog API access: FORBIDDEN. The credentials cannot read this catalog item.'] %}
          {% elif catalog.status | int == 404 %}
          {% set ns.lines = ns.lines + ['Service Catalog API access: NOT FOUND. This endpoint does not recognize the record producer sys_id.'] %}
          {% else %}
          {% set ns.lines = ns.lines + ['Service Catalog API access: UNEXPECTED STATUS. No response body was displayed.'] %}
          {% endif %}
          {% endif %}
          {% set ns.lines = ns.lines + ['A successful GET shows only that the Service Catalog API recognizes this record producer. It does not prove that template submission is supported.'] %}
          {{ ns.lines | to_json }}

    - name: Display sanitized Service Catalog lookup
      ansible.builtin.debug:
        msg: "{{ std_catalog_lookup_lines }}"
