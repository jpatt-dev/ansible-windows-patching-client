---
# Build a bounded diagnostic from one HTTP 400 module error.
# servicenow.itsm 2.6.3 raises UnexpectedAPIResponse as
# "Unexpected response - <status> <raw body>". On Python 3 the body is
# the bytes from HTTPError.read(), so the text contains b'{...}'.
# This file does not display that text and does not send a request.
#
# The approved DEV URL is read from
# playbooks/servicenow/standard_change_dev_instance.yml.
# The path below is literal. Job Template extra variables cannot replace
# it. The template reads that file itself, so a variable of the same name
# cannot authorize diagnostics. Matching snow_instance_url values do not.
# A missing identity file does not replace the sanitized failure message.

- name: Clear any earlier parsed error body
  ansible.builtin.set_fact:
    _snow_http_error_parsed: {}
    _snow_parse_class: ""
    _snow_dev_authorized: false
  no_log: true

- name: Record whether the Git-managed DEV file matches this instance
  ansible.builtin.set_fact:
    _snow_dev_authorized: >-
      {{
        (
          lookup(
            'ansible.builtin.file',
            lookup(
              'ansible.builtin.first_found',
              [
                'standard_change_dev_instance.yml',
                '../../playbooks/servicenow/standard_change_dev_instance.yml'
              ],
              errors='ignore'
            ) | default('__missing_dev_identity__', true),
            errors='ignore'
          ) | default('', true)
        ) is search(
          '(?m)^snow_trusted_dev_instance_url:[ \t]*'
          ~ ((snow_standard_change_instance | default('')) | regex_escape)
          ~ '[ \t]*$'
        )
      }}
  no_log: true

- name: Parse an authorized HTTP 400 body without displaying it
  when:
    - snow_dev_error_diagnostics | default(false) | bool
    - _snow_dev_authorized | bool
    - (_snow_status | trim) == '400'
  no_log: true
  vars:
    _snow_raw: "{{ snow_standard_change_module_error | default('') | string }}"
    _snow_tail: "{{ _snow_raw | regex_replace('^.*Unexpected response - [0-9]{3}', '') | trim }}"
    _snow_inner: >-
      {{
        (_snow_tail[2:-1] | trim)
        if (
          (_snow_tail | length) >= 3
          and _snow_tail is match('^b[\'"].*[\'\"]$')
        )
        else (_snow_tail | trim)
      }}
    _snow_pair: "{{ '\\\\' ~ '\\\\' }}"
    _snow_apos: "{{ '\\\\' ~ \"'\" }}"
    _snow_hex: "{{ '\\\\' ~ 'x([0-9a-fA-F]{2})' }}"
    _snow_hex_repl: "{{ '\\\\' ~ 'u00\\1' }}"
    _snow_marker: "\uE000"
    _snow_one: "{{ '\\\\' }}"
    _snow_decoded: >-
      {{
        _snow_inner
        | regex_replace(_snow_pair, _snow_marker)
        | regex_replace(_snow_apos, "'")
        | regex_replace(_snow_marker, _snow_one)
        | regex_replace(_snow_hex, _snow_hex_repl)
      }}
  block:
    - name: Record an empty HTTP 400 body
      when: (_snow_inner | length) == 0
      ansible.builtin.set_fact:
        _snow_parse_class: empty_response_body
      no_log: true

    - name: Record a body that does not start with JSON
      when:
        - _snow_parse_class == ''
        - >-
          not (_snow_inner is match('^(\{|\[)'))
      ansible.builtin.set_fact:
        _snow_parse_class: non_json_response
      no_log: true

    - name: Record a JSON body over the size limit
      when:
        - _snow_parse_class == ''
        - (_snow_inner | length) > 4000
      ansible.builtin.set_fact:
        _snow_parse_class: response_too_large
      no_log: true

    - name: Read a bounded JSON object
      when: _snow_parse_class == ''
      no_log: true
      block:
        - name: Decode the JSON object embedded in the module error
          ansible.builtin.set_fact:
            _snow_http_error_parsed: "{{ _snow_decoded | from_json }}"
            _snow_parse_class: parsed
          no_log: true
      rescue:
        - name: Record a JSON body that did not decode
          ansible.builtin.set_fact:
            _snow_http_error_parsed: {}
            _snow_parse_class: json_decode_failed
          no_log: true
  rescue:
    - name: Discard an HTTP 400 body that could not be classified
      ansible.builtin.set_fact:
        _snow_http_error_parsed: {}
        _snow_parse_class: json_decode_failed
      no_log: true

- name: Keep only an allowlisted diagnostic
  ansible.builtin.set_fact:
    snow_standard_change_diagnostic: "{{ _snow_diag_json | trim | from_json }}"
    _snow_http_error_parsed: {}
  no_log: true
  vars:
    _snow_opt_in: "{{ snow_dev_error_diagnostics | default(false) | bool }}"
    _snow_withhold: "{{ _snow_status in ['401', '403'] or ('Failed to authenticate' in (snow_standard_change_module_error | default('') | string)) }}"
    _snow_diag_json: |
      {% set identity_candidates = [
        'standard_change_dev_instance.yml',
        '../../playbooks/servicenow/standard_change_dev_instance.yml'
      ] %}
      {% set identity_file = lookup('ansible.builtin.first_found', identity_candidates, errors='ignore') | default('', true) %}
      {% set identity_raw = lookup('ansible.builtin.file', identity_file, errors='ignore') if ((identity_file | string | length) > 0) else '' %}
      {% set identity = (identity_raw | from_yaml) if ((identity_raw | string | length) > 0) else {} %}
      {% set dev_url = (
        identity.snow_trusted_dev_instance_url | default('')
        if (identity is mapping) else ''
      ) | string | trim | regex_replace('/+$', '') %}
      {% set instance = snow_standard_change_instance | default('') | string %}
      {% set dev_https = dev_url is match('^https://[A-Za-z0-9.-]+(?::[0-9]{1,5})?$') %}
      {% set dev_authorized = dev_https and (dev_url == instance) %}
      {% set parsed = _snow_http_error_parsed | default({}) %}
      {% set error = parsed.error if (parsed is mapping and parsed.error is defined and parsed.error is mapping) else {} %}
      {% set message = error.message | default('') | string %}
      {% set detail = error.detail if (error.detail is defined) else '' %}
      {% set detail_text = detail | string if (detail is string) else '' %}
      {% set haystack = (message ~ ' ' ~ detail_text) | lower %}
      {% set approved = [
        'planned_start_date', 'planned_end_date', 'work_start', 'work_end',
        'start_date', 'end_date', 'cab_date', 'cmdb_ci', 'assignment_group',
        'assigned_to', 'requested_by', 'short_description', 'justification',
        'implementation_plan', 'risk_impact_analysis', 'backout_plan',
        'test_plan', 'std_change_producer_version', 'chg_model', 'category',
        'priority', 'risk', 'impact', 'urgency', 'type', 'state'
      ] %}
      {% set blocked = [
        'password', 'passwd', 'secret', 'token', 'authorization',
        'cookie', 'credential', 'username', 'bearer', 'session'
      ] %}
      {% set key_allow = ['error', 'status', 'result', 'message', 'detail', 'reason'] %}
      {% set key_ns = namespace(found=[]) %}
      {% if parsed is mapping %}
      {% for key in key_allow %}
      {% if key in parsed %}
      {% set key_ns.found = key_ns.found + [key] %}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% set ns = namespace(category='', code='', field='', keys=[], show=false) %}
      {% if (not (_snow_opt_in | bool)) or (_snow_withhold | bool) %}
      {% elif not dev_https %}
      {% set ns.show = true %}
      {% set ns.category = 'diagnostics_not_configured' %}
      {% elif not dev_authorized %}
      {% set ns.show = true %}
      {% set ns.category = 'diagnostics_not_authorized' %}
      {% elif (_snow_status | trim) != '400' %}
      {% elif _snow_parse_class in ['empty_response_body', 'non_json_response', 'json_decode_failed', 'response_too_large'] %}
      {% set ns.show = true %}
      {% set ns.category = _snow_parse_class %}
      {% elif 'required role' in haystack or 'permission denied' in haystack or 'insufficient privilege' in haystack %}
      {% set ns.show = true %}
      {% set ns.category = 'unclassified' %}
      {% elif 'template' in haystack and ('not found' in haystack or 'invalid' in haystack or 'unknown' in haystack or 'rejected' in haystack) %}
      {% set ns.show = true %}
      {% set ns.category = 'template_rejected' %}
      {% elif 'mandatory' in haystack or 'required' in haystack or 'missing' in haystack %}
      {% set ns.show = true %}
      {% set ns.category = 'missing_required_field' %}
      {% elif 'invalid' in haystack or 'data policy' in haystack %}
      {% set ns.show = true %}
      {% set ns.category = 'invalid_field' if (detail is string and (detail | length) > 0) else 'invalid_request_body' %}
      {% else %}
      {% set ns.show = true %}
      {% set ns.category = 'json_unrecognized_structure' %}
      {% set ns.keys = key_ns.found %}
      {% endif %}
      {% if ns.show and message is match('^[A-Za-z0-9_]{1,40}$') %}
      {% set ns.code = message %}
      {% endif %}
      {% if (ns.code | length) > 0 %}
      {% for word in blocked %}
      {% if word in (ns.code | lower) %}
      {% set ns.code = '' %}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% if ns.category in ['missing_required_field', 'invalid_field'] and detail is string %}
      {% for token in detail | regex_findall('([a-z][a-z0-9_]{1,40}) is (?:mandatory|required|invalid|missing)') %}
      {% if (ns.field | length) == 0 and token in approved and token not in blocked %}
      {% set ns.field = token %}
      {% endif %}
      {% endfor %}
      {% if (ns.field | length) == 0 %}
      {% for token in detail | regex_findall('(?:mandatory|required|invalid|missing) field[: ]+([a-z][a-z0-9_]{1,40})') %}
      {% if (ns.field | length) == 0 and token in approved and token not in blocked %}
      {% set ns.field = token %}
      {% endif %}
      {% endfor %}
      {% endif %}
      {% elif ns.category in ['missing_required_field', 'invalid_field'] and detail is not string and detail is sequence and (detail | length) > 0 %}
      {% set named_item = detail[0] %}
      {% if named_item is string and named_item in approved and named_item not in blocked %}
      {% set ns.field = named_item %}
      {% elif named_item is mapping %}
      {% set named = named_item.field | default(named_item.name | default('')) | string %}
      {% if named in approved and named not in blocked %}
      {% set ns.field = named %}
      {% endif %}
      {% endif %}
      {% elif ns.category in ['missing_required_field', 'invalid_field'] and detail is mapping and (detail.keys() | list | length) == 1 %}
      {% set named = (detail.keys() | list)[0] | string %}
      {% if named in approved and named not in blocked %}
      {% set ns.field = named %}
      {% endif %}
      {% endif %}
      {% if ns.category == 'invalid_field' and (ns.field | length) == 0 %}
      {% set ns.category = 'invalid_request_body' %}
      {% endif %}
      {{
        {
          'show': ns.show,
          'category': ns.category,
          'error_code': ns.code,
          'field': ns.field,
          'top_keys': ns.keys
        } | to_json
      }}
