---
# Compare the AAP ServiceNow credential with the validated target.
# This file does not call ServiceNow. The password is not displayed.

- name: Check the existing ServiceNow credential without logging it
  ansible.builtin.set_fact:
    snow_credential_ready: "{{ _snow_credential_ready }}"
    snow_credential_failure: "{{ _snow_credential_failure }}"
  no_log: true
  vars:
    _snow_username: "{{ lookup('ansible.builtin.env', 'SN_USERNAME') | trim }}"
    _snow_password: "{{ lookup('ansible.builtin.env', 'SN_PASSWORD') | trim }}"
    _snow_host: "{{ lookup('ansible.builtin.env', 'SN_HOST') | trim | regex_replace('/+$', '') }}"
    _snow_credential_ready: >-
      {{
        (_snow_username | length) > 0
        and (_snow_password | length) > 0
        and (_snow_host | length) > 0
        and (_snow_host == snow_standard_change_instance)
      }}
    _snow_credential_failure: >-
      {{
        'missing_host'
        if (_snow_host | length) == 0
        else (
          'host_mismatch'
          if (_snow_host != snow_standard_change_instance)
          else (
            'missing_username'
            if (_snow_username | length) == 0
            else (
              'missing_password'
              if (_snow_password | length) == 0
              else ''
            )
          )
        )
      }}

- name: Require SN_HOST, SN_USERNAME, and SN_PASSWORD before the POST
  when: not (snow_credential_ready | bool)
  ansible.builtin.fail:
    msg: >-
      The AAP credential was rejected ({{ snow_credential_failure }}).
      SN_HOST must be nonempty and must exactly match snow_instance_url.
      SN_USERNAME and SN_PASSWORD are required.
      No ServiceNow request was sent.
