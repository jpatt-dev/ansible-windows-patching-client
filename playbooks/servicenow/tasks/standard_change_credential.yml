---
# Bind the visible SN_HOST to the validated nonproduction instance.
# This file does not call ServiceNow and does not read the password.
# An empty username or password lookup is not proof that the AAP
# credential is missing. servicenow.itsm reads those values itself.

- name: Compare the visible SN_HOST with the validated instance
  ansible.builtin.set_fact:
    snow_credential_ready: "{{ _snow_credential_ready }}"
    snow_credential_failure: "{{ _snow_credential_failure }}"
  no_log: true
  vars:
    _snow_host: "{{ lookup('ansible.builtin.env', 'SN_HOST') | trim | regex_replace('/+$', '') }}"
    _snow_credential_ready: >-
      {{
        (_snow_host | length) > 0
        and (_snow_host == snow_standard_change_instance)
      }}
    _snow_credential_failure: >-
      {{
        'missing_host'
        if (_snow_host | length) == 0
        else 'host_mismatch'
      }}

- name: Require the visible SN_HOST to match the validated instance
  when: not (snow_credential_ready | bool)
  ansible.builtin.fail:
    msg: >-
      The ServiceNow instance could not be bound
      ({{ snow_credential_failure }}).
      SN_HOST must be visible to the play and must exactly match
      snow_instance_url. An empty username or password lookup is not
      treated as a missing credential. No ServiceNow request was sent.
