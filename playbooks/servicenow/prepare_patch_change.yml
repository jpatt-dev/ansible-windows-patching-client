---
# Prepare one ServiceNow change for a Windows patch wave.
#
# Launch this job with an AAP Limit of windows_wave_1 through windows_wave_20.
# The play targets windows_hosts and uses connection local, so it does not
# open WinRM sessions. ansible_limit is the only wave selector. patch_wave_name
# is not read. Each host's inventory variable sys_id is the CMDB CI sys_id.
#
# An empty wave matches no hosts, so Ansible skips this play before these
# tasks can fail it. Inventory acceptance must reject an empty wave group.
#
# Defaults do not create or modify ServiceNow records:
#   snow_prepare_preview_only: true
#   snow_prepare_allow_create: false
#
# Preview, Limit windows_wave_1. Preview lists the selected hosts and their
# inventory sys_id values. It does not call ServiceNow.
#   snow_prepare_preview_only: true
#
# Execute, after preview looks right. Limit windows_wave_1:
#   snow_prepare_preview_only: false
#   snow_prepare_allow_create: true
#
# The approved Standard Change template supplies assignment group, category,
# justification, implementation plan, backout plan, short description,
# description, and the Change primary CI. This job does not send those
# fields. It POSTs once to
# /api/sn_chg_rest/change/standard/{snow_standard_change_template_id}
# and then associates every selected inventory sys_id. It does not open a
# Normal Change.
#
# Resume CI association for a change that already exists. This does not
# create another change. Limit remains the same wave:
#   snow_prepare_preview_only: false
#   snow_prepare_existing_change_number: CHG0001234
#
# Creation uses the shared Standard Change POST. snow_prepare_standard_change
# stays true. snow_standard_change_template_id, snow_instance_url, and
# snow_nonproduction_instance_url are administrator settings, not survey
# inputs. snow_confirm_create must also be true before the POST is sent.
# An existing change number still wins: this play reads that change and
# does not instantiate a template. A failed or unconfirmed POST is not
# retried. See docs/operations.md.

- name: Prepare the ServiceNow change for the AAP Limit wave
  hosts: windows_hosts
  connection: local
  gather_facts: false
  vars:
    snow_prepare_existing_change_number: ""
    snow_prepare_allow_create: false
    snow_prepare_preview_only: true
    snow_prepare_standard_change: true
    snow_standard_change_template_id: ""
    snow_instance_url: ""
    snow_nonproduction_instance_url: ""
    snow_confirm_create: false
    snow_change_payload: {}
    snow_dev_error_diagnostics: false
    snow_prepare_supported_waves:
      - windows_wave_1
      - windows_wave_2
      - windows_wave_3
      - windows_wave_4
      - windows_wave_5
      - windows_wave_6
      - windows_wave_7
      - windows_wave_8
      - windows_wave_9
      - windows_wave_10
      - windows_wave_11
      - windows_wave_12
      - windows_wave_13
      - windows_wave_14
      - windows_wave_15
      - windows_wave_16
      - windows_wave_17
      - windows_wave_18
      - windows_wave_19
      - windows_wave_20
  tasks:
    - name: Prepare one change for the hosts selected by the AAP Limit
      ansible.builtin.include_tasks: tasks/prepare_patch_change.yml
      run_once: true
