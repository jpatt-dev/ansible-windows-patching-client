---
# Windows patch discovery (search-only for WSUS). Never installs.
#
# CLI:
#   ansible-playbook -i /path/to/client-inventory \
#     playbooks/windows/patch_discovery.yml

- name: Windows patch discovery
  hosts: windows_hosts
  gather_facts: false
  serial: "{{ patch_serial | default(omit) }}"
  tags:
    - discovery
    - windows
    - patching

  pre_tasks:
    - name: Include shared orchestration validation
      ansible.builtin.include_role:
        name: patch_common
      vars:
        patch_default_target: windows_hosts
        patch_enforce_scoped_target: false
      tags:
        - always

  roles:
    - role: windows_patch
      vars:
        patch_phase: discovery

# Serial-safe workflow-global artifact for Final Patch Report.
- name: Windows patch discovery — publish workflow-global phase artifact
  hosts: windows_hosts
  gather_facts: false
  connection: local
  tags:
    - discovery
    - windows
    - patching
    - report

  tasks:
    - name: Publish patch_phase_discovery host-keyed artifact
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: publish_workflow_phase.yml
      vars:
        patch_workflow_phase_key: discovery
      run_once: true
      tags:
        - always
        - report
