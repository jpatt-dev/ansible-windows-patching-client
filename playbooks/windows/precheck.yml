---
# Windows Patch Precheck (standalone read-only entrypoint).
# Validates provider/source, exceptions, app metadata, health, and updates search.
# Never installs. Fail-closed: blocked or failed precheck_status fails the host
# after structured evidence is recorded (windows_precheck_fail_on_blocked default true).
# ignore_unreachable keeps Ansible-unreachable hosts in the play so evidence is
# recorded before the fail-closed assertion.
#
# CLI:
#   ansible-playbook -i /path/to/client-inventory \
#     playbooks/windows/precheck.yml

- name: Windows patch precheck
  hosts: windows_hosts
  gather_facts: false
  serial: "{{ patch_serial | default(omit) }}"
  ignore_unreachable: true
  tags:
    - precheck
    - windows
    - patching

  pre_tasks:
    - name: Include shared orchestration validation
      ansible.builtin.include_role:
        name: patch_common
      vars:
        patch_default_target: windows_hosts
        patch_enforce_scoped_target: false
      tags:
        - always

  roles:
    - role: windows_patch
      vars:
        patch_phase: precheck

  post_tasks:
    - name: Update ServiceNow work notes after precheck
      ansible.builtin.include_role:
        name: servicenow_change
      vars:
        snow_phase: work_notes
        snow_work_note_message: >-
          AAP Windows patch precheck completed for scope
          {{ patch_target_scope | default('not_available') }}
          (wave={{ patch_wave_name | default('unspecified') }}).
      run_once: true
      tags:
        - always
        - servicenow
