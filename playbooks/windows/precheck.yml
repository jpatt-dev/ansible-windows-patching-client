---
# Windows Patch Precheck (short name)
# Read-only: provider/source, exceptions, app metadata, health, updates search.
# Never installs.
#
# CLI:
#   ansible-playbook -i /path/to/client-inventory \
#     playbooks/windows/precheck.yml

- name: Windows patch precheck
  hosts: windows_hosts
  gather_facts: false
  serial: "{{ patch_serial | default(omit) }}"
  tags:
    - precheck
    - windows
    - patching

  pre_tasks:
    - name: Include shared orchestration validation
      ansible.builtin.include_role:
        name: patch_common
      vars:
        patch_default_target: windows_hosts
        patch_enforce_scoped_target: false
      tags:
        - always

  roles:
    - role: windows_patch
      vars:
        patch_phase: precheck

  post_tasks:
    - name: Update ServiceNow work notes after precheck
      ansible.builtin.include_role:
        name: servicenow_change
      vars:
        snow_phase: work_notes
        snow_work_note_message: >-
          AAP Windows patch precheck completed for scope
          {{ patch_target_scope | default('not_available') }}
          (wave={{ patch_wave_name | default('unspecified') }}).
      run_once: true
      tags:
        - always
        - servicenow

# Serial-safe workflow-global artifact for Final Patch Report.
# run_once under serial is batch-scoped; publish after all hosts finish Play 1.
- name: Windows patch precheck — publish workflow-global phase artifact
  hosts: windows_hosts
  gather_facts: false
  connection: local
  tags:
    - precheck
    - windows
    - patching
    - report

  tasks:
    - name: Publish patch_phase_precheck host-keyed artifact
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: publish_workflow_phase.yml
      vars:
        patch_workflow_phase_key: precheck
      run_once: true
      tags:
        - always
        - report
