---
# Production single-job entrypoint for the complete Windows patch lifecycle.
# Play 1 runs precheck through per-host final reporting (serial).
# Reducing patch_serial increases wall-clock time; fit a maintenance window by
# shrinking Limit host count or raising approved concurrency, not by lowering serial.
# Play 2 aggregates the Limit population (non-serial, local).
# Standalone troubleshooting entrypoint is playbooks/windows/precheck.yml.
# Ineligible hosts (precheck blocked/failed/missing/unknown) skip remediation
# but remain in the play for reporting. Does not use meta: end_host.
# ignore_unreachable keeps Ansible-unreachable hosts in the play so final_build
# can still record result=failed / reason_code=UNREACHABLE.
#
# CLI:
#   ansible-playbook -i /path/to/client-inventory \
#     playbooks/windows/full_patch.yml

- name: Windows full patch transaction
  hosts: windows_hosts
  gather_facts: false
  serial: "{{ patch_serial | default(1) }}"
  ignore_unreachable: true
  vars:
    snow_change_window_gate_enabled: false
  tags:
    - windows
    - patching

  tasks:
    - name: Include shared orchestration validation
      ansible.builtin.include_role:
        name: patch_common
      vars:
        patch_default_target: windows_hosts
        patch_enforce_scoped_target: true
      tags:
        - always

    - name: Initialize lifecycle phase tracking
      ansible.builtin.set_fact:
        patch_lifecycle_current_phase: ""
        patch_lifecycle_last_completed_phase: ""
        patch_lifecycle_failed_phase: ""
        patch_lifecycle_failure_timestamp_utc: not_available
        patch_lifecycle_reboot_recovery_failed: not_available
      changed_when: false

    - name: Mark precheck as the current lifecycle phase
      ansible.builtin.set_fact:
        patch_lifecycle_current_phase: precheck
      when: not (patch_lifecycle_failed | default(false) | bool)
      changed_when: false

    - name: Run Windows precheck
      block:
        - name: Include Windows precheck
          ansible.builtin.include_role:
            name: windows_patch
          vars:
            patch_phase: precheck
            windows_precheck_fail_on_blocked: false
          when: not (patch_lifecycle_failed | default(false) | bool)
      rescue:
        - name: Keep an unexpected precheck failure on this host
          ansible.builtin.include_tasks: tasks/record_unexpected_failure.yml
          vars:
            patch_unexpected_phase: precheck

    - name: Preserve precheck phase result
      ansible.builtin.set_fact:
        patch_phase_precheck: "{{ { inventory_hostname: patch_result } }}"
      when: (patch_result.phase | default('')) == 'precheck'
      changed_when: false

    - name: Record the precheck lifecycle outcome
      ansible.builtin.include_tasks: tasks/record_phase_outcome.yml
      vars:
        patch_outcome_phase: precheck
      when: (patch_result.phase | default('')) == 'precheck'

    - name: Clear the lifecycle phase after precheck
      ansible.builtin.set_fact:
        patch_lifecycle_current_phase: ""
      when: (patch_lifecycle_current_phase | default('')) == 'precheck'
      changed_when: false

    - name: Determine host eligibility from precheck status
      ansible.builtin.set_fact:
        patch_host_eligible: >-
          {{
            (not (patch_lifecycle_failed | default(false) | bool))
            and ((precheck_status | default('missing')) in ['passed', 'warning'])
          }}
      changed_when: false

    - name: Check the approved change window before remediation
      when: snow_change_window_gate_enabled | default(false) | bool
      ansible.builtin.include_tasks: tasks/snow_change_window_gate.yml
      run_once: true

    - name: Continue patch lifecycle for eligible hosts
      when:
        - patch_host_eligible | bool
        - not (hostvars['localhost']['snow_change_window_blocks_remediation'] | default(false) | bool)
      block:
        - name: Clear the lifecycle phase before ServiceNow validation
          ansible.builtin.set_fact:
            patch_lifecycle_current_phase: ""
          changed_when: false

        - name: Validate ServiceNow change for this host before remediation
          ansible.builtin.include_role:
            name: servicenow_change
          vars:
            snow_phase: validate
          tags:
            - always
            - servicenow

        - name: Mark discovery as the current lifecycle phase
          ansible.builtin.set_fact:
            patch_lifecycle_current_phase: discovery
          changed_when: false

        - name: Run Windows discovery
          ansible.builtin.include_role:
            name: windows_patch
          vars:
            patch_phase: discovery

        - name: Preserve discovery phase result
          ansible.builtin.set_fact:
            patch_phase_discovery: "{{ { inventory_hostname: patch_result } }}"
          when: (patch_result.phase | default('')) == 'discovery'
          changed_when: false

        - name: Record the discovery lifecycle outcome
          ansible.builtin.include_tasks: tasks/record_phase_outcome.yml
          vars:
            patch_outcome_phase: discovery
          when: (patch_result.phase | default('')) == 'discovery'

        - name: Clear the lifecycle phase before applicable-update confirmation
          ansible.builtin.set_fact:
            patch_lifecycle_current_phase: ""
          changed_when: false

        - name: Confirm whether discovery found applicable updates
          ansible.builtin.include_role:
            name: windows_patch
            tasks_from: confirm_applicable_updates.yml

        - name: Mark pre-patch reboot as the current lifecycle phase
          ansible.builtin.set_fact:
            patch_lifecycle_current_phase: pre_patch_reboot
          when:
            - windows_applicable_updates_present | bool
            - patch_apply_enabled | default(false) | bool
          changed_when: false

        - name: Run Windows pre-patch reboot
          when:
            - windows_applicable_updates_present | bool
            - patch_apply_enabled | default(false) | bool
          ansible.builtin.include_role:
            name: windows_patch
          vars:
            patch_phase: reboot
            reboot_phase: pre

        - name: Preserve pre-patch reboot phase result
          ansible.builtin.set_fact:
            patch_phase_reboot_pre: "{{ { inventory_hostname: patch_result } }}"
          when: (patch_result.phase | default('')) == 'reboot_pre'
          changed_when: false

        - name: Record the pre-patch reboot lifecycle outcome
          ansible.builtin.include_tasks: tasks/record_phase_outcome.yml
          vars:
            patch_outcome_phase: pre_patch_reboot
          when: (patch_result.phase | default('')) == 'reboot_pre'

        - name: Clear the lifecycle phase after pre-patch reboot
          ansible.builtin.set_fact:
            patch_lifecycle_current_phase: ""
          when: (patch_lifecycle_current_phase | default('')) == 'pre_patch_reboot'
          changed_when: false

        - name: Mark apply as the current lifecycle phase
          ansible.builtin.set_fact:
            patch_lifecycle_current_phase: apply
          when: windows_applicable_updates_present | bool
          changed_when: false

        - name: Run Windows apply
          when: windows_applicable_updates_present | bool
          ansible.builtin.include_role:
            name: windows_patch
          vars:
            patch_phase: apply

        - name: Preserve apply phase result
          ansible.builtin.set_fact:
            patch_phase_apply: "{{ { inventory_hostname: patch_result } }}"
          when: (patch_result.phase | default('')) == 'apply'
          changed_when: false

        - name: Record the apply lifecycle outcome
          ansible.builtin.include_tasks: tasks/record_phase_outcome.yml
          vars:
            patch_outcome_phase: apply
          when: (patch_result.phase | default('')) == 'apply'

        - name: Clear the lifecycle phase before post-patch update confirmation
          ansible.builtin.set_fact:
            patch_lifecycle_current_phase: ""
          changed_when: false

        - name: Confirm whether this install justifies a post-patch reboot
          ansible.builtin.include_role:
            name: windows_patch
            tasks_from: confirm_applicable_updates.yml

        - name: Mark post-patch reboot as the current lifecycle phase
          ansible.builtin.set_fact:
            patch_lifecycle_current_phase: post_patch_reboot
          when:
            - windows_post_patch_reboot_justified | bool
            - patch_apply_enabled | default(false) | bool
          changed_when: false

        - name: Run Windows post-patch reboot
          when:
            - windows_post_patch_reboot_justified | bool
            - patch_apply_enabled | default(false) | bool
          ansible.builtin.include_role:
            name: windows_patch
          vars:
            patch_phase: reboot
            reboot_phase: post

        - name: Preserve post-patch reboot phase result
          ansible.builtin.set_fact:
            patch_phase_reboot_post: "{{ { inventory_hostname: patch_result } }}"
          when: (patch_result.phase | default('')) == 'reboot_post'
          changed_when: false

        - name: Record the post-patch reboot lifecycle outcome
          ansible.builtin.include_tasks: tasks/record_phase_outcome.yml
          vars:
            patch_outcome_phase: post_patch_reboot
          when: (patch_result.phase | default('')) == 'reboot_post'

        - name: Clear the lifecycle phase after post-patch reboot
          ansible.builtin.set_fact:
            patch_lifecycle_current_phase: ""
          when: (patch_lifecycle_current_phase | default('')) == 'post_patch_reboot'
          changed_when: false

        - name: Mark postcheck as the current lifecycle phase
          ansible.builtin.set_fact:
            patch_lifecycle_current_phase: postcheck
          changed_when: false

        - name: Run Windows postcheck
          ansible.builtin.include_role:
            name: windows_patch
          vars:
            patch_phase: postcheck

        - name: Preserve postcheck phase result
          ansible.builtin.set_fact:
            patch_phase_postcheck: "{{ { inventory_hostname: patch_result } }}"
          when: (patch_result.phase | default('')) == 'postcheck'
          changed_when: false

        - name: Record the postcheck lifecycle outcome
          ansible.builtin.include_tasks: tasks/record_phase_outcome.yml
          vars:
            patch_outcome_phase: postcheck
          when: (patch_result.phase | default('')) == 'postcheck'

        - name: Clear the lifecycle phase after postcheck
          ansible.builtin.set_fact:
            patch_lifecycle_current_phase: ""
          when: (patch_lifecycle_current_phase | default('')) == 'postcheck'
          changed_when: false

      rescue:
        - name: Record remediation lifecycle failure without ending the host
          ansible.builtin.set_fact:
            patch_lifecycle_failed: true
            patch_lifecycle_failed_message: >-
              {{ ansible_failed_result.msg | default('Windows full patch remediation lifecycle failed') }}
          when: ansible_failed_result is defined
          changed_when: false

        - name: Record the remediation failure location without changing the message
          ansible.builtin.include_tasks: tasks/note_lifecycle_failure.yml

        - name: Report remediation lifecycle failure for later host reporting
          ansible.builtin.debug:
            msg: >-
              Remediation lifecycle failed on {{ inventory_hostname }}.
              Remaining phases were not run. Final reporting will use preserved
              phase history only ({{ patch_lifecycle_failed_message }}).
          changed_when: false

    - name: Clear the lifecycle phase before final health collection
      ansible.builtin.set_fact:
        patch_lifecycle_current_phase: ""
      changed_when: false

    - name: Collect final host identity and health for reporting
      when: windows_connectivity_ok | default(false) | bool
      tags:
        - report
      block:
        - name: Collect final host health
          ansible.builtin.include_role:
            name: windows_patch
            tasks_from: collect_host_health.yml
      rescue:
        - name: Keep an unexpected final health failure on this host
          ansible.builtin.include_tasks: tasks/record_unexpected_failure.yml
          vars:
            patch_unexpected_phase: final health collection

    - name: Clear the lifecycle phase before the pending-reboot refresh
      ansible.builtin.set_fact:
        patch_lifecycle_current_phase: ""
      changed_when: false

    - name: Refresh pending reboot for final reporting when the host is reachable
      when: windows_connectivity_ok | default(false) | bool
      tags:
        - report
      block:
        - name: Include pending reboot refresh
          ansible.builtin.include_role:
            name: windows_patch
            tasks_from: check_pending_reboot.yml
      rescue:
        - name: Keep an unexpected pending reboot refresh failure on this host
          ansible.builtin.include_tasks: tasks/record_unexpected_failure.yml
          vars:
            patch_unexpected_phase: pending reboot refresh

    - name: Build per-host patch_final_result
      tags:
        - report
      block:
        - name: Mark final reporting as the current lifecycle phase
          ansible.builtin.set_fact:
            patch_lifecycle_current_phase: final_reporting
          changed_when: false

        - name: Include final report construction
          ansible.builtin.include_role:
            name: patch_report
            tasks_from: final_build.yml
      rescue:
        - name: Keep an unexpected final report failure on this host
          ansible.builtin.include_tasks: tasks/record_unexpected_failure.yml
          vars:
            patch_unexpected_phase: final report construction

        - name: Keep the host in the aggregate when report construction fails
          ansible.builtin.include_tasks: tasks/fallback_final_result.yml

    - name: Clear the lifecycle phase after final reporting
      ansible.builtin.set_fact:
        patch_lifecycle_current_phase: ""
      when: (patch_lifecycle_current_phase | default('')) == 'final_reporting'
      changed_when: false

- name: Windows full patch - aggregate reporting
  hosts: windows_hosts
  connection: local
  gather_facts: false
  # Disabled unless a Job Template extra-var enables them. Not survey fields.
  # Extra-vars override these play defaults.
  vars:
    snow_patching_update_cr_enabled: false
    snow_patching_attach_reports_enabled: false
    snow_patching_create_incidents_enabled: false
    snow_patching_create_ctasks_enabled: false
    snow_change_close_enabled: false
    snow_patching_tasks_dir: "{{ playbook_dir }}/tasks"
  tags:
    - report
    - windows
    - patching

  tasks:
    - name: Aggregate Final Patch Report and print summary
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_aggregate.yml
      run_once: true
      tags:
        - report

    - name: Write canonical Final Report JSON/CSV/Markdown from patch_workflow_report
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_write.yml
      run_once: true
      tags:
        - report

    # One controller call for the Limit. A separate localhost play would be
    # skipped by an AAP wave Limit such as windows_wave_1. run_once keeps
    # this off the serial per-server path. Do not use snow_enabled or
    # snow_shared_role here; that adapter is the pre-remediation validator.
    - name: Clear ServiceNow integration failure flags
      ansible.builtin.set_fact:
        snow_patching_update_failed: false
        snow_patching_attach_failed: false
        snow_patching_incident_failed: false
        snow_patching_ctask_failed: false
        snow_patching_close_failed: false
        snow_parent_change_closed: false
      run_once: true
      changed_when: false
      tags:
        - report
        - servicenow

    - name: Update ServiceNow change request with the patch summary
      when: snow_patching_update_cr_enabled | bool
      run_once: true
      tags:
        - report
        - servicenow
      block:
        - name: Require change_ticket_id before the change update
          ansible.builtin.assert:
            that:
              - change_ticket_id | default('') | trim | length > 0
            fail_msg: >-
              snow_patching_update_cr_enabled requires an existing
              change_ticket_id. The change was not created, approved, or closed.
            quiet: true

        - name: Build the patch summary work note
          ansible.builtin.set_fact:
            snow_patching_aap_job_id: "{{ tower_job_id | default(awx_job_id | default('')) }}"
            snow_patching_work_note: |-
              Windows full patch results.
              AAP job: {{ tower_job_id | default(awx_job_id | default('')) | default('not_available', true) }}
              Systems patched: {{ patch_workflow_report.systems_patched | default('not_available') }}
              Systems not patched: {{ patch_workflow_report.systems_not_patched | default('not_available') }}
              Exempt: {{ patch_workflow_report.status_counts.exempt | default('not_available') }}
              Degraded: {{ patch_workflow_report.status_counts.degraded | default('not_available') }}
              Failed: {{ patch_workflow_report.status_counts.failed | default('not_available') }}
              Manual follow-up: {{ patch_workflow_report.manual_followup_hosts | default([]) | length }}
          changed_when: false

        - name: Write the patch summary to the existing change request
          ansible.builtin.include_role:
            name: servicenow_patching_change
          vars:
            snow_operation: update
            snow_change_number: "{{ change_ticket_id | trim }}"
            snow_aap_job_id: "{{ snow_patching_aap_job_id }}"
            snow_work_notes: "{{ snow_patching_work_note }}"
            snow_change_fields: {}

        - name: Keep the ServiceNow change update result
          ansible.builtin.set_fact:
            snow_result: "{{ snow_patching_update_kept }}"
            snow_patching_update_result: "{{ snow_patching_update_kept }}"
            snow_patching_update_failed: false
          vars:
            snow_patching_update_on_host: "{{ snow_result
              if snow_result is defined and snow_result is mapping
              and snow_result.operation | default('') == 'update'
              else {} }}"
            snow_patching_update_on_controller: "{{
              hostvars['localhost']['snow_result']
              if 'localhost' in hostvars
              and hostvars['localhost']['snow_result'] is defined
              and hostvars['localhost']['snow_result'] is mapping
              and hostvars['localhost']['snow_result'].operation | default('') == 'update'
              else {} }}"
            snow_patching_update_kept: "{{ snow_patching_update_on_host
              if (snow_patching_update_on_host | length) > 0
              else snow_patching_update_on_controller }}"

        - name: Require a successful ServiceNow change update result
          ansible.builtin.assert:
            that:
              - snow_patching_update_result is mapping
              - snow_patching_update_result.operation | default('') == 'update'
              - snow_patching_update_result.success | default(false) | bool
            fail_msg: >-
              ServiceNow change update did not publish a successful snow_result.
              Patch results and report files were not changed.
            quiet: true

      rescue:
        - name: Record the ServiceNow change update failure
          ansible.builtin.set_fact:
            snow_patching_update_failed: true
            snow_patching_update_error: >-
              {{ ansible_failed_result.msg | default('ServiceNow change update failed') }}
          changed_when: false

        - name: Report the ServiceNow change update failure
          ansible.builtin.debug:
            msg: >-
              ServiceNow change update failed
              ({{ snow_patching_update_error }}).
              patch_workflow_report and the report files were left in place.
              The job fails after optional SMTP.
          changed_when: false

    - name: Attach final reports to the ServiceNow change request
      when: snow_patching_attach_reports_enabled | bool
      run_once: true
      tags:
        - report
        - servicenow
      block:
        - name: Require change_ticket_id before attaching reports
          ansible.builtin.assert:
            that:
              - change_ticket_id | default('') | trim | length > 0
              - patch_report_files is sequence
              - patch_report_files is not string
              - patch_report_files | length > 0
            fail_msg: >-
              snow_patching_attach_reports_enabled requires change_ticket_id
              and the report files already written in this job.
              Reports were not regenerated.
            quiet: true

        - name: Attach the existing report files to the change request
          ansible.builtin.include_role:
            name: servicenow_patching_change
          vars:
            snow_operation: attach_reports
            snow_change_number: "{{ change_ticket_id | trim }}"
            snow_report_files: "{{ patch_report_files }}"

        - name: Keep the ServiceNow report attachment result
          ansible.builtin.set_fact:
            snow_result: "{{ snow_patching_attach_kept }}"
            snow_patching_attach_result: "{{ snow_patching_attach_kept }}"
            snow_patching_attach_failed: false
          vars:
            snow_patching_attach_on_host: "{{ snow_result
              if snow_result is defined and snow_result is mapping
              and snow_result.operation | default('') == 'attach_reports'
              else {} }}"
            snow_patching_attach_on_controller: "{{
              hostvars['localhost']['snow_result']
              if 'localhost' in hostvars
              and hostvars['localhost']['snow_result'] is defined
              and hostvars['localhost']['snow_result'] is mapping
              and hostvars['localhost']['snow_result'].operation | default('') == 'attach_reports'
              else {} }}"
            snow_patching_attach_kept: "{{ snow_patching_attach_on_host
              if (snow_patching_attach_on_host | length) > 0
              else snow_patching_attach_on_controller }}"

        - name: Require a successful ServiceNow report attachment result
          ansible.builtin.assert:
            that:
              - snow_patching_attach_result is mapping
              - snow_patching_attach_result.operation | default('') == 'attach_reports'
              - snow_patching_attach_result.success | default(false) | bool
            fail_msg: >-
              ServiceNow report attachment did not publish a successful snow_result.
              Patch results and report files were not changed.
            quiet: true

      rescue:
        - name: Record the ServiceNow report attachment failure
          ansible.builtin.set_fact:
            snow_patching_attach_failed: true
            snow_patching_attach_error: >-
              {{ ansible_failed_result.msg | default('ServiceNow report attachment failed') }}
          changed_when: false

        - name: Report the ServiceNow report attachment failure
          ansible.builtin.debug:
            msg: >-
              ServiceNow report attachment failed
              ({{ snow_patching_attach_error }}).
              patch_workflow_report and the report files were left in place.
              The job fails after optional SMTP.
          changed_when: false

    - name: Create follow-up incidents for hosts that need manual follow-up
      ansible.builtin.include_tasks: tasks/snow_followup_incidents.yml
      when: snow_patching_create_incidents_enabled | bool
      run_once: true
      tags:
        - report
        - servicenow

    - name: Prepare change tasks for affected hosts
      ansible.builtin.include_tasks: tasks/snow_followup_ctasks.yml
      when: snow_patching_create_ctasks_enabled | bool
      run_once: true
      tags:
        - report
        - servicenow

    - name: Close the parent change after reporting and change tasks
      ansible.builtin.include_tasks: tasks/snow_close_parent_change.yml
      when: snow_change_close_enabled | bool
      run_once: true
      tags:
        - report
        - servicenow

    - name: Email Windows patching report
      ansible.builtin.include_role:
        name: report_email
      when: report_email_enabled | default(false) | bool
      run_once: true
      tags:
        - report
        - email

    - name: Fail after reporting if patching or ServiceNow integration failed
      ansible.builtin.assert:
        that:
          - (patch_workflow_report.status_counts.failed | default(0) | int) == 0
          - (ansible_play_hosts_all | map('extract', hostvars, 'patch_lifecycle_failed') | select('defined') | select | list | length) == 0
          - not (snow_patching_update_failed | default(false) | bool)
          - not (snow_patching_attach_failed | default(false) | bool)
          - not (snow_patching_incident_failed | default(false) | bool)
          - not (snow_patching_ctask_failed | default(false) | bool)
          - not (snow_patching_close_failed | default(false) | bool)
          - not (hostvars['localhost']['snow_change_window_gate_failed'] | default(false) | bool)
        fail_msg: >-
          Full Patch reporting completed, but the job cannot succeed.
          Patch failures={{ patch_workflow_report.status_counts.failed | default(0) }}.
          ServiceNow change update failed={{ snow_patching_update_failed | default(false) }}
          ({{ snow_patching_update_error | default('not run') }}).
          ServiceNow report attachment failed={{ snow_patching_attach_failed | default(false) }}
          ({{ snow_patching_attach_error | default('not run') }}).
          ServiceNow follow-up incidents failed={{ snow_patching_incident_failed | default(false) }}
          ({{ snow_patching_incident_error | default('see snow_patching_incident_results') }}).
          ServiceNow change tasks failed={{ snow_patching_ctask_failed | default(false) }}
          ({{ snow_patching_ctask_error | default('not run') }}).
          ServiceNow parent change closure failed={{ snow_patching_close_failed | default(false) }}
          ({{ snow_patching_close_error | default('not run') }}).
          Parent change confirmed closed={{ snow_parent_change_closed | default(false) }}.
          JSON/CSV/Markdown and patch_workflow_report were left unchanged.
          Unreachable hosts, installation failures, postcheck failures,
          remediation lifecycle failures, and an enabled ServiceNow integration
          failure all fail the AAP job after reporting.
      run_once: true
      tags:
        - report
