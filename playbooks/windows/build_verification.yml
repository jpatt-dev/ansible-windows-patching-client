---
# Read-only Windows build snapshot for AAP 2.7.
# Live data is OS version and BuildNumber.UBR. Native facts do not include UBR.
# Inventory fields are inventory_hostname, cmdb_fqdn, cmdb_os_release,
# patch_location, patch_environment, and sys_id. Blank CMDB values stay
# not_available. Location stays an empty string. Live names do not fill them.
# It does not install updates, reboot, change WSUS, or call ServiceNow.
#
# Both plays use hosts: windows_hosts, so a Limit only narrows that group.
# Blank Limit, all, and * are allowed. Full Patch still rejects those Limits.
# A localhost play would be skipped when the Limit is a Windows group.
#
# A failed OS query is rescued on that host so the other hosts and the report
# still run. The job is not successful when a query fails. Unreachable hosts
# stay in the play. The report is still written when every host fails.
#
# Job template: Windows - Build Verification
#   Inventory: the LAB, IST, UAT, or PROD Windows inventory
#   Credential: existing Windows WinRM credential
#   Execution environment: Windows patching EE
#   Limit: optional. Blank, all, *, hosts, or an inventory group.
#   Playbook: playbooks/windows/build_verification.yml
#
# Email is off unless the job template sets report_email_enabled=true.
# SMTP tasks are loaded only then, so a report-only run does not need
# the mail collection.
# Example extra variables:
#   report_email_enabled: true
#   report_email_smtp_host: smtp.example.internal
#   report_email_smtp_port: 25
#   report_email_smtp_secure: never
#   report_email_from: patching@example.internal
#   report_email_to:
#     - ops@example.internal
#   report_email_attach_csv: true
#   report_email_fail_on_error: true

- name: Collect current Windows build information
  hosts: windows_hosts
  gather_facts: false
  ignore_unreachable: true
  vars:
    report_email_enabled: false
    report_email_smtp_host: ""
    report_email_smtp_port: 25
    report_email_smtp_secure: "never"
    report_email_from: ""
    report_email_to: []
    report_email_attach_csv: true
    report_email_fail_on_error: true
    build_verify_output_dir: /tmp/aap-build-verification

  tasks:
    - name: Read Windows hostname, FQDN, OS caption, version, and build
      block:
        - name: Query Win32 operating system and the UBR registry value
          ansible.windows.win_shell: |
            $ErrorActionPreference = 'Stop'
            $os = Get-CimInstance -ClassName Win32_OperatingSystem
            $cs = Get-CimInstance -ClassName Win32_ComputerSystem
            $dns = [string]$cs.DNSHostName
            $fqdn = $dns
            if ($cs.PartOfDomain -and $dns -and $cs.Domain) {
              $fqdn = "$dns.$($cs.Domain)"
            }
            $ubr = $null
            try {
              $reg = 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion'
              $ubr = (Get-ItemProperty -Path $reg -Name UBR -ErrorAction Stop).UBR
            } catch {
              $ubr = $null
            }
            $fullBuild = [string]$os.BuildNumber
            $ubrOk = $false
            if ($null -ne $ubr -and "$ubr" -ne '') {
              $fullBuild = "$($os.BuildNumber).$ubr"
              $ubrOk = $true
            }
            [PSCustomObject]@{
              Caption = [string]$os.Caption
              Version = [string]$os.Version
              BuildNumber = [string]$os.BuildNumber
              UBR = $ubr
              UbrAvailable = $ubrOk
              FullBuild = [string]$fullBuild
              DNSHostName = $dns
              CSName = [string]$os.CSName
              FQDN = [string]$fqdn
            } | ConvertTo-Json -Compress
          register: windows_build_query
          timeout: 120
          changed_when: false
      rescue:
        - name: Keep the failed OS query for the host report row
          ansible.builtin.set_fact:
            windows_build_query: "{{ ansible_failed_result }}"
          changed_when: false
      always:
        - name: Record the Windows build query
          ansible.builtin.include_tasks: tasks/build_verification_record.yml

- name: Report current Windows builds
  hosts: windows_hosts
  connection: local
  gather_facts: false
  vars:
    report_email_enabled: false
    report_email_smtp_host: ""
    report_email_smtp_port: 25
    report_email_smtp_secure: "never"
    report_email_from: ""
    report_email_to: []
    report_email_attach_csv: true
    report_email_fail_on_error: true
    build_verify_output_dir: /tmp/aap-build-verification
    build_verify_platform: windows
    build_verify_build_kind: windows_build
    build_verify_report_name: windows_build_verification_report
    build_verify_csv_name: windows_build_verification_csv
    build_verify_filename_prefix: windows-build-verification
    build_verify_subject_name: Windows
    build_verify_report_source: windows_build_verification
    build_verify_email_scope: |
      Windows build verification collected the current OS build from the selected servers.
      Current Build / Kernel is the Windows build number.
      No updates were installed and no servers were rebooted.
    build_verify_email_tasks: "{{ playbook_dir }}/../build_verification/tasks/email.yml"

  tasks:
    - name: Aggregate and publish the build verification report
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../build_verification/tasks/report.yml"
      run_once: true
