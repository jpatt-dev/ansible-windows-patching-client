---
# Windows Patch Postcheck (short name)
# Read-only validation after patching. Never installs updates.
#
# CLI:
#   ansible-playbook -i /path/to/client-inventory \
#     playbooks/windows/postcheck.yml

- name: Windows patch postcheck
  hosts: windows_hosts
  gather_facts: false
  serial: "{{ patch_serial | default(omit) }}"
  tags:
    - postcheck
    - windows
    - patching

  pre_tasks:
    - name: Include shared orchestration validation
      ansible.builtin.include_role:
        name: patch_common
      vars:
        patch_default_target: windows_hosts
        patch_enforce_scoped_target: false
      tags:
        - always

  roles:
    - role: windows_patch
      vars:
        patch_phase: postcheck

  post_tasks:
    - name: Update ServiceNow work notes after postcheck
      ansible.builtin.include_role:
        name: servicenow_change
      vars:
        snow_phase: work_notes
        snow_work_note_message: >-
          AAP Windows patch postcheck completed for scope
          {{ patch_target_scope | default('not_available') }}
          (wave={{ patch_wave_name | default('unspecified') }}).
      run_once: true
      tags:
        - always
        - servicenow

# Serial-safe workflow-global artifact for Final Patch Report.
- name: Windows patch postcheck — publish workflow-global phase artifact
  hosts: windows_hosts
  gather_facts: false
  connection: local
  tags:
    - postcheck
    - windows
    - patching
    - report

  tasks:
    - name: Publish patch_phase_postcheck host-keyed artifact
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: publish_workflow_phase.yml
      vars:
        patch_workflow_phase_key: postcheck
      run_once: true
      tags:
        - always
        - report
