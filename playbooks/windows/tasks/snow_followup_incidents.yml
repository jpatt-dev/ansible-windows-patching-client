---
# Runs from Full Patch play 2. The play is already local and not serial.
# run_once on the include keeps this to one pass per job. Each candidate is
# one incident role call. Do not add a localhost play: a wave Limit would
# skip it.
#
# snow_incident_create_method defaults to standard. import_set posts once
# and is not idempotent: u_correlation_display is not a duplicate check.
# A create through import_set also requires
# snow_patching_import_set_create_enabled=true,
# snow_incident_import_api_path, snow_incident_assignment_group, and
# snow_incident_import_correlation_display. The client value is the literal
# Ansible. The aap-patch:<change>:<hostname>:<reason code> id stays on the
# follow-up result and is not sent in that field. There is no retry and no
# fallback to the standard Incident API.

- name: Skip follow-up incidents when creation is disabled
  when: not (snow_patching_create_incidents_enabled | default(false) | bool)
  ansible.builtin.debug:
    msg: Follow-up incident creation is disabled (snow_patching_create_incidents_enabled=false).
  changed_when: false

- name: Create follow-up incidents for this patch job
  when: snow_patching_create_incidents_enabled | default(false) | bool
  block:
    - name: Select follow-up incident candidates
      ansible.builtin.include_tasks: "{{ snow_patching_tasks_dir }}/snow_followup_candidates.yml"

    - name: Start the follow-up incident result list
      ansible.builtin.set_fact:
        snow_patching_incident_results: []
        snow_followup_caller: "{{ snow_incident_caller | default('') | string | trim }}"
        snow_followup_assignment_group: "{{ snow_incident_assignment_group | default('') | string | trim }}"
        snow_followup_priority: "{{ snow_incident_priority | default('') | string | trim }}"
        snow_followup_create_method: "{{ snow_incident_create_method | default('standard') | string | trim }}"
        snow_followup_import_set_enabled: "{{ snow_patching_import_set_create_enabled | default(false) | bool }}"
        snow_followup_import_api_path: "{{ snow_incident_import_api_path | default('') | string | trim }}"
        snow_followup_import_correlation_display: "{{ snow_incident_import_correlation_display | default('') | string | trim }}"
        snow_followup_create_count: "{{ snow_patching_incident_candidates | selectattr('action', 'equalto', 'create') | list | length }}"
      changed_when: false

    - name: Reject an unknown follow-up incident creation method
      when: snow_followup_create_count | int > 0
      ansible.builtin.assert:
        that:
          - snow_followup_create_method in ['standard', 'import_set']
        fail_msg: >-
          snow_incident_create_method must be standard or import_set.
          No incident was created.
        quiet: true

    - name: Require an explicit opt-in before import set follow-up creation
      when:
        - snow_followup_create_method == 'import_set'
        - snow_followup_create_count | int > 0
      ansible.builtin.assert:
        that:
          - snow_followup_import_set_enabled | bool
          - snow_followup_import_api_path is match('^api/now/import/[A-Za-z][A-Za-z0-9_]{0,79}$')
          - snow_followup_assignment_group | length > 0
          - snow_followup_import_correlation_display | length > 0
          - snow_followup_import_correlation_display is not search('\\^|\\r|\\n')
        fail_msg: >-
          Import set follow-up creation is not idempotent.
          u_correlation_display does not prevent a duplicate incident.
          Set snow_patching_import_set_create_enabled=true,
          snow_incident_import_api_path to api/now/import/<staging_table>,
          snow_incident_assignment_group, and
          snow_incident_import_correlation_display to the client value,
          in addition to snow_patching_create_incidents_enabled.
          The client value is the literal Ansible. The aap-patch
          correlation id stays on the follow-up result. It is not sent
          as u_correlation_display. The standard incident API is not
          used as a fallback. No incident was created.
        quiet: true

    - name: Require the caller when a follow-up host needs an incident
      when: snow_patching_incident_candidates | length > 0
      ansible.builtin.assert:
        that:
          - snow_followup_caller | length > 0
        fail_msg: >-
          snow_patching_create_incidents_enabled requires snow_incident_caller
          when a host needs follow-up. This playbook does not choose a
          ServiceNow user. Assignment group and priority stay unset unless
          an administrator supplies them. No incident was created.
        quiet: true

    - name: Open or reuse one follow-up incident
      ansible.builtin.include_tasks: "{{ snow_patching_tasks_dir }}/snow_followup_incident_one.yml"
      loop: "{{ snow_patching_incident_candidates }}"
      loop_control:
        loop_var: snow_followup_candidate
        label: "{{ snow_followup_candidate.hostname }}"

    - name: Record whether any follow-up incident failed
      ansible.builtin.set_fact:
        snow_patching_incident_failed: >-
          {{
            (
              snow_patching_incident_results
              | map(attribute='success')
              | map('bool')
              | reject('equalto', true)
              | list
              | length
            ) > 0
          }}
      changed_when: false

    - name: Publish follow-up incident results
      ansible.builtin.set_stats:
        data:
          snow_patching_incident_results: "{{ snow_patching_incident_results }}"
        per_host: false

  rescue:
    - name: Record the follow-up incident configuration failure
      ansible.builtin.set_fact:
        snow_patching_incident_failed: true
        snow_patching_incident_error: >-
          {{ ansible_failed_result.msg | default('Follow-up incident creation failed') }}
        snow_patching_incident_results: "{{ snow_patching_incident_results | default([]) }}"
      changed_when: false

    - name: Report the follow-up incident configuration failure
      ansible.builtin.debug:
        msg: >-
          Follow-up incident creation failed
          ({{ snow_patching_incident_error }}).
          Patch results and report files were left in place.
      changed_when: false
