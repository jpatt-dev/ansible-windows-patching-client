---
# Aggregate build rows and write one CSV.
# Include once, with run_once, from a non-serial connection:local play
# whose hosts are the same windows_hosts selection.
# Email tasks load only when report_email_enabled is true.

- name: Collect existing build records in inventory order
  ansible.builtin.set_fact:
    windows_build_present: >-
      {{
        ansible_play_hosts_all
        | map('extract', hostvars)
        | selectattr('windows_build_record', 'defined')
        | map(attribute='windows_build_record')
        | list
      }}
    windows_build_generated_at: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
  run_once: true
  changed_when: false

- name: Find targeted hosts that never produced a build record
  ansible.builtin.set_fact:
    windows_build_missing_names: >-
      {{
        ansible_play_hosts_all
        | difference(windows_build_present | map(attribute='inventory_hostname') | list)
      }}
  run_once: true
  changed_when: false

- name: Build fallback rows for hosts missing a collection result
  ansible.builtin.set_fact:
    windows_build_fallbacks: "{{ windows_build_fallbacks_json | from_json }}"
  vars:
    windows_build_fallbacks_json: |
      {% set ns = namespace(rows=[]) %}
      {% for name in windows_build_missing_names %}
      {% set row = {
        'inventory_hostname': name,
        'hostname': name,
        'fqdn': 'not_available',
        'os_release': 'not_available',
        'os_version': 'not_available',
        'current_build': 'not_available',
        'location': hostvars[name].patch_location | default('') | string | trim,
        'patch_environment': hostvars[name].patch_environment | default('') | string | trim,
        'collection_status': 'failed',
        'collection_time_utc': windows_build_generated_at,
        'diagnostic': 'Build record was not produced for this host.'
      } %}
      {% set _ = ns.rows.append(row) %}
      {% endfor %}
      {{- ns.rows | to_json -}}
  run_once: true
  changed_when: false

- name: Combine collected and fallback build rows
  ansible.builtin.set_fact:
    windows_build_hosts: "{{ windows_build_present + windows_build_fallbacks }}"
  run_once: true
  changed_when: false

- name: Summarize the Windows build verification
  ansible.builtin.set_fact:
    windows_build_environments: >-
      {{
        windows_build_hosts
        | map(attribute='patch_environment')
        | map('string')
        | map('trim')
        | reject('equalto', '')
        | unique
        | sort
      }}
    windows_build_succeeded: >-
      {{
        windows_build_hosts
        | selectattr('collection_status', 'equalto', 'success')
        | list
        | length
      }}
    windows_build_failed: >-
      {{
        windows_build_hosts
        | selectattr('collection_status', 'equalto', 'failed')
        | list
        | length
      }}
    windows_build_unreachable: >-
      {{
        windows_build_hosts
        | selectattr('collection_status', 'equalto', 'unreachable')
        | list
        | length
      }}
  run_once: true
  changed_when: false

- name: Name the inventory environment for this job
  ansible.builtin.set_fact:
    windows_build_environment: >-
      {{
        'unspecified'
        if ((windows_build_environments | length) == 0)
        else (
          windows_build_environments[0]
          if ((windows_build_environments | length) == 1)
          else 'inconsistent'
        )
      }}
    windows_build_not_queried: "{{ (windows_build_failed | int) + (windows_build_unreachable | int) }}"
  run_once: true
  changed_when: false

- name: Build the Windows build verification report
  ansible.builtin.set_fact:
    windows_build_verification_report:
      schema_version: "1"
      report_source: windows_build_verification
      generated_at_utc: "{{ windows_build_generated_at }}"
      patch_environment: "{{ windows_build_environment }}"
      patch_environments: "{{ windows_build_environments }}"
      aap_limit: "{{ ansible_limit | default('') | string | trim }}"
      aap_job_id: "{{ tower_job_id | default(awx_job_id | default('')) }}"
      total_systems: "{{ ansible_play_hosts_all | length }}"
      systems_succeeded: "{{ windows_build_succeeded }}"
      systems_failed: "{{ windows_build_failed }}"
      systems_unreachable: "{{ windows_build_unreachable }}"
      email_delivery: "{{ 'skipped' if not (report_email_enabled | default(false) | bool) else 'pending' }}"
      hosts: "{{ windows_build_hosts }}"
  run_once: true
  changed_when: false

- name: Require build verification totals to reconcile
  ansible.builtin.assert:
    that:
      - (windows_build_verification_report.total_systems | int) == (windows_build_hosts | length)
      - >-
        (windows_build_verification_report.systems_succeeded | int)
        + (windows_build_verification_report.systems_failed | int)
        + (windows_build_verification_report.systems_unreachable | int)
        == (windows_build_verification_report.total_systems | int)
    fail_msg: Windows build verification totals do not match the targeted hosts.
  run_once: true

- name: Render the Excel CSV in one pass
  ansible.builtin.set_fact:
    windows_build_verification_csv: >-
      {{
        windows_build_csv_text[:-1]
        if (
          windows_build_csv_text[-3:]
          == (
            ('%c' | format(13))
            ~ ('%c' | format(10))
            ~ ('%c' | format(10))
          )
        )
        else windows_build_csv_text
      }}
    windows_build_csv_filename: >-
      windows-build-verification-{{ now(utc=true, fmt='%Y-%m-%dT%H-%M-%SZ') }}.csv
    windows_build_email_subject: >-
      AAP Windows Build Verification |
      {{ windows_build_environment }} |
      {{ windows_build_generated_at }}
    windows_build_email_body: |
      Windows build verification collected the current OS build from the selected servers.
      No updates were installed and no servers were rebooted.

      Total systems targeted: {{ windows_build_verification_report.total_systems }}
      Systems successfully queried: {{ windows_build_verification_report.systems_succeeded }}
      Systems failed or unreachable: {{ windows_build_not_queried }}
      Collection timestamp (UTC): {{ windows_build_generated_at }}

      The attached CSV is a current-state inventory snapshot for Microsoft Excel.
      It is not a patch installation history or a compliance result.
  vars:
    windows_build_csv_text: |
      {%- set cr = '%c' | format(13) -%}
      {%- set lf = '%c' | format(10) -%}
      {%- set bom = '%c' | format(65279) -%}
      {%- macro cell(value) -%}
      {%- set cr = '%c' | format(13) -%}
      {%- set lf = '%c' | format(10) -%}
      {%- set tab = '%c' | format(9) -%}
      {%- set text = '' if value is none else (value | string) -%}
      {%- if text[:1] in ['=', '+', '-', '@', tab, cr] -%}
      {%- set text = "'" ~ text -%}
      {%- endif -%}
      {%- set text = text | replace(cr ~ lf, ' ') -%}
      {%- set text = text | replace(lf, ' ') | replace(cr, ' ') -%}
      "{{ text | replace('"', '""') }}"
      {%- endmacro %}
      {%- set ns = namespace(lines=[]) -%}
      {%- set header = [
        'Hostname', 'FQDN', 'OS Release', 'OS Version', 'Current Build',
        'Location', 'Collection Status', 'Collection Time', 'Diagnostic'
      ] -%}
      {%- set quoted = namespace(cols=[]) -%}
      {%- for name in header -%}
      {%- set _ = quoted.cols.append('"' ~ (name | replace('"', '""')) ~ '"') -%}
      {%- endfor -%}
      {%- set _ = ns.lines.append(quoted.cols | join(',')) -%}
      {%- for item in windows_build_hosts -%}
      {%- set row = [
        cell(item.hostname | default('not_available')),
        cell(item.fqdn | default('not_available')),
        cell(item.os_release | default('not_available')),
        cell(item.os_version | default('not_available')),
        cell(item.current_build | default('not_available')),
        cell(item.location | default('')),
        cell(item.collection_status | default('failed')),
        cell(item.collection_time_utc | default('not_available')),
        cell(item.diagnostic | default(''))
      ] -%}
      {%- set _ = ns.lines.append(row | join(',')) -%}
      {%- endfor -%}
      {{- bom ~ (ns.lines | join(cr ~ lf)) ~ cr ~ lf -}}
  run_once: true
  changed_when: false

- name: Ensure the build verification output directory exists
  ansible.builtin.file:
    path: "{{ build_verify_output_dir | default('/tmp/aap-build-verification') }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false
  run_once: true

- name: Write the build verification CSV on the Execution Environment
  ansible.builtin.copy:
    content: "{{ windows_build_verification_csv }}"
    dest: "{{ build_verify_output_dir | default('/tmp/aap-build-verification') }}/{{ windows_build_csv_filename }}"
    mode: "0640"
  delegate_to: localhost
  become: false
  run_once: true
  register: windows_build_csv_write

- name: Record the CSV path on the report
  ansible.builtin.set_fact:
    windows_build_verification_report: >-
      {{
        windows_build_verification_report
        | combine({'csv_path': windows_build_csv_write.dest | default('')})
      }}
  run_once: true
  changed_when: false

- name: Publish the build verification artifacts
  ansible.builtin.set_stats:
    data:
      windows_build_verification_report: "{{ windows_build_verification_report }}"
      windows_build_verification_csv: "{{ windows_build_verification_csv }}"
    per_host: false
  run_once: true

- name: Send the build verification email when requested
  ansible.builtin.include_tasks: "{{ build_verify_email_tasks }}"
  when: report_email_enabled | default(false) | bool
  run_once: true
