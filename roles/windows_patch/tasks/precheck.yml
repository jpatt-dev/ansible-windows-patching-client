---
# Read-only Windows precheck. Never installs updates.
# Re-collects host health in this job (AAP nodes do not preserve facts).
# WinRM connectivity is probed first. Unreachable hosts skip further Windows
# operations, stay in the play, and are recorded as precheck failed.
# Critical failures fail this job AFTER reporting (stops workflow success path).

- name: Normalize operator context for precheck summary
  ansible.builtin.set_fact:
    windows_patch_mode: "{{ windows_patch_mode | default('check_only') | trim | lower }}"
    patch_apply_enabled: "{{ patch_apply_enabled | default(false) | bool }}"
    maintenance_window_acknowledged: "{{ maintenance_window_acknowledged | default(false) | bool }}"
  tags:
    - precheck

- name: Collect host connectivity, OS, boot, and disk health
  ansible.builtin.include_tasks: collect_host_health.yml
  tags:
    - precheck

- name: Snapshot pre-patch OS build for historical reporting
  ansible.builtin.set_fact:
    windows_os_build_pre: "{{ windows_os_build | default('not_available') }}"
  when: windows_os_build_pre is not defined
  changed_when: false
  tags:
    - precheck
    - report

- name: Resolve patch provider / WSUS source context (validate only)
  ansible.builtin.include_role:
    name: windows_patch_source
  when: windows_connectivity_ok | default(false) | bool
  tags:
    - precheck
    - source

- name: Record unavailable WSUS observations when the host is unreachable
  ansible.builtin.set_fact:
    windows_wsus_validation_status: not_available
    windows_wsus_configured: false
    windows_patch_provider_effective: unknown
    windows_patch_provider: unknown
    windows_wsus_server_effective: not_available
    windows_wsus_status_server_effective: not_available
    windows_wsus_use_server_effective: not_available
    windows_provider_remediation_blocked: true
  when: not (windows_connectivity_ok | default(false) | bool)
  changed_when: false
  tags:
    - precheck
    - source
    - report

- name: Run opt-in client PowerShell precheck
  ansible.builtin.include_tasks: powershell_precheck.yml
  when:
    - windows_powershell_precheck_enabled | default(false) | bool
    - windows_connectivity_ok | default(false) | bool
  tags:
    - precheck
    - powershell

- name: Search for pending Windows updates using approved OS policy categories
  ansible.builtin.include_tasks: search_updates_policy.yml
  when: windows_connectivity_ok | default(false) | bool
  tags:
    - precheck
    - patching

- name: Check pending reboot state
  ansible.builtin.include_tasks: check_pending_reboot.yml
  when: windows_connectivity_ok | default(false) | bool
  tags:
    - precheck
    - reboot

- name: Record unavailable pending-reboot observations when the host is unreachable
  ansible.builtin.set_fact:
    pending_reboot: false
    windows_reboot_required: false
    windows_pending_reboot_probe_ok: false
  when: not (windows_connectivity_ok | default(false) | bool)
  changed_when: false
  tags:
    - precheck
    - reboot
    - report

- name: Check Windows service status (placeholder list incl. WU/BITS)
  ansible.windows.win_service_info:
    name: "{{ item }}"
  register: windows_service_checks
  failed_when: false
  loop: "{{ windows_services_to_check | default(['W32Time', 'wuauserv', 'BITS']) }}"
  when: windows_connectivity_ok | default(false) | bool
  tags:
    - precheck

- name: Set precheck status vocabulary
  ansible.builtin.set_fact:
    precheck_status: >-
      {{
        'failed'
        if (
          (not (windows_connectivity_ok | default(false) | bool))
          or (not (windows_update_search_ok | default(true) | bool))
        )
        else (
          'blocked'
          if (
            (windows_powershell_precheck_critical_failed | default(false) | bool)
            or (
              (windows_wsus_validation_status | default('missing')) != 'valid'
            )
          )
          else (
            'warning'
            if (windows_disk_low | default(false) | bool)
            else 'passed'
          )
        )
      }}
    manual_followup_required: >-
      {{
        (not (windows_connectivity_ok | default(false) | bool))
        or (windows_disk_low | default(false) | bool)
        or (
          (pending_reboot | default(false) | bool)
          and not (reboot_enabled | default(false) | bool)
        )
        or (windows_patch_provider_effective | default('unknown') == 'unknown')
        or (
          (windows_wsus_validation_status | default('missing')) not in ['valid', 'not_available']
        )
      }}
    updates_found: >-
      {{
        'not_available'
        if (
          (not (windows_connectivity_ok | default(false) | bool))
          or (not (windows_update_search_ok | default(true) | bool))
        )
        else (windows_updates_policy_count | default(0) | int)
      }}
  changed_when: false
  tags:
    - precheck
    - report

- name: Report maintenance window status during precheck (non-enforcing)
  ansible.builtin.include_role:
    name: patch_common
    tasks_from: validate_maintenance_window.yml
  vars:
    patch_maintenance_window_enforce: false
  tags:
    - precheck
    - maintenance

- name: Report Windows precheck summary
  ansible.builtin.debug:
    msg:
      - "host: {{ inventory_hostname }}"
      - "windows_connectivity_ok: {{ windows_connectivity_ok | default(false) }}"
      - "windows_winrm_health: {{ windows_winrm_health | default('unknown') }}"
      - "windows_os_caption: {{ windows_os_caption | default('unknown') }}"
      - "windows_os_version: {{ windows_os_version | default('unknown') }}"
      - "windows_last_boot_time: {{ windows_last_boot_time | default('unknown') }}"
      - "windows_disk_free_mb: {{ windows_disk_free_mb | default('unknown') }}"
      - "pending_reboot: {{ pending_reboot | default(false) }}"
      - "updates_found: {{ updates_found | default(0) }}"
      - "windows_patch_provider_effective: {{ windows_patch_provider_effective | default('unknown') }}"
      - "windows_wsus_configured: {{ windows_wsus_configured | default(false) }}"
      - "windows_wsus_validation_status: {{ windows_wsus_validation_status | default('missing') }}"
      - "windows_wsus_server_effective: {{ windows_wsus_server_effective | default('') }}"
      - "windows_wsus_status_server_effective: {{ windows_wsus_status_server_effective | default('') }}"
      - "windows_wsus_use_server_effective: {{ windows_wsus_use_server_effective | default('') }}"
      - "windows_patch_mode: {{ windows_patch_mode }}"
      - "patch_wave_name: {{ patch_wave_name | default('unspecified') }}"
      - "change_ticket_id: {{ change_ticket_id | default('') }}"
      - "patch_apply_enabled: {{ patch_apply_enabled }}"
      - "maintenance_window_acknowledged: {{ maintenance_window_acknowledged }}"
      - "maintenance_window_status: {{ maintenance_window_status | default('unset') }}"
      - "patch_require_maintenance_window: {{ patch_require_maintenance_window | default(true) }}"
      - "patching_exception_active: {{ patching_exception_active | default(false) }}"
      - "patching_exception_reference: {{ patching_exception_reference_effective | default('') }}"
      - "patching_exception_source: {{ patching_exception_source | default('inventory') }}"
      - "precheck_status: {{ precheck_status }}"
      - "manual_followup_required: {{ manual_followup_required }}"
  tags:
    - precheck
    - report

- name: Record Windows precheck patch_result for AAP
  ansible.builtin.include_role:
    name: patch_report
  vars:
    patch_report_phase: record
    patch_report_phase_name: precheck
    patch_report_precheck_status: "{{ precheck_status }}"
    patch_report_updates_available: "{{ updates_found | default('not_available') }}"
    patch_report_updates_found: "{{ updates_found | default('not_available') }}"
    patch_report_updates_installed: 0
    patch_report_manual_followup_required: "{{ manual_followup_required | default(false) }}"
  tags:
    - precheck
    - report

- name: Fail Precheck job on critical conditions (after report)
  ansible.builtin.assert:
    that:
      - windows_connectivity_ok | default(false) | bool
      - not (windows_powershell_precheck_critical_failed | default(false) | bool)
      - not (
          (patch_apply_enabled | default(false) | bool)
          and (windows_patch_provider_effective | default('unknown') == 'unknown')
        )
      - precheck_status | default('passed') not in ['failed', 'blocked']
    fail_msg: >-
      Critical precheck failure on {{ inventory_hostname }}:
      status={{ precheck_status | default('unknown') }},
      connectivity={{ windows_connectivity_ok | default(false) }},
      provider_effective={{ windows_patch_provider_effective | default('unknown') }},
      wsus_validation={{ windows_wsus_validation_status | default('missing') }},
      WUServer={{ windows_wsus_server_effective | default('') }},
      ps_critical={{ windows_powershell_precheck_critical_failed | default(false) }}.
      Standalone Precheck remains fail-closed after recording evidence.
  when: windows_precheck_fail_on_blocked | default(true) | bool
  tags:
    - precheck
