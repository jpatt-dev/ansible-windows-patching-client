---
# Collect host health in *this* job. AAP workflow nodes do not preserve
# host facts from prior nodes — always re-run these probes when needed.
# Never print secrets/passwords.
# Probe WinRM first. Skip OS/disk shells when the host is already known
# unreachable so a powered-off server does not incur repeated timeouts.

- name: Probe WinRM connectivity (win_ping)
  ansible.windows.win_ping:
  register: windows_winrm_ping
  failed_when: false
  when: windows_connectivity_ok | default(true) | bool
  tags:
    - precheck
    - postcheck
    - always

- name: Set WinRM / connectivity health facts
  ansible.builtin.set_fact:
    windows_connectivity_ok: "{{ (windows_winrm_ping.ping | default('')) == 'pong' }}"
    windows_winrm_health: >-
      {{
        'ok'
        if ((windows_winrm_ping.ping | default('')) == 'pong')
        else 'failed'
      }}
  when: not (windows_winrm_ping.skipped | default(false) | bool)
  changed_when: false
  tags:
    - precheck
    - postcheck
    - always

- name: Collect OS caption, version, build, hostname, FQDN, and last boot time
  ansible.windows.win_shell: |
    $os = Get-CimInstance -ClassName Win32_OperatingSystem
    $cs = Get-CimInstance -ClassName Win32_ComputerSystem
    $fqdn = if ($cs.PartOfDomain -and $cs.DNSHostName -and $cs.Domain) {
      "$($cs.DNSHostName).$($cs.Domain)"
    } else {
      $cs.DNSHostName
    }
    $ubr = $null
    try {
      $ubr = (Get-ItemProperty -Path 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion' -Name UBR -ErrorAction Stop).UBR
    } catch {
      $ubr = $null
    }
    $fullBuild = [string]$os.BuildNumber
    if ($null -ne $ubr -and "$ubr" -ne '') {
      $fullBuild = "$($os.BuildNumber).$ubr"
    }
    [PSCustomObject]@{
      Caption = $os.Caption
      Version = $os.Version
      BuildNumber = $os.BuildNumber
      UBR = $ubr
      FullBuild = $fullBuild
      CSName = $os.CSName
      FQDN = $fqdn
      LastBootUpTime = $os.LastBootUpTime.ToString('o')
    } | ConvertTo-Json -Compress
  register: windows_os_boot_raw
  changed_when: false
  failed_when: false
  when: windows_connectivity_ok | default(false) | bool
  tags:
    - precheck
    - postcheck
    - always
    - report

- name: Set OS and last boot facts
  ansible.builtin.set_fact:
    windows_os_info: "{{ windows_os_boot_raw.stdout | default('{}') | from_json }}"
    windows_os_version: "{{ (windows_os_boot_raw.stdout | default('{}') | from_json).Version | default('unknown') }}"
    windows_os_caption: "{{ (windows_os_boot_raw.stdout | default('{}') | from_json).Caption | default('unknown') }}"
    windows_os_build: >-
      {{
        (windows_os_boot_raw.stdout | default('{}') | from_json).FullBuild
        | default(
          (windows_os_boot_raw.stdout | default('{}') | from_json).BuildNumber | default('', true),
          true
        )
      }}
    windows_hostname: "{{ (windows_os_boot_raw.stdout | default('{}') | from_json).CSName | default(inventory_hostname, true) }}"
    windows_fqdn: "{{ (windows_os_boot_raw.stdout | default('{}') | from_json).FQDN | default('', true) }}"
    windows_last_boot_time: "{{ (windows_os_boot_raw.stdout | default('{}') | from_json).LastBootUpTime | default('unknown') }}"
  when:
    - windows_connectivity_ok | default(false) | bool
    - (windows_os_boot_raw.rc | default(1)) == 0
  changed_when: false
  tags:
    - precheck
    - postcheck
    - always
    - report

- name: Set OS and last boot facts when probe failed
  ansible.builtin.set_fact:
    windows_os_version: unknown
    windows_os_caption: unknown
    windows_os_build: ""
    windows_hostname: "{{ inventory_hostname }}"
    windows_fqdn: ""
    windows_last_boot_time: unknown
  when:
    - windows_connectivity_ok | default(false) | bool
    - (windows_os_boot_raw.rc | default(1)) != 0
  changed_when: false
  tags:
    - precheck
    - postcheck
    - always
    - report

- name: Set OS and last boot facts when the host is unreachable
  ansible.builtin.set_fact:
    windows_os_version: not_available
    windows_os_caption: not_available
    windows_os_build: not_available
    windows_hostname: "{{ inventory_hostname }}"
    windows_fqdn: ""
    windows_last_boot_time: not_available
  when: not (windows_connectivity_ok | default(false) | bool)
  changed_when: false
  tags:
    - precheck
    - postcheck
    - always
    - report

- name: Collect free disk space for system drive (MB)
  ansible.windows.win_shell: |
    $d = Get-PSDrive -Name C -ErrorAction SilentlyContinue
    if ($null -eq $d) { Write-Output '0'; exit 1 }
    [math]::Floor($d.Free / 1MB)
  register: windows_disk_free_raw
  changed_when: false
  failed_when: false
  when: windows_connectivity_ok | default(false) | bool
  tags:
    - precheck
    - postcheck
    - always

- name: Set disk free facts
  ansible.builtin.set_fact:
    windows_disk_free_mb: "{{ windows_disk_free_raw.stdout | default('0') | trim | int }}"
    windows_disk_low: >-
      {{
        (windows_disk_free_raw.stdout | default('0') | trim | int)
        < (windows_precheck_min_free_disk_mb | default(1024) | int)
      }}
  when:
    - windows_connectivity_ok | default(false) | bool
    - (windows_disk_free_raw.rc | default(1)) == 0
    - (windows_disk_free_raw.stdout | default('') | trim | length) > 0
  changed_when: false
  tags:
    - precheck
    - postcheck
    - always

- name: Set disk facts when the host is unreachable
  ansible.builtin.set_fact:
    windows_disk_free_mb: not_available
    windows_disk_low: false
  when: not (windows_connectivity_ok | default(false) | bool)
  changed_when: false
  tags:
    - precheck
    - postcheck
    - always

- name: Set disk facts when a reachable disk probe cannot execute
  ansible.builtin.set_fact:
    windows_disk_free_mb: not_available
    windows_disk_low: false
  when:
    - windows_connectivity_ok | default(false) | bool
    - (windows_disk_free_raw.rc | default(1)) != 0 or ((windows_disk_free_raw.stdout | default('') | trim | length) == 0)
  changed_when: false
  tags:
    - precheck
    - postcheck
    - always

- name: Warn when free disk space is below soft threshold
  ansible.builtin.debug:
    msg: >-
      WARNING: {{ inventory_hostname }} free disk
      {{ windows_disk_free_mb }} MB is below soft threshold
      {{ windows_precheck_min_free_disk_mb | default(1024) }} MB.
      Flagging manual_followup_required (soft warning; play continues).
  when: windows_disk_low | default(false) | bool
  tags:
    - precheck
    - postcheck
    - report
