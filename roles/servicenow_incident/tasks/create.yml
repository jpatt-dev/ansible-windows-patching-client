---
# Create is refused unless snow_incident_allow_create is true.
# A retry with the same correlation id returns the existing incident and
# does not open another one. Two creates at the same moment can still both
# pass the lookup. A second distinct failure in the same job needs its own
# snow_incident_correlation_id, because the default key is one incident per
# hostname, change number, and job id.

- name: Build the incident text
  ansible.builtin.set_fact:
    snow_incident_correlation_resolved: >-
      {{
        snow_incident_correlation_id
        if snow_incident_correlation_id | default('') | length > 0
        else snow_incident_derived_correlation
      }}
    snow_incident_short_description_resolved: >-
      {{
        snow_incident_short_description
        if snow_incident_short_description | default('') | length > 0
        else 'Patching failed on ' ~ snow_incident_hostname
      }}
    snow_incident_description_resolved: >-
      {{
        snow_incident_context_lines | reject('equalto', '') | list | join(snow_newline)
      }}
    snow_incident_work_notes_resolved: >-
      {{
        [snow_incident_work_notes | default('') | trim, snow_incident_job_line]
        | reject('equalto', '')
        | list
        | join(snow_newline)
      }}
  vars:
    snow_newline: "\n"
    snow_incident_derived_correlation: >-
      {{
        'aap-patch:'
        ~ (snow_incident_hostname | trim)
        ~ ':'
        ~ (snow_incident_change_number | default('') | trim)
        ~ ':'
        ~ (snow_incident_job_id | default('') | trim)
      }}
    snow_incident_job_line: >-
      {{
        ('AAP job ' ~ snow_incident_job_id)
        if snow_incident_job_id | default('') | length > 0
        else ''
      }}
    snow_incident_context_lines:
      - "{{ ('Hostname: ' ~ snow_incident_hostname) if snow_incident_hostname | default('') | length > 0 else '' }}"
      - "{{ ('AAP job: ' ~ snow_incident_job_id) if snow_incident_job_id | default('') | length > 0 else '' }}"
      - "{{ ('Change: ' ~ snow_incident_change_number) if snow_incident_change_number | default('') | length > 0 else '' }}"
      - "{{ ('Failure: ' ~ snow_incident_failure) if snow_incident_failure | default('') | length > 0 else '' }}"
      - "{{ snow_incident_description | default('') }}"

- name: Reject a correlation id that cannot be queried safely
  ansible.builtin.assert:
    that:
      - snow_incident_correlation_resolved is not search('\\^|\\r|\\n')
    fail_msg: >-
      The incident correlation id cannot contain ^ or a line break.
      No incident was created.
    quiet: true

- name: Look for an incident that already uses this correlation id
  block:
    # args[module] does not see the collection env_fallback for SN_USERNAME.
    - name: Query incidents by correlation id  # noqa: args[module]
      servicenow.itsm.incident_info:
        instance:
          host: "{{ lookup('ansible.builtin.env', 'SN_HOST') }}"
          validate_certs: true
        sysparm_query: "correlation_id={{ snow_incident_correlation_resolved }}"
      register: snow_incident_correlation_lookup
      no_log: true
  rescue:
    - name: Report the correlation lookup failure
      ansible.builtin.fail:
        msg: >-
          Could not search for an existing incident before create.
          {{ ansible_failed_result.msg | default('The collection did not return an error message.') }}

- name: Keep only exact correlation id matches
  ansible.builtin.set_fact:
    snow_incident_correlation_matches: >-
      {{
        snow_incident_correlation_lookup.records | default([])
        | selectattr('correlation_id', 'defined')
        | selectattr('correlation_id', 'equalto', snow_incident_correlation_resolved)
        | list
      }}

- name: Fail when the correlation query is not exact
  when:
    - snow_incident_correlation_lookup.records | default([]) | length > 0
    - snow_incident_correlation_matches | length != snow_incident_correlation_lookup.records | length
  ansible.builtin.fail:
    msg: >-
      The correlation id search for {{ snow_incident_correlation_resolved }}
      returned records that do not match exactly. No incident was created.

- name: Fail when more than one incident uses this correlation id
  when: snow_incident_correlation_matches | length > 1
  ansible.builtin.fail:
    msg: >-
      ServiceNow returned {{ snow_incident_correlation_matches | length }} incidents
      for correlation id {{ snow_incident_correlation_resolved }}.
      No additional incident was created.

- name: Publish the existing incident instead of creating another
  when: snow_incident_correlation_matches | length == 1
  ansible.builtin.set_fact:
    snow_incident_result:
      operation: create
      success: true
      reused: true
      number: "{{ snow_incident_correlation_matches[0].number }}"
      sys_id: "{{ snow_incident_correlation_matches[0].sys_id }}"
      state: "{{ snow_incident_correlation_matches[0].state | default('') }}"
      short_description: "{{ snow_incident_correlation_matches[0].short_description | default('') }}"
      correlation_id: "{{ snow_incident_correlation_resolved }}"
      hostname: "{{ snow_incident_hostname }}"
      message: >-
        Reused incident {{ snow_incident_correlation_matches[0].number }}
        for correlation id {{ snow_incident_correlation_resolved }}.
        State is {{ snow_incident_correlation_matches[0].state | default('') }}.
        A second incident was not created. After that incident is closed,
        pass a new snow_incident_correlation_id to open another one.

- name: Create the incident
  when: snow_incident_correlation_matches | length == 0
  block:
    - name: Send a new incident to ServiceNow
      servicenow.itsm.incident:
        instance:
          host: "{{ lookup('ansible.builtin.env', 'SN_HOST') }}"
          validate_certs: true
        state: new
        caller: "{{ snow_incident_caller }}"
        short_description: "{{ snow_incident_short_description_resolved }}"
        description: >-
          {{
            snow_incident_description_resolved
            if snow_incident_description_resolved | default('') | length > 0
            else omit
          }}
        impact: "{{ snow_incident_selected_direct_fields.impact | default(omit, true) }}"
        urgency: "{{ snow_incident_selected_direct_fields.urgency | default(omit, true) }}"
        other: "{{ snow_incident_create_other }}"
      vars:
        snow_incident_create_other: >-
          {{
            snow_incident_selected_other_fields | default({})
            | combine({'correlation_id': snow_incident_correlation_resolved})
            | combine(
                {'work_notes': snow_incident_work_notes_resolved}
                if snow_incident_work_notes_resolved | default('') | length > 0
                else {}
              )
            | combine(
                {'cmdb_ci': snow_incident_ci_sys_id}
                if snow_incident_ci_sys_id | default('') | length > 0
                else {}
              )
            | combine(
                {'assignment_group': snow_incident_assignment_group_id}
                if snow_incident_assignment_group_id | default('') | length > 0
                else {}
              )
            | combine(
                {'priority': snow_incident_priority | string}
                if snow_incident_priority | default('') | string | length > 0
                else {}
              )
          }}
      register: snow_incident_api
      no_log: true
  rescue:
    - name: Report the ServiceNow create failure
      ansible.builtin.fail:
        msg: >-
          ServiceNow did not create the incident.
          {{ ansible_failed_result.msg | default('The collection did not return an error message.') }}

- name: Require identity fields on the created incident
  when: snow_incident_correlation_matches | length == 0
  ansible.builtin.assert:
    that:
      - snow_incident_api.record is mapping
      - snow_incident_api.record.number | default('') | length > 0
      - snow_incident_api.record.sys_id | default('') | length > 0
    fail_msg: ServiceNow did not return an incident number and sys_id.
    quiet: true

- name: Publish the created incident
  when: snow_incident_correlation_matches | length == 0
  ansible.builtin.set_fact:
    snow_incident_result:
      operation: create
      success: true
      reused: false
      number: "{{ snow_incident_api.record.number }}"
      sys_id: "{{ snow_incident_api.record.sys_id }}"
      state: "{{ snow_incident_api.record.state | default('') }}"
      short_description: "{{ snow_incident_api.record.short_description | default(snow_incident_short_description_resolved) }}"
      correlation_id: "{{ snow_incident_correlation_resolved }}"
      hostname: "{{ snow_incident_hostname }}"
      message: >-
        Created incident {{ snow_incident_api.record.number }}
        for correlation id {{ snow_incident_correlation_resolved }}.
