---
# Ask ServiceNow to close this incident. This does not walk New,
# In Progress, On Hold, or Resolved, and it does not treat the module
# response as proof. A follow-up read must show state closed.

- name: Confirm the incident exists before close
  block:
    # args[module] does not see the collection env_fallback for SN_USERNAME.
    - name: Query ServiceNow by incident number before close  # noqa: args[module]
      servicenow.itsm.incident_info:
        instance:
          host: "{{ lookup('ansible.builtin.env', 'SN_HOST') }}"
          validate_certs: true
        number: "{{ snow_incident_number }}"
      register: snow_incident_lookup
      no_log: true
  rescue:
    - name: Report the ServiceNow lookup failure
      ansible.builtin.fail:
        msg: >-
          Could not read incident {{ snow_incident_number }} before close.
          {{ ansible_failed_result.msg | default('The collection did not return an error message.') }}

- name: Fail when the incident does not exist
  when: snow_incident_lookup.records | default([]) | length == 0
  ansible.builtin.fail:
    msg: "ServiceNow has no incident numbered {{ snow_incident_number }}."

- name: Fail when the incident number matches more than one record
  when: snow_incident_lookup.records | default([]) | length > 1
  ansible.builtin.fail:
    msg: >-
      ServiceNow returned {{ snow_incident_lookup.records | length }} records
      for {{ snow_incident_number }}.

- name: Request incident closure
  block:
    - name: Send the Closed state to ServiceNow
      servicenow.itsm.incident:
        instance:
          host: "{{ lookup('ansible.builtin.env', 'SN_HOST') }}"
          validate_certs: true
        number: "{{ snow_incident_number }}"
        state: closed
        close_code: "{{ snow_incident_close_code }}"
        close_notes: "{{ snow_incident_close_notes }}"
        impact: "{{ snow_incident_selected_direct_fields.impact | default(omit, true) }}"
        urgency: "{{ snow_incident_selected_direct_fields.urgency | default(omit, true) }}"
        other: "{{ snow_incident_close_other | default(omit, true) }}"
      vars:
        snow_incident_close_other: >-
          {{
            snow_incident_selected_other_fields | default({})
            | combine(
                {'assignment_group': snow_incident_assignment_group_id}
                if snow_incident_assignment_group_id | default('') | length > 0
                else {}
              )
            | combine(
                {'priority': snow_incident_priority | string}
                if snow_incident_priority | default('') | string | length > 0
                else {}
              )
          }}
      register: snow_incident_api
      no_log: true
  rescue:
    - name: Report the rejected close transition
      ansible.builtin.fail:
        msg: >-
          ServiceNow rejected closing {{ snow_incident_number }}.
          The incident must already be in a state this instance allows to
          move to Closed. This role does not walk intermediate states.
          Module error:
          {{ ansible_failed_result.msg | default('The collection did not return an error message.') }}

- name: Read the incident after the close request
  block:
    # args[module] does not see the collection env_fallback for SN_USERNAME.
    - name: Query the incident to verify its state  # noqa: args[module]
      servicenow.itsm.incident_info:
        instance:
          host: "{{ lookup('ansible.builtin.env', 'SN_HOST') }}"
          validate_certs: true
        number: "{{ snow_incident_number }}"
      register: snow_incident_verify
      no_log: true
  rescue:
    - name: Report the closure verification failure
      ansible.builtin.fail:
        msg: >-
          ServiceNow accepted a close call for {{ snow_incident_number }},
          but the follow-up read failed. Closure was not confirmed.
          {{ ansible_failed_result.msg | default('The collection did not return an error message.') }}

- name: Fail when the follow-up read is not exactly one incident
  when: snow_incident_verify.records | default([]) | length != 1
  ansible.builtin.fail:
    msg: >-
      Closure of {{ snow_incident_number }} was not confirmed.
      The follow-up read returned
      {{ snow_incident_verify.records | default([]) | length }} records.

- name: Fail when the incident is not closed
  when: snow_incident_verify.records[0].state | default('') != 'closed'
  ansible.builtin.fail:
    msg: >-
      ServiceNow did not leave {{ snow_incident_number }} in state closed.
      A follow-up read shows state
      {{ snow_incident_verify.records[0].state | default('') }}.
      The module response was not treated as proof of closure.
      This role expects the collection's default state label closed.

- name: Publish the confirmed closure
  ansible.builtin.set_fact:
    snow_incident_result:
      operation: close
      success: true
      closure_confirmed: true
      number: "{{ snow_incident_verify.records[0].number }}"
      sys_id: "{{ snow_incident_verify.records[0].sys_id }}"
      state: "{{ snow_incident_verify.records[0].state }}"
      short_description: "{{ snow_incident_verify.records[0].short_description | default('') }}"
      message: >-
        A follow-up read confirmed {{ snow_incident_verify.records[0].number }}
        is closed.
