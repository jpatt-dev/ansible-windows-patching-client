---
# Resolve inventory-derived host exceptions for this job.
# Inventory-derived truth: patching_exception_enabled / patching_exception_active.
# Full Patch reporting uses those facts, not a surveyed host list.

- name: Normalize patch exception reference
  ansible.builtin.set_fact:
    patching_exception_reference: "{{ patching_exception_reference | default('') | string | trim }}"
    patching_exception_source: "{{ patching_exception_source | default('inventory') }}"
  changed_when: false
  tags:
    - always

- name: Derive per-host patch-cycle exception membership
  ansible.builtin.set_fact:
    patching_exception_active: "{{ (patching_exception_enabled | default(false) | bool) or (patching_exception_active | default(false) | bool) }}"
    patching_exception_reference_effective: "{{ patching_exception_reference | default('') if ((patching_exception_enabled | default(false) | bool) or (patching_exception_active | default(false) | bool)) else '' }}"
    patching_exception_source: "{{ patching_exception_source | default('inventory') }}"
  changed_when: false
  tags:
    - always

- name: Report patch-cycle exception resolution for this host
  ansible.builtin.debug:
    msg:
      - "host: {{ inventory_hostname }}"
      - "patching_exception_active: {{ patching_exception_active | default(false) }}"
      - "patching_exception_reference_effective: {{ patching_exception_reference_effective | default('') }}"
      - "patching_exception_enabled: {{ patching_exception_enabled | default(false) }}"
      - "patching_exception_source: {{ patching_exception_source | default('inventory') }}"
  changed_when: false
  tags:
    - always
    - report
