---
# Map operator-facing survey variables to internal gates.
# One operator decision per action. Phases never authorize each other.
# Production surveys are authoritative.

- name: Normalize operator-facing patch and reboot authorizations
  ansible.builtin.set_fact:
    operator_authorize_patch_install: "{{ operator_authorize_patch_install | default(false) | bool }}"
    operator_allow_pre_patch_reboot: "{{ operator_allow_pre_patch_reboot | default(false) | bool }}"
    operator_allow_post_patch_reboot: "{{ operator_allow_post_patch_reboot | default(false) | bool }}"
  changed_when: false
  tags:
    - always

- name: Map operator authorizations to internal remediation gates
  ansible.builtin.set_fact:
    patch_apply_enabled: "{{ operator_authorize_patch_install | bool }}"
    pre_patch_reboot_enabled: "{{ operator_allow_pre_patch_reboot | bool }}"
    post_patch_reboot_enabled: "{{ operator_allow_post_patch_reboot | bool }}"
  changed_when: false
  tags:
    - always

- name: Derive reboot_enabled from phase authorizations only
  ansible.builtin.set_fact:
    reboot_enabled: "{{ (pre_patch_reboot_enabled | bool) or (post_patch_reboot_enabled | bool) }}"
  changed_when: false
  tags:
    - always

- name: Set remediating patch mode when install is authorized
  ansible.builtin.set_fact:
    windows_patch_mode: direct_win_updates
  when: patch_apply_enabled | bool
  changed_when: false
  tags:
    - always

- name: Keep check_only when install is not authorized
  ansible.builtin.set_fact:
    windows_patch_mode: check_only
  when: not (patch_apply_enabled | bool)
  changed_when: false
  tags:
    - always

- name: Reject remediation gates that do not match operator authorization
  ansible.builtin.assert:
    that:
      - (patch_apply_enabled | bool) == (operator_authorize_patch_install | bool)
      - (pre_patch_reboot_enabled | bool) == (operator_allow_pre_patch_reboot | bool)
      - (post_patch_reboot_enabled | bool) == (operator_allow_post_patch_reboot | bool)
      - >-
        (reboot_enabled | bool)
        == ((operator_allow_pre_patch_reboot | bool) or (operator_allow_post_patch_reboot | bool))
      - >-
        windows_patch_mode
        == ('direct_win_updates' if (operator_authorize_patch_install | bool) else 'check_only')
    fail_msg: >-
      Internal remediation gates do not match operator authorization.
      patch_apply_enabled={{ patch_apply_enabled | default('') }},
      pre_patch_reboot_enabled={{ pre_patch_reboot_enabled | default('') }},
      post_patch_reboot_enabled={{ post_patch_reboot_enabled | default('') }},
      reboot_enabled={{ reboot_enabled | default('') }},
      windows_patch_mode={{ windows_patch_mode | default('') }}.
      Operator install={{ operator_authorize_patch_install | default(false) }},
      pre-reboot={{ operator_allow_pre_patch_reboot | default(false) }},
      post-reboot={{ operator_allow_post_patch_reboot | default(false) }}.
      Do not supply the internal gate variables. Extra variables cannot
      enable installation or reboot ahead of the operator controls.
    quiet: true
  tags:
    - always

- name: Report normalized operator controls
  ansible.builtin.debug:
    msg:
      - "operator_authorize_patch_install: {{ operator_authorize_patch_install }}"
      - "operator_allow_pre_patch_reboot: {{ operator_allow_pre_patch_reboot }}"
      - "operator_allow_post_patch_reboot: {{ operator_allow_post_patch_reboot }}"
      - "patch_apply_enabled: {{ patch_apply_enabled }}"
      - "windows_patch_mode: {{ windows_patch_mode }}"
      - "reboot_enabled: {{ reboot_enabled }}"
      - "pre_patch_reboot_enabled: {{ pre_patch_reboot_enabled }}"
      - "post_patch_reboot_enabled: {{ post_patch_reboot_enabled }}"
  changed_when: false
  tags:
    - always
    - report
