---
# Write canonical Final Patch Report files from patch_workflow_report.
# WARNING: EE paths (e.g. /tmp) are ephemeral — AAP set_stats is primary.
# CSV is the concise business report. JSON remains the richer artifact.
# Caller: non-serial play, run_once: true, connection: local.

- name: Assert patch_workflow_report is available for Final Report write
  ansible.builtin.assert:
    that:
      - patch_workflow_report is defined
      - patch_workflow_report is mapping
    fail_msg: >-
      final_write.yml requires patch_workflow_report from final_aggregate.yml.
  tags:
    - report

- name: Resolve Final Report output paths
  ansible.builtin.set_fact:
    patch_report_output_dir_effective: "{{ patch_report_output_dir | default(report_dir | default('/tmp/aap-patch-reports')) }}"
    patch_final_report_timestamp: "{{ now(utc=true, fmt='%Y-%m-%dT%H-%M-%S') }}"
  changed_when: false
  tags:
    - report

- name: Set Final Report filenames
  ansible.builtin.set_fact:
    patch_final_report_json_path: "{{ patch_report_output_dir_effective }}/windows-final-patch-report-{{ patch_final_report_timestamp }}.json"
    patch_final_report_csv_path: "{{ patch_report_output_dir_effective }}/windows-final-patch-report-{{ patch_final_report_timestamp }}.csv"
    patch_final_report_md_path: "{{ patch_report_output_dir_effective }}/windows-final-patch-report-{{ patch_final_report_timestamp }}.md"
  changed_when: false
  tags:
    - report

- name: Initialize Final Report CSV header
  ansible.builtin.set_fact:
    _csv_lines:
      - '"Hostname","FQDN","OS Release","Post-Patch Kernel/Build","Location","Patched","Exempt","Result","Reason","Updates Installed","Updates Remaining","Change Ticket","Patch Wave","Reason Code","Pending Reboot","Manual Follow-up Required"'
  changed_when: false
  tags:
    - report

- name: Append quoted Final Report CSV host rows
  ansible.builtin.set_fact:
    _csv_lines: "{{ _csv_lines + [_csv_row] }}"
  vars:
    _csv_row: >-
      "{{ item.hostname | default(item.host | default('')) | string | replace('"', '""') }}","{{ item.fqdn | default('') | string | replace('"', '""') }}","{{ item.os_release | default('') | string | replace('"', '""') }}","{{ item.os_build | default('') | string | replace('"', '""') }}","{{ item.location | default('') | string | replace('"', '""') }}","{{ item.patched | default(false) | string | replace('"', '""') }}","{{ item.exempt | default(false) | string | replace('"', '""') }}","{{ item.result | default('') | string | replace('"', '""') }}","{{ item.reason | default('') | string | replace('"', '""') }}","{{ item.updates_installed | default('') | string | replace('"', '""') }}","{{ item.updates_remaining | default('') | string | replace('"', '""') }}","{{ item.change_ticket_id | default('') | string | replace('"', '""') }}","{{ item.patch_wave | default(item.patch_wave_name | default('')) | string | replace('"', '""') }}","{{ item.reason_code | default('') | string | replace('"', '""') }}","{{ (item.pending_reboot if (item.pending_reboot is defined) else 'not_available') | string | replace('"', '""') }}","{{ item.manual_followup_required | default(false) | string | replace('"', '""') }}"
  loop: "{{ patch_workflow_report.hosts | default([]) }}"
  loop_control:
    label: "{{ item.hostname | default(item.host | default('unknown')) }}"
  changed_when: false
  tags:
    - report

- name: Join Final Report CSV lines
  ansible.builtin.set_fact:
    patch_workflow_report_csv: "{{ (_csv_lines | join(csv_newline)) ~ csv_newline }}"
  vars:
    csv_newline: "\n"
  changed_when: false
  tags:
    - report

- name: Ensure Final Report output directory exists
  ansible.builtin.file:
    path: "{{ patch_report_output_dir_effective }}"
    state: directory
    mode: "0750"
  delegate_to: localhost
  become: false
  failed_when: false
  tags:
    - report

- name: Write Final Report JSON from patch_workflow_report
  ansible.builtin.copy:
    content: "{{ patch_workflow_report | to_nice_json }}\n"
    dest: "{{ patch_final_report_json_path }}"
    mode: "0640"
  delegate_to: localhost
  become: false
  tags:
    - report

- name: Write Final Report CSV from patch_workflow_report.hosts
  ansible.builtin.copy:
    content: "{{ patch_workflow_report_csv }}"
    dest: "{{ patch_final_report_csv_path }}"
    mode: "0640"
  delegate_to: localhost
  become: false
  tags:
    - report

- name: Write Final Report Markdown from patch_workflow_report
  ansible.builtin.copy:
    content: |
      # Windows Full Patch Final Report

      Generated: {{ patch_workflow_report.report_generated_at_utc | default('not_available') }}
      Change: {{ patch_workflow_report.change_ticket_id | default('') }}
      Limit: {{ patch_workflow_report.patch_target_scope | default('') }}
      Wave: {{ patch_workflow_report.patch_wave | default(patch_workflow_report.patch_wave_name | default('unspecified')) }}

      ## Summary

      Systems Targeted:       {{ patch_workflow_report.total_systems | default(0) }}
      Systems Patched:        {{ patch_workflow_report.systems_patched | default(0) }}
      Systems Not Patched:    {{ patch_workflow_report.systems_not_patched | default(0) }}

      Not Patched:
        Exempt:               {{ patch_workflow_report.not_patched_breakdown.exempt | default(0) }}
        Already Compliant:    {{ patch_workflow_report.not_patched_breakdown.already_compliant | default(0) }}
        Blocked:              {{ patch_workflow_report.not_patched_breakdown.blocked | default(0) }}
        Failed:               {{ patch_workflow_report.not_patched_breakdown.failed | default(0) }}
        Degraded:             {{ patch_workflow_report.not_patched_breakdown.degraded | default(0) }}
        Unknown:              {{ patch_workflow_report.not_patched_breakdown.unknown | default(0) }}

      Result counts:
        success:              {{ patch_workflow_report.status_counts.success | default(0) }}
        already_compliant:    {{ patch_workflow_report.status_counts.already_compliant | default(0) }}
        exempt:               {{ patch_workflow_report.status_counts.exempt | default(0) }}
        blocked:              {{ patch_workflow_report.status_counts.blocked | default(0) }}
        failed:               {{ patch_workflow_report.status_counts.failed | default(0) }}
        degraded:             {{ patch_workflow_report.status_counts.degraded | default(0) }}
        unknown:              {{ patch_workflow_report.status_counts.unknown | default(0) }}

      ## Host Summary

      | Hostname | FQDN | Result | Patched | Exempt | Pending Reboot | Follow-up | Reason | Installed | Remaining | Location |
      | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |
      {% for h in patch_workflow_report.hosts | default([]) %}
      | {{ h.hostname | default(h.host) }} | {{ h.fqdn | default('') }} | {{ h.result }} | {{ h.patched }} | {{ h.exempt }} | {{ h.pending_reboot if (h.pending_reboot is defined) else 'not_available' }} | {{ h.manual_followup_required | default(false) }} | {{ h.reason }} | {{ h.updates_installed }} | {{ h.updates_remaining }} | {{ h.location | default('') }} |
      {% endfor %}

      ## Exempt Hosts

      {% if (patch_workflow_report.exempt_hosts | default([]) | length) == 0 %}
      None.
      {% else %}
      {% for e in patch_workflow_report.exempt_hosts %}
      - {{ e.host }} — {{ e.reference | default('') }}
      {% endfor %}
      {% endif %}

      ## Host Details

      {% for h in patch_workflow_report.hosts | default([]) %}
      ### {{ h.hostname | default(h.host) }}

      - Result: {{ h.result }}
      - Reason: {{ h.reason }} ({{ h.reason_code }})
      - Patched: {{ h.patched }}
      - Exempt: {{ h.exempt }}
      - FQDN: {{ h.fqdn | default('') }}
      - OS release: {{ h.os_release | default('') }}
      - OS build: {{ h.os_build | default('') }}
      - Location: {{ h.location | default('') }}
      - Change ticket: {{ h.change_ticket_id | default('') }}
      - AAP job: {{ h.aap_job_id | default('') }}
      - Patch wave: {{ h.patch_wave | default(h.patch_wave_name | default('')) }}
      - Patch attempted: {{ h.patch_attempted | default('not_available') }}
      - Updates installed: {{ h.updates_installed | default('not_available') }}
      - Updates failed: {{ h.updates_failed | default('not_available') }}
      - Updates remaining: {{ h.updates_remaining | default('not_available') }}
      - Pre-patch reboot required/performed: {{ h.pre_patch_reboot_required | default('not_available') }} / {{ h.pre_patch_reboot_performed | default('not_available') }}
      - Post-patch reboot required/performed: {{ h.post_patch_reboot_required | default('not_available') }} / {{ h.post_patch_reboot_performed | default('not_available') }}
      - Pending reboot: {{ h.pending_reboot | default(h.pending_reboot_final | default('not_available')) }}
      - Postcheck status: {{ h.postcheck_status | default('not_available') }}
      - Precheck status: {{ h.precheck_status | default('not_available') }}
      - Exception reference: {{ ((h.patching_exception_reference | default('') | length) > 0) | ternary(h.patching_exception_reference, 'none') }}
      - Patch provider: {{ h.patch_provider | default('not_available') }}
      - WSUS validation: {{ h.windows_wsus_validation_status | default('not_available') }}
      - Manual follow-up: {{ h.manual_followup_required | default('not_available') }}
      - Upstream artifact status: {{ h.upstream_artifact_status | default('not_available') }}

      {% endfor %}

      ---
      JSON / AAP set_stats is the authoritative structured artifact.
      CSV is the concise operational report. Historical fields show
      not_available when that phase did not run. EE-local files are ephemeral.
    dest: "{{ patch_final_report_md_path }}"
    mode: "0640"
  delegate_to: localhost
  become: false
  tags:
    - report

- name: Publish Final Report file path facts for ServiceNow attachment
  ansible.builtin.set_fact:
    patch_report_files:
      - "{{ patch_final_report_json_path }}"
      - "{{ patch_final_report_md_path }}"
      - "{{ patch_final_report_csv_path }}"
    patch_report_primary_path: "{{ patch_final_report_json_path }}"
  changed_when: false
  tags:
    - report

- name: Publish Final Report CSV string artifact
  ansible.builtin.set_stats:
    data:
      patch_workflow_report_csv: "{{ patch_workflow_report_csv }}"
    per_host: false
  tags:
    - report

- name: Report Final Report file locations (ephemeral on EE)
  ansible.builtin.debug:
    msg:
      - "WARNING: Final Report files under {{ patch_report_output_dir_effective }} are ephemeral on AAP EEs."
      - "Primary artifact remains set_stats patch_workflow_report / patch_final_result."
      - "patch_report_primary_path: {{ patch_report_primary_path }}"
      - "patch_report_files: {{ patch_report_files }}"
  tags:
    - report
