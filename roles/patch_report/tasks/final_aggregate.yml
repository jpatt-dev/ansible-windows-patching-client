---
# Aggregate patch_final_result across the Limit population and print stdout summary.
# Must run from a non-serial play with run_once so aggregation is once per Limit
# (not once per serial batch).

- name: Build host list of existing final results
  ansible.builtin.set_fact:
    patch_workflow_hosts: "{{ ansible_play_hosts_all | map('extract', hostvars) | selectattr('patch_final_result', 'defined') | map(attribute='patch_final_result') | list }}"
  changed_when: false
  tags:
    - report

- name: Identify inventory hosts missing patch_final_result
  ansible.builtin.set_fact:
    _rpt_missing_hostnames: >-
      {{
        ansible_play_hosts_all
        | difference(
          patch_workflow_hosts
          | map(attribute='inventory_hostname')
          | list
        )
      }}
  changed_when: false
  tags:
    - report

- name: Synthesize unknown results for hosts missing patch_final_result
  ansible.builtin.set_fact:
    patch_workflow_hosts: "{{ patch_workflow_hosts + [_rpt_missing_result] }}"
  vars:
    _rpt_missing_result:
      schema_version: "3"
      hostname: "{{ item }}"
      host: "{{ item }}"
      inventory_hostname: "{{ item }}"
      fqdn: ""
      os_release: ""
      os_version: not_available
      os_build: ""
      os_build_pre: not_available
      location: "{{ hostvars[item].patch_location | default('') }}"
      snow_ci_sys_id: "{{ hostvars[item].sys_id | default('') | string | trim }}"
      patch_environment: "{{ hostvars[item].patch_environment | default('') }}"
      platform: windows
      report_source: windows_full_patch
      git_revision: not_available
      result: unknown
      reason: Final result was not produced for this host
      reason_code: UNKNOWN_RESULT
      final_status: unknown
      patched: false
      exempt: false
      patching_exception_reference: ""
      patching_exception_source: inventory
      patching_exception_kind: none
      patching_exception_status: none
      patching_exception_expires_at: ""
      patching_exception_patch_source: inventory
      patching_exception_patch_reference: ""
      patching_exception_patch_expires_at: ""
      patching_reboot_exception_active: false
      patching_reboot_exception_reference: ""
      patching_reboot_exception_source: inventory
      patching_reboot_exception_expires_at: ""
      updates_installed: not_available
      updates_remaining: not_available
      updates_failed: not_available
      updates_installed_kbs: not_available
      updates_failed_kbs: not_available
      patch_attempted: not_available
      pre_patch_reboot_performed: not_available
      post_patch_reboot_performed: not_available
      pending_reboot: not_available
      failed_phase: ""
      last_completed_phase: ""
      failure_timestamp_utc: not_available
      reboot_recovery_failed: not_available
      change_ticket_id: "{{ change_ticket_id | default('') }}"
      patch_wave: "{{ patch_wave_name | default('unspecified') }}"
      patch_wave_name: "{{ patch_wave_name | default('unspecified') }}"
      manual_followup_required: true
  loop: "{{ _rpt_missing_hostnames }}"
  loop_control:
    label: "{{ item }}"
  changed_when: false
  tags:
    - report

- name: Compute primary patched / not-patched totals
  ansible.builtin.set_fact:
    _rpt_total_systems: "{{ ansible_play_hosts_all | default([]) | length }}"
    _rpt_systems_patched: "{{ patch_workflow_hosts | map(attribute='patched') | map('bool') | select | list | length }}"
    _rpt_not_patched_hosts: "{{ patch_workflow_hosts | rejectattr('patched', 'equalto', true) | rejectattr('patched', 'equalto', 'True') | rejectattr('patched', 'equalto', 'true') | list }}"
  changed_when: false
  tags:
    - report

- name: Compute canonical result counts
  ansible.builtin.set_fact:
    patch_workflow_status_counts:
      success: "{{ patch_workflow_hosts | selectattr('result', 'equalto', 'success') | list | length }}"
      already_compliant: "{{ patch_workflow_hosts | selectattr('result', 'equalto', 'already_compliant') | list | length }}"
      exempt: "{{ patch_workflow_hosts | selectattr('result', 'equalto', 'exempt') | list | length }}"
      blocked: "{{ patch_workflow_hosts | selectattr('result', 'equalto', 'blocked') | list | length }}"
      failed: "{{ patch_workflow_hosts | selectattr('result', 'equalto', 'failed') | list | length }}"
      degraded: "{{ patch_workflow_hosts | selectattr('result', 'equalto', 'degraded') | list | length }}"
      unknown: "{{ patch_workflow_hosts | selectattr('result', 'equalto', 'unknown') | list | length }}"
  changed_when: false
  tags:
    - report

- name: Compute systems not patched and not-patched breakdown
  ansible.builtin.set_fact:
    _rpt_systems_not_patched: "{{ (_rpt_total_systems | int) - (_rpt_systems_patched | int) }}"
    patch_workflow_not_patched_breakdown:
      exempt: "{{ _rpt_not_patched_hosts | selectattr('result', 'equalto', 'exempt') | list | length }}"
      already_compliant: "{{ _rpt_not_patched_hosts | selectattr('result', 'equalto', 'already_compliant') | list | length }}"
      blocked: "{{ _rpt_not_patched_hosts | selectattr('result', 'equalto', 'blocked') | list | length }}"
      failed: "{{ _rpt_not_patched_hosts | selectattr('result', 'equalto', 'failed') | list | length }}"
      degraded: "{{ _rpt_not_patched_hosts | selectattr('result', 'equalto', 'degraded') | list | length }}"
      unknown: "{{ _rpt_not_patched_hosts | selectattr('result', 'equalto', 'unknown') | list | length }}"
  changed_when: false
  tags:
    - report

- name: Initialize exempt and follow-up lists
  ansible.builtin.set_fact:
    patch_workflow_exempt_hosts: []
    patch_workflow_manual_followup_hosts: []
  changed_when: false
  tags:
    - report

- name: Collect exempt hosts
  ansible.builtin.set_fact:
    patch_workflow_exempt_hosts: "{{ patch_workflow_exempt_hosts + [{'host': item.hostname | default(item.host), 'reference': item.patching_exception_reference | default('')}] }}"
  loop: "{{ patch_workflow_hosts }}"
  when: (item.result | default('')) == 'exempt' or (item.exempt | default(false) | bool)
  loop_control:
    label: "{{ item.hostname | default(item.host | default('unknown')) }}"
  changed_when: false
  tags:
    - report

- name: Collect manual follow-up hosts
  ansible.builtin.set_fact:
    patch_workflow_manual_followup_hosts: "{{ patch_workflow_manual_followup_hosts + [item.hostname | default(item.host)] }}"
  loop: "{{ patch_workflow_hosts }}"
  when: item.manual_followup_required | default(false) | bool
  loop_control:
    label: "{{ item.hostname | default(item.host | default('unknown')) }}"
  changed_when: false
  tags:
    - report

- name: Resolve numeric totals only when all values are known
  ansible.builtin.set_fact:
    _installed_values: "{{ patch_workflow_hosts | map(attribute='updates_installed') | list }}"
    _remaining_values: "{{ patch_workflow_hosts | map(attribute='updates_remaining') | list }}"
    _pre_reboot_values: "{{ patch_workflow_hosts | map(attribute='pre_patch_reboot_performed') | list }}"
    _post_reboot_values: "{{ patch_workflow_hosts | map(attribute='post_patch_reboot_performed') | list }}"
  changed_when: false
  tags:
    - report

- name: Compute known numeric aggregates
  ansible.builtin.set_fact:
    _updates_installed_total: >-
      {{
        (_installed_values | map('int') | sum)
        if ((_installed_values | select('equalto', 'not_available') | list | length) == 0)
        else 'not_available'
      }}
    _updates_remaining_total: >-
      {{
        (_remaining_values | map('int') | sum)
        if ((_remaining_values | select('equalto', 'not_available') | list | length) == 0)
        else 'not_available'
      }}
    _reboots_performed_total: >-
      {{
        (
          (_pre_reboot_values | map('bool') | select | list | length)
          + (_post_reboot_values | map('bool') | select | list | length)
        )
        if (
          (_pre_reboot_values | select('equalto', 'not_available') | list | length) == 0
          and (_post_reboot_values | select('equalto', 'not_available') | list | length) == 0
        )
        else 'not_available'
      }}
  changed_when: false
  tags:
    - report

- name: Collect unique host patch_environment values
  ansible.builtin.set_fact:
    _rpt_patch_environments: "{{ patch_workflow_hosts | map(attribute='patch_environment', default='') | map('string') | map('trim') | unique | list | sort }}"
  changed_when: false
  tags:
    - report

- name: Resolve run-level patch_environment from the full host set
  ansible.builtin.set_fact:
    _rpt_run_patch_environment: "{{ '' if ((_rpt_patch_environments | length) == 0) else (_rpt_patch_environments[0] if ((_rpt_patch_environments | length) == 1) else 'inconsistent') }}"
  changed_when: false
  tags:
    - report

- name: Build patch_workflow_report aggregate
  ansible.builtin.set_fact:
    patch_workflow_report:
      schema_version: "3"
      report_source: "{{ patch_report_source | default('windows_full_patch') }}"
      platform: "{{ patch_report_platform | default('windows') }}"
      patch_environment: "{{ _rpt_run_patch_environment }}"
      patch_environments: "{{ _rpt_patch_environments }}"
      git_revision: >-
        {{
          lookup('ansible.builtin.env', 'GIT_COMMIT')
          | default(lookup('ansible.builtin.env', 'CI_COMMIT_SHA') | default('not_available', true), true)
        }}
      report_generated_at_utc: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
      change_ticket_id: "{{ change_ticket_id | default('') }}"
      aap_job_id: "{{ tower_job_id | default(awx_job_id | default('')) }}"
      aap_limit: "{{ patch_target_scope | default(ansible_limit | default('')) }}"
      patch_target_scope: "{{ patch_target_scope | default(ansible_limit | default('')) }}"
      patch_wave: "{{ patch_wave_name | default('unspecified') }}"
      patch_wave_name: "{{ patch_wave_name | default('unspecified') }}"
      total_systems: "{{ _rpt_total_systems }}"
      systems_patched: "{{ _rpt_systems_patched }}"
      systems_not_patched: "{{ _rpt_systems_not_patched }}"
      not_patched_breakdown: "{{ patch_workflow_not_patched_breakdown }}"
      total_hosts: "{{ _rpt_total_systems }}"
      status_counts: "{{ patch_workflow_status_counts }}"
      manual_followup_hosts: "{{ patch_workflow_manual_followup_hosts }}"
      exempt_hosts: "{{ patch_workflow_exempt_hosts }}"
      updates_installed_total: "{{ _updates_installed_total }}"
      updates_remaining_total: "{{ _updates_remaining_total }}"
      reboots_performed_total: "{{ _reboots_performed_total }}"
      hosts: "{{ patch_workflow_hosts }}"
  changed_when: false
  tags:
    - report

- name: Render machine-readable JSON artifact string
  ansible.builtin.set_fact:
    patch_workflow_report_json: "{{ patch_workflow_report | to_json }}"
  changed_when: false
  tags:
    - report

- name: Print Final Patch Report header
  ansible.builtin.debug:
    msg:
      - "WINDOWS FULL PATCH FINAL REPORT"
      - "Change: {{ change_ticket_id | default('') }}"
      - "Limit: {{ patch_target_scope | default(ansible_limit | default('')) }}"
      - "Wave: {{ patch_wave_name | default('unspecified') }}"
      - "Generated: {{ patch_workflow_report.report_generated_at_utc }}"
      - "----------------------------------------------------------------"
      - "Systems Targeted:       {{ patch_workflow_report.total_systems }}"
      - "Systems Patched:        {{ patch_workflow_report.systems_patched }}"
      - "Systems Not Patched:    {{ patch_workflow_report.systems_not_patched }}"
      - ""
      - "Not Patched:"
      - "  Exempt:               {{ patch_workflow_report.not_patched_breakdown.exempt }}"
      - "  Already Compliant:    {{ patch_workflow_report.not_patched_breakdown.already_compliant }}"
      - "  Blocked:              {{ patch_workflow_report.not_patched_breakdown.blocked }}"
      - "  Failed:               {{ patch_workflow_report.not_patched_breakdown.failed }}"
      - "  Degraded:             {{ patch_workflow_report.not_patched_breakdown.degraded }}"
      - "  Unknown:              {{ patch_workflow_report.not_patched_breakdown.unknown }}"
      - "----------------------------------------------------------------"
      - "Hostname | Result | Patched | Exempt | Reason | Installed | Remaining"
  tags:
    - report

- name: Print Final Patch Report per-host rows
  ansible.builtin.debug:
    msg: >-
      {{ item.hostname | default(item.host) }} | {{ item.result }} | {{ item.patched }} | {{ item.exempt }} | {{ item.reason }} | {{ item.updates_installed }} | {{ item.updates_remaining }}
  loop: "{{ patch_workflow_hosts }}"
  loop_control:
    label: "{{ item.hostname | default(item.host | default('unknown')) }}"
  tags:
    - report

- name: Publish aggregate Final Patch Report artifacts
  ansible.builtin.set_stats:
    data:
      patch_workflow_report: "{{ patch_workflow_report }}"
      patch_workflow_report_json: "{{ patch_workflow_report_json }}"
    per_host: false
  tags:
    - report
