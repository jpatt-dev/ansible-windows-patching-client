---
# Build per-host patch_final_result from current host facts + phase history maps.
# full_patch.yml preserves host-local maps after each phase, e.g.:
#   patch_phase_apply[inventory_hostname]
# Missing host entry → not_available (never invent history).
# Do not infer patch_attempted, updates_installed, or reboot_performed from
# final machine state.

- name: Capture report generation timestamp
  ansible.builtin.set_fact:
    patch_report_generated_at_utc: "{{ now(utc=true, fmt='%Y-%m-%dT%H:%M:%SZ') }}"
  changed_when: false
  tags:
    - report

- name: Resolve upstream phase artifacts for this host
  ansible.builtin.set_fact:
    _ua_precheck_present: "{{ (patch_phase_precheck is defined) and (patch_phase_precheck is mapping) and (inventory_hostname in patch_phase_precheck) }}"
    _ua_reboot_pre_present: "{{ (patch_phase_reboot_pre is defined) and (patch_phase_reboot_pre is mapping) and (inventory_hostname in patch_phase_reboot_pre) }}"
    _ua_discovery_present: "{{ (patch_phase_discovery is defined) and (patch_phase_discovery is mapping) and (inventory_hostname in patch_phase_discovery) }}"
    _ua_apply_present: "{{ (patch_phase_apply is defined) and (patch_phase_apply is mapping) and (inventory_hostname in patch_phase_apply) }}"
    _ua_reboot_post_present: "{{ (patch_phase_reboot_post is defined) and (patch_phase_reboot_post is mapping) and (inventory_hostname in patch_phase_reboot_post) }}"
    _ua_postcheck_present: "{{ (patch_phase_postcheck is defined) and (patch_phase_postcheck is mapping) and (inventory_hostname in patch_phase_postcheck) }}"
  changed_when: false
  tags:
    - report

- name: Extract this host's records from preserved phase maps
  ansible.builtin.set_fact:
    _upstream_precheck: "{{ patch_phase_precheck[inventory_hostname] if (_ua_precheck_present | bool) else {} }}"
    _upstream_reboot_pre: "{{ patch_phase_reboot_pre[inventory_hostname] if (_ua_reboot_pre_present | bool) else {} }}"
    _upstream_discovery: "{{ patch_phase_discovery[inventory_hostname] if (_ua_discovery_present | bool) else {} }}"
    _upstream_apply: "{{ patch_phase_apply[inventory_hostname] if (_ua_apply_present | bool) else {} }}"
    _upstream_reboot_post: "{{ patch_phase_reboot_post[inventory_hostname] if (_ua_reboot_post_present | bool) else {} }}"
    _upstream_postcheck: "{{ patch_phase_postcheck[inventory_hostname] if (_ua_postcheck_present | bool) else {} }}"
  changed_when: false
  tags:
    - report

- name: Derive upstream artifact availability status
  ansible.builtin.set_fact:
    _upstream_artifacts:
      precheck: "{{ _ua_precheck_present | bool }}"
      reboot_pre: "{{ _ua_reboot_pre_present | bool }}"
      discovery: "{{ _ua_discovery_present | bool }}"
      apply: "{{ _ua_apply_present | bool }}"
      reboot_post: "{{ _ua_reboot_post_present | bool }}"
      postcheck: "{{ _ua_postcheck_present | bool }}"
    _upstream_present_count: >-
      {{
        (
          ((_ua_precheck_present | bool) | ternary(1, 0))
          + ((_ua_reboot_pre_present | bool) | ternary(1, 0))
          + ((_ua_discovery_present | bool) | ternary(1, 0))
          + ((_ua_apply_present | bool) | ternary(1, 0))
          + ((_ua_reboot_post_present | bool) | ternary(1, 0))
          + ((_ua_postcheck_present | bool) | ternary(1, 0))
        )
      }}
  changed_when: false
  tags:
    - report

- name: Set upstream_artifact_status complete/partial/none
  ansible.builtin.set_fact:
    _upstream_artifact_status: >-
      {{
        'complete'
        if ((_upstream_present_count | int) == 6)
        else (
          'none'
          if ((_upstream_present_count | int) == 0)
          else 'partial'
        )
      }}
  changed_when: false
  tags:
    - report

- name: Report upstream phase artifact availability diagnostics
  ansible.builtin.debug:
    msg:
      - "UPSTREAM PHASE ARTIFACT AVAILABILITY"
      - "host: {{ inventory_hostname }}"
      - "patch_phase_precheck: {{ (_ua_precheck_present | bool) | ternary('present', 'missing') }}"
      - "patch_phase_reboot_pre: {{ (_ua_reboot_pre_present | bool) | ternary('present', 'missing') }}"
      - "patch_phase_discovery: {{ (_ua_discovery_present | bool) | ternary('present', 'missing') }}"
      - "patch_phase_apply: {{ (_ua_apply_present | bool) | ternary('present', 'missing') }}"
      - "patch_phase_reboot_post: {{ (_ua_reboot_post_present | bool) | ternary('present', 'missing') }}"
      - "patch_phase_postcheck: {{ (_ua_postcheck_present | bool) | ternary('present', 'missing') }}"
      - "upstream_artifact_status: {{ _upstream_artifact_status }}"
  changed_when: false
  tags:
    - report

- name: Resolve upstream history fields with not_available fallback
  ansible.builtin.set_fact:
    _final_patch_attempted: >-
      {{
        _upstream_apply.patch_attempted
        if (_upstream_apply is mapping and (_upstream_apply.patch_attempted | default('') | string | length) > 0)
        else 'not_available'
      }}
    _final_updates_installed: >-
      {{
        _upstream_apply.updates_installed
        if (_upstream_apply is mapping and (_upstream_apply.updates_installed | default('') | string | length) > 0
            and (_upstream_apply.updates_installed | default('') | string) != 'not_available')
        else 'not_available'
      }}
    _final_updates_failed: >-
      {{
        _upstream_apply.updates_failed
        if (_upstream_apply is mapping and (_upstream_apply.updates_failed | default('') | string | length) > 0
            and (_upstream_apply.updates_failed | default('') | string) != 'not_available')
        else 'not_available'
      }}
    _final_pre_reboot_required: >-
      {{
        _upstream_reboot_pre.pre_patch_reboot_required
        if (_upstream_reboot_pre is mapping and (_upstream_reboot_pre.pre_patch_reboot_required | default('') | string | length) > 0
            and (_upstream_reboot_pre.pre_patch_reboot_required | default('') | string) != 'not_available')
        else (
          _upstream_reboot_pre.reboot_required
          if (_upstream_reboot_pre is mapping and (_upstream_reboot_pre.reboot_required | default('') | string | length) > 0)
          else 'not_available'
        )
      }}
    _final_pre_reboot_performed: >-
      {{
        _upstream_reboot_pre.pre_patch_reboot_performed
        if (_upstream_reboot_pre is mapping and (_upstream_reboot_pre.pre_patch_reboot_performed | default('') | string | length) > 0
            and (_upstream_reboot_pre.pre_patch_reboot_performed | default('') | string) != 'not_available')
        else (
          _upstream_reboot_pre.reboot_performed
          if (_upstream_reboot_pre is mapping and (_upstream_reboot_pre.reboot_performed | default('') | string | length) > 0)
          else 'not_available'
        )
      }}
    _final_post_reboot_required: >-
      {{
        _upstream_reboot_post.post_patch_reboot_required
        if (_upstream_reboot_post is mapping and (_upstream_reboot_post.post_patch_reboot_required | default('') | string | length) > 0
            and (_upstream_reboot_post.post_patch_reboot_required | default('') | string) != 'not_available')
        else (
          _upstream_reboot_post.reboot_required
          if (_upstream_reboot_post is mapping and (_upstream_reboot_post.reboot_required | default('') | string | length) > 0)
          else 'not_available'
        )
      }}
    _final_post_reboot_performed: >-
      {{
        _upstream_reboot_post.post_patch_reboot_performed
        if (_upstream_reboot_post is mapping and (_upstream_reboot_post.post_patch_reboot_performed | default('') | string | length) > 0
            and (_upstream_reboot_post.post_patch_reboot_performed | default('') | string) != 'not_available')
        else (
          _upstream_reboot_post.reboot_performed
          if (_upstream_reboot_post is mapping and (_upstream_reboot_post.reboot_performed | default('') | string | length) > 0)
          else 'not_available'
        )
      }}
    _final_postcheck_status: >-
      {{
        _upstream_postcheck.postcheck_status
        if (_ua_postcheck_present | bool and (_upstream_postcheck.postcheck_status | default('') | string | length) > 0)
        else (postcheck_status | default('not_available'))
      }}
  changed_when: false
  tags:
    - report

- name: Normalize canonical reporting inputs
  ansible.builtin.set_fact:
    _rpt_exempt: "{{ (patching_exception_enabled | default(false) | bool) or (patching_exception_active | default(false) | bool) }}"
    _rpt_unreachable: "{{ (not (windows_connectivity_ok | default(false) | bool)) or (windows_winrm_ping.unreachable | default(false) | bool) }}"
    _rpt_eligible: "{{ patch_host_eligible | default(false) | bool }}"
    _rpt_precheck_status: "{{ precheck_status | default(_upstream_precheck.precheck_status | default('missing')) }}"
    _rpt_lifecycle_failed: "{{ patch_lifecycle_failed | default(false) | bool }}"
    _rpt_attempted: >-
      {{
        (_final_patch_attempted | bool)
        if ((_final_patch_attempted | default('not_available') | string) not in ['not_available', ''])
        else false
      }}
    _rpt_installed: >-
      {{
        (_final_updates_installed | int)
        if ((_final_updates_installed | default('not_available') | string) not in ['not_available', ''])
        else 0
      }}
    _rpt_failed_updates: >-
      {{
        (_final_updates_failed | int)
        if ((_final_updates_failed | default('not_available') | string) not in ['not_available', ''])
        else 0
      }}
    _rpt_remaining_known: >-
      {{
        (windows_update_search is defined)
        and (windows_update_search is mapping)
        and (not (windows_update_search.skipped | default(false) | bool))
        and (not (windows_update_search.failed | default(false) | bool))
        and (windows_update_search.found_update_count is defined)
        and (windows_connectivity_ok | default(false) | bool)
      }}
    _rpt_remaining: >-
      {{
        (windows_update_search.found_update_count | int)
        if (
          (windows_update_search is defined)
          and (windows_update_search is mapping)
          and (windows_update_search.found_update_count is defined)
        )
        else 'not_available'
      }}
    _rpt_apply_failed: >-
      {{
        ((_upstream_apply.patch_status | default('')) == 'failed')
        or (
          ((_final_updates_failed | default('not_available') | string) not in ['not_available', ''])
          and ((_final_updates_failed | int) > 0)
        )
      }}
    _rpt_postcheck_unhealthy: >-
      {{
        (not (windows_critical_services_ok | default(true) | bool))
        or (windows_disk_low | default(false) | bool)
        or ((_final_postcheck_status | default('')) == 'failed')
      }}
    _rpt_pending_reboot: >-
      {{
        (pending_reboot is defined)
        and ((pending_reboot | string) not in ['not_available', ''])
        and (pending_reboot | bool)
      }}
    _rpt_hostname: "{{ windows_hostname | default(inventory_hostname) }}"
    _rpt_fqdn: "{{ windows_fqdn | default('') }}"
    _rpt_os_release: >-
      {{
        windows_os_caption
        if ((windows_os_caption | default('unknown') | string) not in ['unknown', ''])
        else ''
      }}
    _rpt_os_build: "{{ windows_os_build | default('') }}"
    _rpt_location: "{{ patch_location | default('') }}"
    _rpt_aap_job_id: "{{ tower_job_id | default(awx_job_id | default('')) }}"
  changed_when: false
  tags:
    - report

- name: Derive remaining-update evidence flags
  ansible.builtin.set_fact:
    _rpt_remaining_zero: >-
      {{
        (_rpt_remaining_known | bool)
        and ((_rpt_remaining | default('not_available') | string) != 'not_available')
        and ((_rpt_remaining | int) == 0)
      }}
    _rpt_remaining_positive: >-
      {{
        (_rpt_remaining_known | bool)
        and ((_rpt_remaining | default('not_available') | string) != 'not_available')
        and ((_rpt_remaining | int) > 0)
      }}
  changed_when: false
  tags:
    - report

- name: Derive business patched boolean from Apply history only
  ansible.builtin.set_fact:
    _rpt_patched: "{{ (_ua_apply_present | bool) and (_rpt_attempted | bool) and ((_rpt_installed | int) > 0) }}"
  changed_when: false
  tags:
    - report

- name: Derive canonical result, reason, and reason_code
  ansible.builtin.set_fact:
    _rpt_result: >-
      {{
        'exempt'
        if (_rpt_exempt | bool)
        else (
          'failed'
          if (_rpt_unreachable | bool)
          else (
            'failed'
            if (
              (_rpt_lifecycle_failed | bool)
              or (_rpt_apply_failed | bool)
              or ((_final_postcheck_status | default('')) == 'failed')
            )
            else (
              'blocked'
              if (
                (not (_rpt_eligible | bool))
                and ((_rpt_precheck_status | default('missing')) in ['blocked', 'failed'])
              )
              else (
                'unknown'
                if (not (_rpt_eligible | bool))
                else (
                  'unknown'
                  if ((_rpt_patched | bool) and (not (_ua_postcheck_present | bool)))
                  else (
                    'degraded'
                    if (_rpt_postcheck_unhealthy | bool)
                    else (
                      'degraded'
                      if ((_rpt_patched | bool) and (_rpt_remaining_positive | bool))
                      else (
                        'degraded'
                        if (_rpt_pending_reboot | bool)
                        else (
                          'success'
                          if (
                            (_rpt_patched | bool)
                            and (_ua_postcheck_present | bool)
                            and (_rpt_remaining_zero | bool)
                            and (not (_rpt_pending_reboot | bool))
                            and (not (_rpt_postcheck_unhealthy | bool))
                          )
                          else (
                            'already_compliant'
                            if (
                              (not (_rpt_patched | bool))
                              and (_rpt_remaining_zero | bool)
                              and (not (_rpt_pending_reboot | bool))
                              and (not (_rpt_postcheck_unhealthy | bool))
                            )
                            else (
                              'blocked'
                              if (
                                (not (_rpt_patched | bool))
                                and (_rpt_remaining_positive | bool)
                                and (not (_rpt_attempted | bool))
                              )
                              else (
                                'failed'
                                if (
                                  (not (_rpt_patched | bool))
                                  and (_rpt_remaining_positive | bool)
                                  and (_rpt_attempted | bool)
                                  and ((_rpt_installed | int) == 0)
                                )
                                else 'unknown'
                              )
                            )
                          )
                        )
                      )
                    )
                  )
                )
              )
            )
          )
        )
      }}
  changed_when: false
  tags:
    - report

- name: Derive readable reason and stable reason_code
  ansible.builtin.set_fact:
    _rpt_reason_code: >-
      {{
        'PATCH_EXEMPTION'
        if (_rpt_result == 'exempt')
        else (
          'UNREACHABLE'
          if (_rpt_result == 'failed' and (_rpt_unreachable | bool))
          else (
            'REBOOT_FAILED'
            if (
              (_rpt_result == 'failed')
              and (_rpt_lifecycle_failed | bool)
              and (
                (
                  (_ua_apply_present | bool)
                  and (not (_ua_reboot_post_present | bool))
                )
                or (
                  (_rpt_eligible | bool)
                  and (not (_ua_reboot_pre_present | bool))
                  and (not (_ua_apply_present | bool))
                )
              )
            )
            else (
              'PATCH_INSTALL_FAILED'
              if (_rpt_result == 'failed' and not (_rpt_unreachable | bool))
              else (
                'PRECHECK_BLOCKED'
                if (
                  (_rpt_result == 'blocked')
                  and ((_rpt_precheck_status | default('')) in ['blocked', 'failed'])
                )
                else (
                  'INSTALL_NOT_AUTHORIZED'
                  if (_rpt_result == 'blocked')
                  else (
                    'POSTCHECK_DEGRADED'
                    if (_rpt_result == 'degraded' and (_rpt_postcheck_unhealthy | bool))
                    else (
                      'PARTIAL_PATCH'
                      if (_rpt_result == 'degraded' and (_rpt_remaining_positive | bool))
                      else (
                        'PENDING_REBOOT'
                        if (_rpt_result == 'degraded')
                        else (
                          'NO_APPLICABLE_UPDATES'
                          if (_rpt_result == 'already_compliant')
                          else (
                            'PATCH_SUCCEEDED'
                            if (_rpt_result == 'success')
                            else (
                              'POSTCHECK_MISSING'
                              if (
                                (_rpt_result == 'unknown')
                                and (_rpt_patched | bool)
                                and (not (_ua_postcheck_present | bool))
                              )
                              else 'UNKNOWN_RESULT'
                            )
                          )
                        )
                      )
                    )
                  )
                )
              )
            )
          )
        )
      }}
    _rpt_reason: >-
      {{
        'Approved exemption'
        if (_rpt_result == 'exempt')
        else (
          'Host unreachable'
          if (_rpt_result == 'failed' and (_rpt_unreachable | bool))
          else (
            'Pre-patch reboot failed'
            if (
              (_rpt_result == 'failed')
              and (_rpt_lifecycle_failed | bool)
              and (_rpt_eligible | bool)
              and (not (_ua_reboot_pre_present | bool))
              and (not (_ua_apply_present | bool))
            )
            else (
              'Post-patch reboot failed'
              if (
                (_rpt_result == 'failed')
                and (_rpt_lifecycle_failed | bool)
                and (_ua_apply_present | bool)
                and (not (_ua_reboot_post_present | bool))
              )
              else (
                'Update installation failed'
                if (_rpt_result == 'failed' and not (_rpt_unreachable | bool))
                else (
                  'Precheck blocked remediation'
                  if (
                    (_rpt_result == 'blocked')
                    and ((_rpt_precheck_status | default('')) in ['blocked', 'failed'])
                  )
                  else (
                    'Patch installation was not authorized'
                    if (_rpt_result == 'blocked')
                    else (
                      'Postcheck detected unhealthy services'
                      if (_rpt_result == 'degraded' and (_rpt_postcheck_unhealthy | bool))
                      else (
                        'Updates remain after installation'
                        if (_rpt_result == 'degraded' and (_rpt_remaining_positive | bool))
                        else (
                          'A reboot is pending and requires follow-up'
                          if (_rpt_result == 'degraded')
                          else (
                            'No applicable updates'
                            if (_rpt_result == 'already_compliant')
                            else (
                              'Updates installed successfully'
                              if (_rpt_result == 'success')
                              else (
                                'Postcheck evidence is missing'
                                if (
                                  (_rpt_result == 'unknown')
                                  and (_rpt_patched | bool)
                                  and (not (_ua_postcheck_present | bool))
                                )
                                else 'Reliable execution outcome cannot be established'
                              )
                            )
                          )
                        )
                      )
                    )
                  )
                )
              )
            )
          )
        )
      }}
  changed_when: false
  tags:
    - report

- name: Build patch_final_result for this host
  ansible.builtin.set_fact:
    patch_final_result:
      schema_version: "3"
      report_generated_at_utc: "{{ patch_report_generated_at_utc }}"
      hostname: "{{ _rpt_hostname }}"
      fqdn: "{{ _rpt_fqdn }}"
      os_release: "{{ _rpt_os_release }}"
      os_build: "{{ _rpt_os_build }}"
      location: "{{ _rpt_location }}"
      host: "{{ inventory_hostname }}"
      inventory_hostname: "{{ inventory_hostname }}"
      change_ticket_id: "{{ change_ticket_id | default('') }}"
      aap_job_id: "{{ _rpt_aap_job_id }}"
      aap_limit: "{{ patch_target_scope | default(ansible_limit | default('')) }}"
      patch_target_scope: "{{ patch_target_scope | default(ansible_limit | default('')) }}"
      patch_wave: "{{ patch_wave_name | default('unspecified') }}"
      patch_wave_name: "{{ patch_wave_name | default('unspecified') }}"
      result: "{{ _rpt_result }}"
      reason: "{{ _rpt_reason }}"
      reason_code: "{{ _rpt_reason_code }}"
      final_status: "{{ _rpt_result }}"
      patched: "{{ _rpt_patched | bool }}"
      exempt: "{{ _rpt_exempt | bool }}"
      patching_exception_active: "{{ _rpt_exempt | bool }}"
      patching_exception_reference: "{{ patching_exception_reference_effective | default('') }}"
      patching_exception_source: "{{ patching_exception_source | default('inventory') }}"
      patching_reboot_allowed: "{{ patching_reboot_allowed | default(false) | bool }}"
      patch_provider: "{{ windows_patch_provider_effective | default('unknown') }}"
      windows_patch_provider_effective: "{{ windows_patch_provider_effective | default('unknown') }}"
      windows_wsus_configured: "{{ windows_wsus_configured | default(false) }}"
      windows_wsus_validation_status: "{{ 'not_available' if (_rpt_unreachable | bool) else (windows_wsus_validation_status | default('not_available')) }}"
      windows_wsus_server_effective: "{{ 'not_available' if (_rpt_unreachable | bool) else (windows_wsus_server_effective | default('not_available')) }}"
      windows_wsus_status_server_effective: "{{ 'not_available' if (_rpt_unreachable | bool) else (windows_wsus_status_server_effective | default('not_available')) }}"
      windows_wsus_use_server_effective: "{{ 'not_available' if (_rpt_unreachable | bool) else (windows_wsus_use_server_effective | default('not_available')) }}"
      os_policy_id: "{{ windows_os_policy.policy_id | default('not_available') }}"
      updates_found_final: "{{ _rpt_remaining if (_rpt_remaining_known | bool) else 'not_available' }}"
      updates_remaining: "{{ _rpt_remaining if (_rpt_remaining_known | bool) else 'not_available' }}"
      patch_attempted: "{{ _final_patch_attempted }}"
      updates_installed: "{{ _final_updates_installed }}"
      updates_failed: "{{ _final_updates_failed }}"
      pre_patch_reboot_required: "{{ _final_pre_reboot_required }}"
      pre_patch_reboot_performed: "{{ _final_pre_reboot_performed }}"
      post_patch_reboot_required: "{{ _final_post_reboot_required }}"
      post_patch_reboot_performed: "{{ _final_post_reboot_performed }}"
      pending_reboot: "{{ 'not_available' if ((_rpt_unreachable | bool) or ((windows_pending_reboot_probe_ok is defined) and (not (windows_pending_reboot_probe_ok | bool)))) else (pending_reboot if (pending_reboot is defined) else 'not_available') }}"
      pending_reboot_final: "{{ 'not_available' if ((_rpt_unreachable | bool) or ((windows_pending_reboot_probe_ok is defined) and (not (windows_pending_reboot_probe_ok | bool)))) else (pending_reboot if (pending_reboot is defined) else 'not_available') }}"
      postcheck_status: "{{ _final_postcheck_status }}"
      precheck_status: "{{ _rpt_precheck_status }}"
      manual_followup_required: "{{ (manual_followup_required | default(false) | bool) or (_rpt_unreachable | bool) }}"
      windows_connectivity_ok: "{{ windows_connectivity_ok | default(false) | bool }}"
      tower_job_id: "{{ tower_job_id | default('') }}"
      awx_job_id: "{{ awx_job_id | default('') }}"
      upstream_artifacts: "{{ _upstream_artifacts }}"
      upstream_artifact_status: "{{ _upstream_artifact_status }}"
  changed_when: false
  tags:
    - report

- name: Publish per-host patch_final_result artifact
  ansible.builtin.set_stats:
    data:
      patch_final_result: "{{ patch_final_result }}"
    per_host: true
  tags:
    - report
