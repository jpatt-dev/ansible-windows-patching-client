---
# Read and validate the effective WSUS client configuration already on the host.
# Does not write registry values, restart wuauserv, install updates, or reboot.

- name: Read current WSUS policy registry
  ansible.builtin.include_tasks: wsus_read.yml
  tags:
    - always
    - wsus

- name: Validate current WSUS registry
  ansible.builtin.include_tasks: wsus_validate.yml
  tags:
    - always
    - wsus

- name: Report discovered WSUS registry values
  ansible.builtin.debug:
    msg:
      - "host: {{ inventory_hostname }}"
      - "provider: {{ windows_patch_provider_effective }}"
      - "windows_wsus_configured: {{ windows_wsus_configured }}"
      - "windows_wsus_validation_status: {{ windows_wsus_validation_status }}"
      - "WUServer: {{ windows_wsus_server_effective | default('') }}"
      - "WUStatusServer: {{ windows_wsus_status_server_effective | default('') }}"
      - "UseWUServer: {{ windows_wsus_use_server_effective | default('') }}"
  changed_when: false
  tags:
    - always
    - wsus
    - report
