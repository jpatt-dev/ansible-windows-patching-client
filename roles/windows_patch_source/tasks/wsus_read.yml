---
# Read Windows Update policy registry (failed_when false so missing keys are missing, not fatal).

- name: Read Windows Update policy WUServer
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
    name: WUServer
  register: windows_wsus_reg_wuserver
  failed_when: false
  tags:
    - always
    - wsus

- name: Read Windows Update policy WUStatusServer
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate
    name: WUStatusServer
  register: windows_wsus_reg_wustatus
  failed_when: false
  tags:
    - always
    - wsus

- name: Read Windows Update AU UseWUServer
  ansible.windows.win_reg_stat:
    path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\WindowsUpdate\AU
    name: UseWUServer
  register: windows_wsus_reg_usewu
  failed_when: false
  tags:
    - always
    - wsus

- name: Record current WSUS registry facts
  ansible.builtin.set_fact:
    windows_wsus_current_server_url: "{{ windows_wsus_reg_wuserver.value | default('') }}"
    windows_wsus_current_status_server_url: "{{ windows_wsus_reg_wustatus.value | default('') }}"
    windows_wsus_current_use_wu_server: "{{ windows_wsus_reg_usewu.value | default('') }}"
  changed_when: false
  tags:
    - always
    - wsus
