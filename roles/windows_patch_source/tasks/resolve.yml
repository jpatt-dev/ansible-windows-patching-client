---
- name: Announce resolved patch provider (host-derived)
  ansible.builtin.debug:
    msg: >-
      windows_patch_provider_effective={{ windows_patch_provider_effective }}
      on {{ inventory_hostname }}
      (wsus_validation={{ windows_wsus_validation_status | default('missing') }};
      wsus_configured={{ windows_wsus_configured | default(false) }};
      WUServer={{ windows_wsus_server_effective | default('') }}).
      Provider unknown blocks remediation.
  tags:
    - always
    - source

- name: Set remediation blocked when effective provider is unknown
  ansible.builtin.set_fact:
    windows_provider_remediation_blocked: "{{ windows_patch_provider_effective == 'unknown' }}"
    windows_patch_source_status: >-
      {{
        'blocked'
        if (windows_patch_provider_effective == 'unknown')
        else 'resolved'
      }}
  changed_when: false
  tags:
    - always
    - source
