---
# windows_patch_source — read and validate the host's existing WSUS client config.
# This role does not assign WSUS servers or write registry values.
# Provider is derived from the host: valid WSUS registry → wsus; else unknown.
# Launch/survey windows_patch_provider is NOT authoritative.

windows_patch_provider: unknown
windows_patch_provider_effective: unknown
windows_patch_providers_allowed:
  - unknown
  - wsus

windows_wsus_configured: false
windows_wsus_validation_status: missing
windows_wsus_server_effective: ""
windows_wsus_status_server_effective: ""
windows_wsus_use_server_effective: ""

# Structurally valid WSUS URL: http(s) with a non-empty host.
windows_wsus_url_regex: '^https?://[^/\s]+'

windows_patch_source_phase: resolve
