---
# ServiceNow change integration.
# EXAMPLE URI tasks stay disabled until the shared ServiceNow role is published.
# Do not put the unpublished collection name or version here.
#
# Auth and instance URL come from AAP credentials / injected environment
# variables — never commit secrets or client-specific URLs to this repo.

# Optional work-notes/attach. Administrator Job Template extra-var, not a survey.
snow_enabled: false

# Production CR policy. Administrator Job Template extra-var / RBAC, not a survey.
# false = approved lab execution may remediate without ServiceNow.
# true  = eligible remediation fails closed unless the shared role confirms validation.
snow_require_change_validation: false

# Shared role FQCN is supplied by Controller/EE when published. Empty = not delivered.
snow_shared_role: ""

# Keep EXAMPLE ansible.builtin.uri integrations off until the shared role exists.
snow_example_integrations_enabled: false

# Display change number (CHG...) versus sys_id. Survey change_ticket_id is the
# display number. snow_change_id remains a legacy sys_id/number field.
snow_change_number: ""
snow_change_sys_id: ""

# Optional inventory host_var for approved CI scope (CMDB sys_id).
snow_ci_sys_id: ""

# Prefer env SNOW_INSTANCE_URL when empty (set by AAP Credential injection).
snow_instance_url: ""

# basic | bearer — credentials from env only (see role README).
snow_auth_type: basic

snow_change_id: ""
snow_change_task_id: ""

snow_validate_window: true
snow_update_work_notes: true
snow_attach_report: false
snow_fail_on_invalid_change: true
snow_close_task: false

# validate | work_notes | attach_report | close_task
snow_phase: validate

snow_work_note_message: ""

# Optional path on the execution node for attach_report (set by calling playbook).
snow_report_path: ""

# EXAMPLE table names — replace per client ServiceNow process.
snow_change_table: change_request
snow_task_table: change_task
