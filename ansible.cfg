[defaults]
# Safe-by-default Ansible configuration for the Windows patching automation.
# These settings work for both local CLI runs and as a baseline reference
# for AAP Controller execution environments.
#
# CUSTOMIZE for fleet runs: tune forks (parallelism) and use play-level serial
# (patch_serial) or AAP job slicing for large Windows estates.
#
# Do not set a default inventory path here. Pass -i on the CLI, or rely on
# the AAP Job Template Inventory field in production.

roles_path = roles
# Collections come from the Job Template Execution Environment
# (execution-environments/windows-patch-ee/), not a project collections/ path.
# Do not set collections_path here. Local collections/ is lint/dev only
# and must not be relied on for AAP delivery.
# Production / client environments should keep host key checking enabled
# (True) and manage known_hosts to protect against MITM.
host_key_checking = True
retry_files_enabled = False
stdout_callback = default
bin_ansible_callbacks = True
interpreter_python = auto_silent
forks = 10
timeout = 30
nocows = True

# Keep output readable when running reports from the CLI.
display_skipped_hosts = False
display_ok_hosts = True

[privilege_escalation]
# Escalation is available but never assumed. Windows playbooks use WinRM
# and typically do not rely on become for patch tasks.
become = False
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o PreferredAuthentications=publickey

[persistent_connection]
connect_timeout = 30
command_timeout = 30
