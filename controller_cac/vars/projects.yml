---
# Application Project only. SCM credential is referenced by name.

controller_projects:
  - name: "{{ controller_project_name }}"
    organization: "{{ controller_organization }}"
    scm_type: git
    scm_url: "{{ controller_project_scm_url }}"
    scm_branch: "{{ controller_project_scm_branch }}"
    scm_clean: false
    scm_delete_on_update: false
    scm_update_on_launch: true
    scm_update_cache_timeout: 0
    credential: "{{ controller_scm_credential_name }}"
    timeout: 0
    allow_override: false
