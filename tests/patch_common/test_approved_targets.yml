---
# Allowlist and Limit-to-wave tests. Does not contact Windows hosts.
#   ANSIBLE_ROLES_PATH=roles ansible-playbook tests/patch_common/test_approved_targets.yml

- name: Approved wave 1 is an exact allowlist match
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    patch_target_scope: windows_wave_1
    patch_allow_unapproved_target: false
    patch_emergency_acknowledgement: ""
  tasks:
    - name: Include approved-target validation
      ansible.builtin.include_role:
        name: patch_common
        tasks_from: validate_approved_target.yml

    - name: Map Limit to patch_wave_name
      ansible.builtin.include_role:
        name: patch_common
        tasks_from: set_wave_name.yml

    - name: Assert wave 1 is allowed and names the report wave
      ansible.builtin.assert:
        that:
          - patch_wave_name == 'windows_wave_1'
        fail_msg: windows_wave_1 must be an exact approved Limit and report wave name.

- name: Approved wave 20 is an exact allowlist match
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    patch_target_scope: windows_wave_20
    patch_allow_unapproved_target: false
    patch_emergency_acknowledgement: ""
  tasks:
    - name: Include approved-target validation
      ansible.builtin.include_role:
        name: patch_common
        tasks_from: validate_approved_target.yml

    - name: Map Limit to patch_wave_name
      ansible.builtin.include_role:
        name: patch_common
        tasks_from: set_wave_name.yml

    - name: Assert wave 20 is allowed and names the report wave
      ansible.builtin.assert:
        that:
          - patch_wave_name == 'windows_wave_20'
        fail_msg: windows_wave_20 must be an exact approved Limit and report wave name.

- name: Retired canary Limit is rejected
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    patch_target_scope: windows_canary
    patch_allow_unapproved_target: false
    patch_emergency_acknowledgement: ""
  tasks:
    - name: Expect windows_canary to fail
      block:
        - name: Include approved-target validation for windows_canary
          ansible.builtin.include_role:
            name: patch_common
            tasks_from: validate_approved_target.yml

        - name: Fail if windows_canary was accepted
          ansible.builtin.fail:
            msg: windows_canary must not match the allowlist.
      rescue:
        - name: Record that windows_canary was rejected
          ansible.builtin.set_fact:
            _canary_rejected: true

    - name: Assert windows_canary is not an approved wave
      ansible.builtin.assert:
        that:
          - _canary_rejected | default(false) | bool
        fail_msg: windows_canary must fail as an approved remediation target.

