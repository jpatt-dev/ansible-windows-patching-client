    - name: Assert exact-match rejection
      ansible.builtin.assert:
        that:
          - _wave_21_rejected | default(false) | bool
        fail_msg: Unapproved Limit must fail without wildcard matching.

- name: windows_hosts is not an approved remediation Limit
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    patch_target_scope: windows_hosts
    patch_allow_unapproved_target: false
    patch_emergency_acknowledgement: ""
  tasks:
    - name: Expect windows_hosts Limit to fail
      block:
        - name: Include approved-target validation for windows_hosts
          ansible.builtin.include_role:
            name: patch_common
            tasks_from: validate_approved_target.yml

        - name: Fail if windows_hosts was accepted
          ansible.builtin.fail:
            msg: windows_hosts must not be an approved wave.
      rescue:
        - name: Record that windows_hosts was rejected
          ansible.builtin.set_fact:
            _hosts_boundary_rejected: true

    - name: Assert playbook boundary is not a wave
      ansible.builtin.assert:
        that:
          - _hosts_boundary_rejected | default(false) | bool
        fail_msg: windows_hosts must remain outside approved_patch_targets.

- name: Dual emergency override is extra-var only
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    patch_target_scope: windows_wave_21
    patch_allow_unapproved_target: true
    patch_emergency_acknowledgement: "I understand this may patch unapproved hosts"
  tasks:
    - name: Include approved-target validation with both override extra-vars
      ansible.builtin.include_role:
        name: patch_common
        tasks_from: validate_approved_target.yml

    - name: Assert override required both extra-vars
      ansible.builtin.assert:
        that:
          - patch_emergency_override_ok | bool
        fail_msg: Emergency override must require both extra-vars.

- name: Wave name from Limit reaches final reporting
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    patch_target_scope: windows_wave_7
    change_ticket_id: CHG001
    patch_host_eligible: true
    windows_connectivity_ok: true
    pending_reboot: false
    windows_update_search:
      found_update_count: 0
  tasks:
    - name: Map Limit to patch_wave_name
      ansible.builtin.include_role:
        name: patch_common
        tasks_from: set_wave_name.yml

    - name: Build per-host final result
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_build.yml

    - name: Assert report wave equals Limit
      ansible.builtin.assert:
        that:
          - patch_wave_name == 'windows_wave_7'
          - patch_final_result.patch_wave_name == 'windows_wave_7'
          - patch_final_result.patch_wave == 'windows_wave_7'
        fail_msg: Final report did not receive patch_wave_name from the Limit.

- name: Change preparation uses the same approved wave list
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load the patch allowlist
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/patch_common/defaults/main.yml"

    - name: Load Change Request preparation
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../playbooks/servicenow/prepare_patch_change.yml"
      register: _prepare_slurp

    - name: Read the preparation wave list
      ansible.builtin.set_fact:
        _prepare_play: "{{ (_prepare_slurp.content | b64decode | from_yaml)[0] }}"
        _prepare_waves: "{{ (_prepare_slurp.content | b64decode | from_yaml)[0].vars.snow_prepare_supported_waves }}"

    - name: Assert preparation and patching allow the same waves
      ansible.builtin.assert:
        that:
          - _prepare_play.hosts == 'windows_hosts'
          - _prepare_play.connection == 'local'
          - not (_prepare_play.gather_facts | bool)
          - _prepare_play.vars.snow_prepare_preview_only | bool
          - not (_prepare_play.vars.snow_prepare_allow_create | bool)
          - "'patch_wave_name' not in _prepare_play.vars"
          - _prepare_play.tasks[0]['ansible.builtin.include_tasks'] == 'tasks/prepare_patch_change.yml'
          - _prepare_play.tasks[0].run_once | bool
          - _prepare_waves == approved_patch_targets
          - "'windows_wave_1' in _prepare_waves"
          - "'windows_wave_20' in _prepare_waves"
          - "'windows_canary' not in _prepare_waves"
          - "'windows_wave_0' not in _prepare_waves"
          - "'windows_wave_21' not in _prepare_waves"
          - "(_prepare_waves | length) == 20"
          - "'all' not in approved_patch_targets"
          - "'*' not in approved_patch_targets"
          - "'windows_hosts' not in approved_patch_targets"
        fail_msg: Change preparation and approved_patch_targets must both be windows_wave_1 through windows_wave_20.
