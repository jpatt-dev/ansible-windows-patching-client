- name: Unapproved wave 21 is rejected
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    patch_target_scope: windows_wave_21
    patch_allow_unapproved_target: false
    patch_emergency_acknowledgement: ""
  tasks:
    - name: Expect unapproved Limit to fail
      block:
        - name: Include approved-target validation for wave 21
          ansible.builtin.include_role:
            name: patch_common
            tasks_from: validate_approved_target.yml

        - name: Fail if wave 21 was accepted
          ansible.builtin.fail:
            msg: windows_wave_21 must not match the allowlist.
      rescue:
        - name: Record that wave 21 was rejected
          ansible.builtin.set_fact:
