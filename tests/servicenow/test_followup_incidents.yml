---
# Follow-up incident selection and CI mapping. Does not call ServiceNow.
#   ansible-playbook tests/servicenow/test_followup_incidents.yml

- name: Incident creation stays disabled and out of the survey
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_patching_tasks_dir: "{{ playbook_dir }}/../../playbooks/windows/tasks"
  tasks:
    - name: Load Full Patch and the survey
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../../playbooks/windows/full_patch.yml"
        - "{{ playbook_dir }}/../../surveys/windows_patch_workflow_survey.yml"
      register: _snow_followup_slurps

    - name: Assert the playbook default, placement, and survey exclusion
      ansible.builtin.assert:
        that:
          - "'snow_patching_create_incidents_enabled: false' in (_snow_followup_slurps.results[0].content | b64decode)"
          - "'Create follow-up incidents for hosts that need manual follow-up' in (_snow_followup_slurps.results[0].content | b64decode)"
          - "'servicenow_incident' in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_incident_one.yml'))"
          - "'snow_incident_operation: create' in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_incident_one.yml'))"
          - "'snow_incident_allow_create: true' in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_incident_one.yml'))"
          - "'snow_patching_import_set_create_enabled' in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_incidents.yml'))"
          - "'default(false)' in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_incidents.yml'))"
          - "'u_caller' in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_incident_one.yml'))"
          - "'u_short_description' in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_incident_one.yml'))"
          - "'u_description' in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_incident_one.yml'))"
          - "'snow_incident_correlation_id:' in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_incident_one.yml'))"
          - "'snow_followup_candidate.correlation_id' in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_incident_one.yml'))"
          - "'snow_followup_import_correlation_display' in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_incident_one.yml'))"
          - "'snow_incident_import_correlation_display' not in (_snow_followup_slurps.results[1].content | b64decode)"
          - "'snow_patching_import_set_create_enabled' not in (_snow_followup_slurps.results[1].content | b64decode)"
          - "'snow_patching_create_incidents_enabled' not in (_snow_followup_slurps.results[1].content | b64decode)"
          - "'snow_incident_caller' not in (_snow_followup_slurps.results[1].content | b64decode)"
          - "'Publish follow-up incident results' not in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_incidents.yml'))"
          - "'aggregate: false' in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_apply_report.yml'))"
          - "'inventory_hostname' in (lookup('file', snow_patching_tasks_dir ~ '/snow_followup_incident_one.yml'))"
        fail_msg: Follow-up incidents must stay disabled, unsurveyed, and after reporting.

    - name: Include incident handling while it is disabled
      ansible.builtin.include_tasks: "{{ snow_patching_tasks_dir }}/snow_followup_incidents.yml"

    - name: Assert a disabled run does not build incident results
      ansible.builtin.assert:
        that:
          - snow_patching_incident_results is not defined
          - not (snow_patching_incident_failed | default(false) | bool)
        fail_msg: Disabled incident creation must not record results or a failure.

- name: Register hosts for CI sys_id mapping
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add hosts that cover the reporting paths
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: mock_ci_map
        ansible_connection: local
        patch_host_eligible: "{{ item.eligible }}"
        windows_connectivity_ok: "{{ item.connected }}"
        pending_reboot: "{{ item.pending | default(false) }}"
        manual_followup_required: "{{ item.follow | default(false) }}"
        patching_exception_active: "{{ item.exempt | default(false) }}"
        sys_id: "{{ item.sys_id | default('') }}"
        snow_ci_sys_id: stale-ci-variable
        expected_result: "{{ item.expected_result }}"
        windows_update_search:
          found_update_count: "{{ item.remaining | default(0) }}"
        patch_phase_apply: "{{ item.apply | default({}) }}"
        patch_phase_postcheck: "{{ item.postcheck | default({}) }}"
      loop:
        - name: ci-success
          eligible: true
          connected: true
          sys_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          remaining: 0
          apply:
            ci-success:
              patch_attempted: true
              updates_installed: 1
              updates_failed: 0
              patch_status: success
          postcheck:
            ci-success:
              postcheck_status: passed
          expected_result: success
        - name: ci-degraded
          eligible: true
          connected: true
          pending: true
          follow: true
          sys_id: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          remaining: 0
          postcheck:
            ci-degraded:
              postcheck_status: passed
          expected_result: degraded
        - name: ci-failed
          eligible: true
          connected: true
          follow: true
          sys_id: cccccccccccccccccccccccccccccccc
          remaining: 2
          apply:
            ci-failed:
              patch_attempted: true
              updates_installed: 0
              updates_failed: 2
              patch_status: failed
          expected_result: failed
        - name: ci-unreachable
          eligible: false
          connected: false
          sys_id: dddddddddddddddddddddddddddddddd
          expected_result: failed
        - name: ci-exempt
          eligible: false
          connected: true
          exempt: true
          follow: true
          pending: true
          sys_id: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          expected_result: exempt
        - name: ci-incomplete
          eligible: false
          connected: true
          sys_id: ffffffffffffffffffffffffffffffff
          expected_result: unknown
        - name: ci-missing
          eligible: true
          connected: true
          sys_id: ""
          remaining: 0
          apply:
            ci-missing:
              patch_attempted: true
              updates_installed: 1
              updates_failed: 0
              patch_status: success
          postcheck:
            ci-missing:
              postcheck_status: passed
          expected_result: success
        - name: ci-invalid
          eligible: true
          connected: true
          sys_id: not-a-sys-id
          remaining: 0
          apply:
            ci-invalid:
              patch_attempted: true
              updates_installed: 1
              updates_failed: 0
              patch_status: success
          postcheck:
            ci-invalid:
              postcheck_status: passed
          expected_result: success

- name: Map inventory sys_id into snow_ci_sys_id without changing the patch result
  hosts: mock_ci_map
  connection: local
  gather_facts: false
  vars:
    change_ticket_id: CHG001
    patch_wave_name: wave_1
  tasks:
    - name: Build the final result
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_build.yml

    - name: Assert CI mapping and the original result
      ansible.builtin.assert:
        that:
          - patch_final_result.snow_ci_sys_id == (sys_id | string | trim)
          - patch_final_result.snow_ci_sys_id != 'stale-ci-variable'
          - patch_final_result.result == expected_result
        fail_msg: "{{ inventory_hostname }} did not map sys_id or its patch result changed."

- name: Register a host whose final result was never built
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add a reported host and a missing host
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups: mock_ci_missing_result
        ansible_connection: local
        sys_id: "{{ item.sys_id }}"
        snow_ci_sys_id: stale-ci-variable
        patch_final_result: "{{ item.final | default(omit) }}"
      loop:
        - name: ci-present
          sys_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          final:
            inventory_hostname: ci-present
            hostname: ci-present
            result: success
            patched: true
            exempt: false
            reason_code: PATCH_SUCCEEDED
            reason: Updates installed successfully
            manual_followup_required: false
            snow_ci_sys_id: stale-ci-variable
            updates_installed: 1
            updates_remaining: 0
            updates_failed: 0
            patch_attempted: true
            pre_patch_reboot_performed: false
            post_patch_reboot_performed: false
            pending_reboot: false
            patching_exception_reference: ""
            change_ticket_id: CHG001
            patch_wave: wave_1
        - name: ci-absent
          sys_id: abcdefabcdefabcdefabcdefabcdefab

- name: Incomplete reporting still copies inventory sys_id
  hosts: mock_ci_missing_result
  connection: local
  gather_facts: false
  vars:
    change_ticket_id: CHG001
    patch_wave_name: wave_1
  tasks:
    - name: Aggregate including the host that has no final result
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_aggregate.yml
      run_once: true

    - name: Assert the synthesized host uses inventory sys_id
      ansible.builtin.assert:
        that:
          - >-
            {{
              (patch_workflow_report.hosts
               | selectattr('inventory_hostname', 'equalto', 'ci-absent')
               | map(attribute='snow_ci_sys_id') | first)
              == 'abcdefabcdefabcdefabcdefabcdefab'
            }}
          - >-
            {{
              (patch_workflow_report.hosts
               | selectattr('inventory_hostname', 'equalto', 'ci-absent')
               | map(attribute='result') | first)
              == 'unknown'
            }}
        fail_msg: A host missing its final result did not keep its inventory CI sys_id.
      run_once: true

- name: Select follow-up candidates without calling ServiceNow
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_patching_tasks_dir: "{{ playbook_dir }}/../../playbooks/windows/tasks"
    change_ticket_id: CHG0090001
    patch_workflow_report:
      hosts:
        - hostname: WIN-OK
          inventory_hostname: win-ok
          result: success
          exempt: false
          reason_code: PATCH_SUCCEEDED
          reason: Updates installed successfully
          manual_followup_required: false
          snow_ci_sys_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          change_ticket_id: CHG0090001
          aap_job_id: "100"
        - hostname: WIN-DEGRADED-QUIET
          inventory_hostname: win-degraded-quiet
          result: degraded
          exempt: false
          reason_code: PENDING_REBOOT
          reason: A reboot is pending and requires follow-up
          manual_followup_required: false
          snow_ci_sys_id: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
          change_ticket_id: CHG0090001
          aap_job_id: "100"
        - hostname: WIN-EXEMPT
          inventory_hostname: win-exempt
          result: exempt
          exempt: true
          reason_code: PATCH_EXEMPTION
          reason: Approved exemption
          manual_followup_required: true
          snow_ci_sys_id: cccccccccccccccccccccccccccccccc
          change_ticket_id: CHG0090001
          aap_job_id: "100"
        - hostname: WIN-ONE
          inventory_hostname: win-one
          result: failed
          exempt: false
          reason_code: PATCH_INSTALL_FAILED
          reason: Update installation failed
          manual_followup_required: true
          snow_ci_sys_id: dddddddddddddddddddddddddddddddd
          change_ticket_id: CHG0090001
          aap_job_id: "100"
        - hostname: WIN-TWO
          inventory_hostname: win-two
          result: degraded
          exempt: false
          reason_code: PENDING_REBOOT
          reason: A reboot is pending and requires follow-up
          manual_followup_required: true
          snow_ci_sys_id: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          change_ticket_id: CHG0090001
          aap_job_id: "200"
        - hostname: WIN-MISSING
          inventory_hostname: win-missing
          result: failed
          exempt: false
          reason_code: UNREACHABLE
          reason: Host unreachable
          manual_followup_required: true
          snow_ci_sys_id: ""
          change_ticket_id: CHG0090001
          aap_job_id: "100"
        - hostname: WIN-INVALID
          inventory_hostname: win-invalid
          result: failed
          exempt: false
          reason_code: PATCH_INSTALL_FAILED
          reason: Update installation failed
          manual_followup_required: true
          snow_ci_sys_id: not-a-sys-id
          change_ticket_id: CHG0090001
          aap_job_id: "100"
  tasks:
    - name: Build the candidate list
      ansible.builtin.include_tasks: "{{ snow_patching_tasks_dir }}/snow_followup_candidates.yml"

    - name: Assert who is selected and how the correlation id is built
      ansible.builtin.assert:
        that:
          - snow_patching_incident_candidates | map(attribute='hostname') | list == ['WIN-ONE', 'WIN-TWO', 'WIN-MISSING', 'WIN-INVALID']
          - "(snow_patching_incident_candidates | selectattr('hostname', 'equalto', 'WIN-ONE') | first).action == 'create'"
          - >-
            {{
              (snow_patching_incident_candidates
               | selectattr('hostname', 'equalto', 'WIN-ONE')
               | first).correlation_id
              == 'aap-patch:CHG0090001:WIN-ONE:PATCH_INSTALL_FAILED'
            }}
          - >-
            {{
              (snow_patching_incident_candidates
               | selectattr('hostname', 'equalto', 'WIN-TWO')
               | first).correlation_id
              == 'aap-patch:CHG0090001:WIN-TWO:PENDING_REBOOT'
            }}
          - "(snow_patching_incident_candidates | selectattr('hostname', 'equalto', 'WIN-ONE') | first).correlation_id is not search('100')"
          - "(snow_patching_incident_candidates | selectattr('hostname', 'equalto', 'WIN-TWO') | first).correlation_id is not search('200')"
          - "(snow_patching_incident_candidates | selectattr('hostname', 'equalto', 'WIN-MISSING') | first).action == 'reject'"
          - "'missing' in (snow_patching_incident_candidates | selectattr('hostname', 'equalto', 'WIN-MISSING') | first).reject_reason"
          - "(snow_patching_incident_candidates | selectattr('hostname', 'equalto', 'WIN-INVALID') | first).action == 'reject'"
          - "'32-character' in (snow_patching_incident_candidates | selectattr('hostname', 'equalto', 'WIN-INVALID') | first).reject_reason"
        fail_msg: Follow-up candidate selection or correlation id did not match the report.

- name: No follow-up hosts produces an empty incident list
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_patching_tasks_dir: "{{ playbook_dir }}/../../playbooks/windows/tasks"
    snow_patching_create_incidents_enabled: true
    patch_workflow_marker: original-report
    patch_workflow_report:
      hosts:
        - hostname: WIN-OK
          result: success
          exempt: false
          reason_code: PATCH_SUCCEEDED
          reason: Updates installed successfully
          manual_followup_required: false
          snow_ci_sys_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          change_ticket_id: CHG0090001
  tasks:
    - name: Run incident handling with nobody to follow up
      ansible.builtin.include_tasks: "{{ snow_patching_tasks_dir }}/snow_followup_incidents.yml"

    - name: Assert the report is unchanged and no incident failed
      ansible.builtin.assert:
        that:
          - snow_patching_incident_candidates | length == 0
          - snow_patching_incident_results | length == 0
          - not (snow_patching_incident_failed | bool)
          - patch_workflow_marker == 'original-report'
          - (patch_workflow_report.hosts | first).result == 'success'
        fail_msg: An empty follow-up list changed the patch report or failed the integration.

- name: Missing configuration fails before any incident call
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_patching_tasks_dir: "{{ playbook_dir }}/../../playbooks/windows/tasks"
    snow_patching_create_incidents_enabled: true
    patch_workflow_marker: original-report
    patch_workflow_report:
      hosts:
        - hostname: WIN-ONE
          result: failed
          exempt: false
          reason_code: PATCH_INSTALL_FAILED
          reason: Update installation failed
          manual_followup_required: true
          snow_ci_sys_id: dddddddddddddddddddddddddddddddd
          change_ticket_id: CHG0090001
  tasks:
    - name: Run incident handling without caller, group, or priority
      ansible.builtin.include_tasks: "{{ snow_patching_tasks_dir }}/snow_followup_incidents.yml"

    - name: Assert configuration failure is separate from the patch result
      ansible.builtin.assert:
        that:
          - snow_patching_incident_failed | bool
          - snow_patching_incident_results | length == 0
          - "'snow_incident_caller' in snow_patching_incident_error"
          - patch_workflow_marker == 'original-report'
          - (patch_workflow_report.hosts | first).result == 'failed'
        fail_msg: Missing incident configuration did not fail closed or it changed the patch result.

- name: Invalid CI values are recorded and a role failure does not stop the next host
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_patching_tasks_dir: "{{ playbook_dir }}/../../playbooks/windows/tasks"
    snow_patching_create_incidents_enabled: true
    snow_incident_caller: patch.automation
    patch_workflow_marker: original-report
    patch_workflow_report:
      hosts:
        - hostname: WIN-MISSING
          result: failed
          exempt: false
          reason_code: UNREACHABLE
          reason: Host unreachable
          manual_followup_required: true
          snow_ci_sys_id: ""
          change_ticket_id: CHG0090001
          aap_job_id: "100"
        - hostname: WIN-CALL
          result: failed
          exempt: false
          reason_code: PATCH_INSTALL_FAILED
          reason: Update installation failed
          manual_followup_required: true
          snow_ci_sys_id: dddddddddddddddddddddddddddddddd
          change_ticket_id: CHG0090001
          aap_job_id: "100"
        - hostname: WIN-CALL-TWO
          result: degraded
          exempt: false
          reason_code: PENDING_REBOOT
          reason: A reboot is pending and requires follow-up
          manual_followup_required: true
          snow_ci_sys_id: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          change_ticket_id: CHG0090001
          aap_job_id: "100"
        - hostname: WIN-INVALID
          result: failed
          exempt: false
          reason_code: PATCH_INSTALL_FAILED
          reason: Update installation failed
          manual_followup_required: true
          snow_ci_sys_id: not-a-sys-id
          change_ticket_id: CHG0090001
          aap_job_id: "100"
  tasks:
    - name: Run incident handling without ServiceNow credentials
      ansible.builtin.include_tasks: "{{ snow_patching_tasks_dir }}/snow_followup_incidents.yml"

    - name: Assert every candidate was recorded and the patch report survived
      ansible.builtin.assert:
        that:
          - snow_patching_incident_results | map(attribute='hostname') | list == ['WIN-MISSING', 'WIN-CALL', 'WIN-CALL-TWO', 'WIN-INVALID']
          - snow_patching_incident_results | map(attribute='success') | map('bool') | select | list | length == 0
          - snow_patching_incident_failed | bool
          - "(snow_patching_incident_results | selectattr('hostname', 'equalto', 'WIN-MISSING') | first).incident_number == ''"
          - "'missing' in (snow_patching_incident_results | selectattr('hostname', 'equalto', 'WIN-MISSING') | first).message"
          - "'32-character' in (snow_patching_incident_results | selectattr('hostname', 'equalto', 'WIN-INVALID') | first).message"
          - (snow_patching_incident_results | selectattr('hostname', 'equalto', 'WIN-CALL') | first).message | length > 0
          - (snow_patching_incident_results | selectattr('hostname', 'equalto', 'WIN-CALL-TWO') | first).message | length > 0
          - "'assignment_group' not in (snow_patching_incident_results | selectattr('hostname', 'equalto', 'WIN-CALL') | first).message"
          - "'password' not in (snow_patching_incident_results | selectattr('hostname', 'equalto', 'WIN-CALL') | first).message | lower"
          - patch_workflow_marker == 'original-report'
          - (patch_workflow_report.hosts | length) == 4
        fail_msg: Incident failures were not recorded per host, or the patch report changed.

- name: Successful and failed incident rows accumulate for their hostnames
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_patching_tasks_dir: "{{ playbook_dir }}/../../playbooks/windows/tasks"
    patch_workflow_marker: original-report
  tasks:
    - name: Start an empty result list
      ansible.builtin.set_fact:
        snow_patching_incident_results: []

    - name: Store a created incident
      ansible.builtin.include_tasks: "{{ snow_patching_tasks_dir }}/snow_followup_store_result.yml"
      vars:
        snow_followup_result_row:
          hostname: WIN-ONE
          ci_sys_id: dddddddddddddddddddddddddddddddd
          change_ticket_id: CHG0090001
          reason_code: PATCH_INSTALL_FAILED
          correlation_id: aap-patch:CHG0090001:WIN-ONE:PATCH_INSTALL_FAILED
          incident_number: INC0001001
          reused: false
          success: true
          message: Created incident INC0001001

    - name: Store a reused incident
      ansible.builtin.include_tasks: "{{ snow_patching_tasks_dir }}/snow_followup_store_result.yml"
      vars:
        snow_followup_result_row:
          hostname: WIN-TWO
          ci_sys_id: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
          change_ticket_id: CHG0090001
          reason_code: PENDING_REBOOT
          correlation_id: aap-patch:CHG0090001:WIN-TWO:PENDING_REBOOT
          incident_number: INC0001002
          reused: true
          success: true
          message: Reused incident INC0001002

    - name: Store a failed incident
      ansible.builtin.include_tasks: "{{ snow_patching_tasks_dir }}/snow_followup_store_result.yml"
      vars:
        snow_followup_result_row:
          hostname: WIN-THREE
          ci_sys_id: ""
          change_ticket_id: CHG0090001
          reason_code: UNREACHABLE
          correlation_id: aap-patch:CHG0090001:WIN-THREE:UNREACHABLE
          incident_number: ""
          reused: false
          success: false
          message: Inventory sys_id is missing

    - name: Assert created, reused, and failed rows stay attached to their hosts
      ansible.builtin.assert:
        that:
          - snow_patching_incident_results | length == 3
          - (snow_patching_incident_results[0].hostname == 'WIN-ONE')
          - (snow_patching_incident_results[0].incident_number == 'INC0001001')
          - not (snow_patching_incident_results[0].reused | bool)
          - snow_patching_incident_results[0].success | bool
          - (snow_patching_incident_results[1].incident_number == 'INC0001002')
          - snow_patching_incident_results[1].reused | bool
          - not (snow_patching_incident_results[2].success | bool)
          - snow_patching_incident_results[2].incident_number == ''
          - patch_workflow_marker == 'original-report'
        fail_msg: Incident result rows were overwritten or dropped.

- name: Import set follow-up stays off without the extra opt-in
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_patching_tasks_dir: "{{ playbook_dir }}/../../playbooks/windows/tasks"
    snow_patching_create_incidents_enabled: true
    snow_incident_create_method: import_set
    snow_incident_caller: patch.automation
    snow_incident_assignment_group: 0123456789abcdef0123456789abcdef
    snow_incident_import_api_path: api/now/import/PLACEHOLDER_STAGING_TABLE
    snow_incident_import_correlation_display: Ansible
    patch_workflow_marker: original-report
    patch_workflow_report:
      hosts:
        - hostname: WIN-ONE
          result: failed
          exempt: false
          reason_code: PATCH_INSTALL_FAILED
          reason: Update installation failed
          manual_followup_required: true
          snow_ci_sys_id: dddddddddddddddddddddddddddddddd
          change_ticket_id: CHG0090001
          aap_job_id: "100"
  tasks:
    - name: Run import set handling without the non-idempotent opt-in
      ansible.builtin.include_tasks: "{{ snow_patching_tasks_dir }}/snow_followup_incidents.yml"

    - name: Assert the import set was refused before a role call
      ansible.builtin.assert:
        that:
          - snow_patching_incident_failed | bool
          - snow_patching_incident_results | length == 0
          - "'snow_patching_import_set_create_enabled' in snow_patching_incident_error"
          - "'not idempotent' in snow_patching_incident_error"
          - "'No incident was created' in snow_patching_incident_error"
          - patch_workflow_marker == 'original-report'
        fail_msg: Import set creation ran without the extra opt-in.

- name: Import set follow-up refuses an unconfigured correlation mapping
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_patching_tasks_dir: "{{ playbook_dir }}/../../playbooks/windows/tasks"
    snow_patching_create_incidents_enabled: true
    snow_patching_import_set_create_enabled: true
    snow_incident_create_method: import_set
    snow_incident_caller: patch.automation
    snow_incident_assignment_group: 0123456789abcdef0123456789abcdef
    snow_incident_import_api_path: api/now/import/PLACEHOLDER_STAGING_TABLE
    patch_workflow_marker: original-report
    patch_workflow_report:
      hosts:
        - hostname: WIN-ONE
          result: failed
          exempt: false
          reason_code: PATCH_INSTALL_FAILED
          reason: Update installation failed
          manual_followup_required: true
          snow_ci_sys_id: dddddddddddddddddddddddddddddddd
          change_ticket_id: CHG0090001
          aap_job_id: "100"
  tasks:
    - name: Run import set handling without the correlation mapping
      ansible.builtin.include_tasks: "{{ snow_patching_tasks_dir }}/snow_followup_incidents.yml"

    - name: Assert the correlation value was not sent
      ansible.builtin.assert:
        that:
          - snow_patching_incident_failed | bool
          - snow_patching_incident_results | length == 0
          - "'snow_incident_import_correlation_display' in snow_patching_incident_error"
          - "'Ansible' in snow_patching_incident_error"
          - "'aap-patch' in snow_patching_incident_error"
          - "'No incident was created' in snow_patching_incident_error"
          - patch_workflow_marker == 'original-report'
        fail_msg: Import set creation continued without an explicit correlation mapping.

- name: Incident results are stamped without changing the patch result
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_patching_tasks_dir: "{{ playbook_dir }}/../../playbooks/windows/tasks"
    snow_patching_create_incidents_enabled: true
    snow_patching_incident_results:
      - hostname: WIN-CREATED
        ci_sys_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        incident_number: INC0001001
        reused: false
        success: true
      - hostname: WIN-REUSED
        ci_sys_id: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        incident_number: INC0001002
        reused: true
        success: true
      - hostname: WIN-FAILED
        ci_sys_id: cccccccccccccccccccccccccccccccc
        incident_number: INC0001999
        reused: false
        success: false
      - hostname: WIN-BLANK
        ci_sys_id: dddddddddddddddddddddddddddddddd
        incident_number: ""
        reused: false
        success: true
    patch_workflow_report:
      status_counts:
        failed: 2
      hosts:
        - hostname: WIN-CREATED
          result: failed
          reason: Update installation failed
          reason_code: PATCH_INSTALL_FAILED
          manual_followup_required: true
          snow_ci_sys_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        - hostname: WIN-REUSED
          result: degraded
          reason: A reboot is pending
          reason_code: PENDING_REBOOT
          manual_followup_required: true
          snow_ci_sys_id: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        - hostname: WIN-FAILED
          result: failed
          reason: Host unreachable
          reason_code: UNREACHABLE
          manual_followup_required: true
          snow_ci_sys_id: cccccccccccccccccccccccccccccccc
        - hostname: WIN-BLANK
          result: failed
          reason: Update installation failed
          reason_code: PATCH_INSTALL_FAILED
          manual_followup_required: true
          snow_ci_sys_id: dddddddddddddddddddddddddddddddd
        - hostname: WIN-OK
          result: success
          reason: Updates installed successfully
          reason_code: PATCH_SUCCEEDED
          manual_followup_required: false
          snow_ci_sys_id: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
        - hostname: WIN-MISSED
          result: failed
          reason: Update installation failed
          reason_code: PATCH_INSTALL_FAILED
          manual_followup_required: true
          snow_ci_sys_id: ffffffffffffffffffffffffffffffff
  tasks:
    - name: Replace incident facts left by earlier plays
      ansible.builtin.set_fact:
        snow_patching_create_incidents_enabled: true
        snow_patching_incident_results: "{{ incident_stamp_results }}"
        patch_workflow_report: "{{ incident_stamp_report }}"
      vars:
        incident_stamp_results:
          - hostname: WIN-CREATED
            inventory_hostname: win-created.example
            ci_sys_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            incident_number: INC0001001
            reused: false
            success: true
          - hostname: WIN-REUSED
            inventory_hostname: win-reused.example
            ci_sys_id: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            incident_number: INC0001002
            reused: true
            success: true
          - hostname: WIN-FAILED
            inventory_hostname: win-failed.example
            ci_sys_id: cccccccccccccccccccccccccccccccc
            incident_number: INC0001999
            reused: false
            success: false
          - hostname: WIN-BLANK
            inventory_hostname: win-blank.example
            ci_sys_id: dddddddddddddddddddddddddddddddd
            incident_number: ""
            reused: false
            success: true
          - hostname: WIN-SAME
            inventory_hostname: win-a.example
            ci_sys_id: "11111111111111111111111111111111"
            incident_number: INC0002001
            reused: false
            success: true
          - hostname: WIN-SAME
            inventory_hostname: win-b.example
            ci_sys_id: "22222222222222222222222222222222"
            incident_number: INC0002002
            reused: false
            success: true
        incident_stamp_report:
          status_counts:
            failed: 2
          hosts:
            - hostname: WIN-CREATED
              inventory_hostname: win-created.example
              result: failed
              reason: Update installation failed
              reason_code: PATCH_INSTALL_FAILED
              manual_followup_required: true
              snow_ci_sys_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
            - hostname: WIN-REUSED
              inventory_hostname: win-reused.example
              result: degraded
              reason: A reboot is pending
              reason_code: PENDING_REBOOT
              manual_followup_required: true
              snow_ci_sys_id: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
            - hostname: WIN-FAILED
              inventory_hostname: win-failed.example
              result: failed
              reason: Host unreachable
              reason_code: UNREACHABLE
              manual_followup_required: true
              snow_ci_sys_id: cccccccccccccccccccccccccccccccc
            - hostname: WIN-BLANK
              inventory_hostname: win-blank.example
              result: failed
              reason: Update installation failed
              reason_code: PATCH_INSTALL_FAILED
              manual_followup_required: true
              snow_ci_sys_id: dddddddddddddddddddddddddddddddd
            - hostname: WIN-OK
              inventory_hostname: win-ok.example
              result: success
              reason: Updates installed successfully
              reason_code: PATCH_SUCCEEDED
              manual_followup_required: false
              snow_ci_sys_id: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
            - hostname: WIN-MISSED
              inventory_hostname: win-missed.example
              result: failed
              reason: Update installation failed
              reason_code: PATCH_INSTALL_FAILED
              manual_followup_required: true
              snow_ci_sys_id: ffffffffffffffffffffffffffffffff
            - hostname: WIN-EXEMPT
              inventory_hostname: win-exempt.example
              result: failed
              reason: Exempt from patching
              reason_code: EXEMPT
              exempt: true
              manual_followup_required: true
              snow_ci_sys_id: abababababababababababababababab
            - hostname: WIN-EXEMPT-RESULT
              inventory_hostname: win-exempt-result.example
              result: exempt
              reason: Exempt from patching
              reason_code: EXEMPT
              exempt: false
              manual_followup_required: true
              snow_ci_sys_id: cdcdcdcdcdcdcdcdcdcdcdcdcdcdcdcd
            - hostname: WIN-SAME
              inventory_hostname: win-a.example
              result: failed
              reason: Update installation failed
              reason_code: PATCH_INSTALL_FAILED
              manual_followup_required: true
              snow_ci_sys_id: a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1
            - hostname: WIN-SAME
              inventory_hostname: win-b.example
              result: failed
              reason: Update installation failed
              reason_code: PATCH_INSTALL_FAILED
              manual_followup_required: true
              snow_ci_sys_id: b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2

    - name: Stamp the report from incident results
      ansible.builtin.include_tasks: "{{ snow_patching_tasks_dir }}/snow_followup_apply_report.yml"

    - name: Assert incident status and the original patch fields
      ansible.builtin.assert:
        that:
          - (patch_workflow_report.hosts | selectattr('hostname', 'equalto', 'WIN-CREATED') | first).incident_status == 'created'
          - (patch_workflow_report.hosts | selectattr('hostname', 'equalto', 'WIN-CREATED') | first).incident_number == 'INC0001001'
          - (patch_workflow_report.hosts | selectattr('hostname', 'equalto', 'WIN-CREATED') | first).result == 'failed'
          - (patch_workflow_report.hosts | selectattr('hostname', 'equalto', 'WIN-CREATED') | first).reason == 'Update installation failed'
          - (patch_workflow_report.hosts | selectattr('hostname', 'equalto', 'WIN-CREATED') | first).snow_ci_sys_id == 'aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa'
          - (patch_workflow_report.hosts | selectattr('hostname', 'equalto', 'WIN-REUSED') | first).incident_status == 'reused'
          - (patch_workflow_report.hosts | selectattr('hostname', 'equalto', 'WIN-REUSED') | first).incident_number == 'INC0001002'
          - (patch_workflow_report.hosts | selectattr('hostname', 'equalto', 'WIN-FAILED') | first).incident_status == 'failed'
          - (patch_workflow_report.hosts | selectattr('hostname', 'equalto', 'WIN-FAILED') | first).incident_number == ''
          - (patch_workflow_report.hosts | selectattr('hostname', 'equalto', 'WIN-BLANK') | first).incident_status == 'failed'
          - (patch_workflow_report.hosts | selectattr('hostname', 'equalto', 'WIN-BLANK') | first).incident_number == ''
          - (patch_workflow_report.hosts | selectattr('hostname', 'equalto', 'WIN-OK') | first).incident_status == 'not required'
          - (patch_workflow_report.hosts | selectattr('hostname', 'equalto', 'WIN-OK') | first).result == 'success'
          - (patch_workflow_report.hosts | selectattr('inventory_hostname', 'equalto', 'win-missed.example') | first).incident_status == 'failed'
          - (patch_workflow_report.hosts | selectattr('inventory_hostname', 'equalto', 'win-exempt.example') | first).incident_status == 'not required'
          - (patch_workflow_report.hosts | selectattr('inventory_hostname', 'equalto', 'win-exempt.example') | first).incident_number == ''
          - (patch_workflow_report.hosts | selectattr('inventory_hostname', 'equalto', 'win-exempt-result.example') | first).incident_status == 'not required'
          - (patch_workflow_report.hosts | selectattr('inventory_hostname', 'equalto', 'win-a.example') | first).incident_number == 'INC0002001'
          - (patch_workflow_report.hosts | selectattr('inventory_hostname', 'equalto', 'win-b.example') | first).incident_number == 'INC0002002'
          - >-
            (patch_workflow_report.hosts
            | selectattr('inventory_hostname', 'equalto', 'win-a.example')
            | first).snow_ci_sys_id
            == 'a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1a1'
          - >-
            (patch_workflow_report.hosts
            | selectattr('inventory_hostname', 'equalto', 'win-b.example')
            | first).snow_ci_sys_id
            == 'b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2b2'
          - patch_workflow_report.status_counts.failed == 2
          - (patch_workflow_report_json | from_json) is mapping
          - (patch_workflow_report_json | from_json).hosts | length == (patch_workflow_report.hosts | length)
          - snow_patching_incident_results | length == 6
          - "'INC0001001' in patch_workflow_report_json"
        fail_msg: Incident results were not applied to the report, or a patch field changed.
