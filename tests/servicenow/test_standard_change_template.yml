# Standard Change preparation uses the shared POST and does not open a
# Normal Change. No ServiceNow request is sent by this playbook.

- name: Reject a missing standard change template
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Request template creation without an identifier
      block:
        - name: Include the standard change task
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/servicenow/tasks/create_standard_change.yml"
          vars:
            snow_standard_change_from_preparation: true
            snow_standard_change_template_id: ""
      rescue:
        - name: Record the missing template failure
          ansible.builtin.set_fact:
            standard_change_failed: true
            standard_change_error: "{{ ansible_failed_result.msg | default('') }}"

    - name: Add a clean host for the standalone confirmation check
      ansible.builtin.add_host:
        name: std_template_host
        groups: std_template_host
        ansible_connection: local

    - name: Confirm missing template configuration does not call ServiceNow
      ansible.builtin.assert:
        that:
          - standard_change_failed | bool
          - "'snow_standard_change_template_id is empty' in standard_change_error"
          - "'No ServiceNow request' in standard_change_error"
          - "'was not used' in standard_change_error"
          - snow_standard_change_request is not defined
          - snow_standard_change_response is not defined
          - snow_result is not defined
        fail_msg: "Missing template id was not rejected. error={{ standard_change_error | default('') }}"

- name: Stop preparation when creation is not confirmed
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_instance_url: https://nonproduction.example.invalid
    snow_nonproduction_instance_url: https://nonproduction.example.invalid
    snow_standard_change_template_id: STD-APPROVED-TEMPLATE
    snow_confirm_create: false
    snow_change_payload: {}
    snow_prepare_change_fields:
      assignment_group: Windows Patching
      category: Software
      cmdb_ci: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
    patch_change_short_description: Windows patch wave
    patch_change_description: Apply approved updates
  tasks:
    - name: Clear the previous template result
      ansible.builtin.set_fact:
        standard_change_failed: false
        standard_change_error: ""
        snow_prepare_created_this_run: false

    - name: Include preparation creation with confirmation off
      block:
        - name: Include the standard change task
          ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/servicenow/tasks/create_standard_change.yml"
          vars:
            snow_standard_change_from_preparation: true
      rescue:
        - name: Record the unconfirmed preparation failure
          ansible.builtin.set_fact:
            standard_change_failed: true
            standard_change_error: "{{ ansible_failed_result.msg | default('') }}"

    - name: Confirm preparation does not POST when creation is not confirmed
      ansible.builtin.assert:
        that:
          - standard_change_failed | bool
          - snow_standard_change_preflight == 'not_confirmed'
          - "'No ServiceNow request was sent' in standard_change_error"
          - "'was not used' in standard_change_error"
          - snow_standard_change_response is not defined
          - snow_result is not defined
          - not (snow_prepare_created_this_run | default(false) | bool)
          - snow_change_payload | length == 0
          - "'short_description' not in snow_change_payload"
          - "'description' not in snow_change_payload"
          - "'cmdb_ci' not in snow_change_payload"
          - "'assignment_group' not in snow_change_payload"
          - "'type' not in snow_change_payload"
          - "'chg_model' not in snow_change_payload"
        fail_msg: "Unconfirmed preparation POSTed or built a Normal Change. error={{ standard_change_error | default('') }}"

- name: Standalone creation stays off when snow_confirm_create is false
  hosts: std_template_host
  connection: local
  gather_facts: false
  vars:
    snow_instance_url: https://nonproduction.example.invalid
    snow_nonproduction_instance_url: https://nonproduction.example.invalid
    snow_standard_change_template_id: STD-APPROVED-TEMPLATE
    snow_confirm_create: false
    snow_change_payload:
      short_description: offline
  tasks:
    - name: Include the standalone task with creation disabled
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/servicenow/tasks/create_standard_change.yml"

- name: Confirm the standalone task ended before POST
  hosts: std_template_host
  connection: local
  gather_facts: false
  tasks:
    - name: Read the preparation decision tasks
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../playbooks/servicenow/tasks/prepare_patch_change.yml"
      register: prepare_tasks_file

    - name: Confirm no POST and no Normal Change path
      ansible.builtin.assert:
        that:
          - snow_standard_change_preflight == 'not_confirmed'
          - snow_standard_change_response is not defined
          - snow_result is not defined
          - not (snow_prepare_created_this_run | default(false) | bool)
          - prepare_task_text is search('create_standard_change.yml')
          - prepare_task_text is not search('snow_operation: create')
          - >-
            (prepare_tasks | selectattr('name', 'equalto', 'Create the Standard Change') | list | first).when
            is contains('snow_prepare_standard_change | default(true) | bool')
          - >-
            (prepare_tasks | selectattr('name', 'equalto', 'Reject a normal change from preparation') | list | first).when
            is contains('not (snow_prepare_standard_change | default(true) | bool)')
        fail_msg: Standalone confirmation-off path called ServiceNow or left a Normal Change create.
      vars:
        prepare_task_text: "{{ prepare_tasks_file.content | b64decode }}"
        prepare_tasks: "{{ prepare_task_text | from_yaml }}"
