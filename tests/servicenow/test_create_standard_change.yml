- name: DEV diagnostics do not change a confirmed result
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    snow_dev_error_diagnostics: true
    snow_standard_change_instance: https://dev.example.invalid
    snow_standard_change_response:
      record:
        number: CHG0003001
        sys_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  tasks:
    - name: Ignore any diagnostic or response left by an earlier failure
      ansible.builtin.set_fact:
        snow_standard_change_diagnostic:
          show: false
          category: ""
          error_code: ""
          field: ""
        snow_standard_change_response:
          record:
            number: CHG0003001
            sys_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

    - name: Classify a successful record while diagnostics are enabled
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/servicenow/tasks/classify_standard_change_response.yml"

    - name: Confirm diagnostics did not change success
      ansible.builtin.assert:
        that:
          - snow_standard_change_summary.outcome == 'confirmed'
          - snow_standard_change_summary.change_number == 'CHG0003001'
          - snow_standard_change_summary.diagnostic_category == ''
        fail_msg: Diagnostic mode changed a confirmed Standard Change result.
