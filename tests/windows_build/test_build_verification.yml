---
# Local checks for Windows build verification. No WinRM, SMTP, or patching.
#   ansible-playbook tests/windows_build/test_build_verification.yml
# Limit acceptance is tests/windows_build/test_build_verification_limit.yml
# and is executed with extra-var ansible_limit.

- name: Check the build verification playbook stays read-only
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read the build verification playbook
      ansible.builtin.set_fact:
        build_verify_playbook_text: >-
          {{
            lookup(
              'file',
              playbook_dir ~ '/../../playbooks/windows/build_verification.yml'
            )
          }}
      changed_when: false

    - name: Require Windows targeting, aggregation, and no remediation modules
      ansible.builtin.assert:
        that:
          - "build_verify_playbook_text | regex_findall('(?m)^  hosts: windows_hosts$') | length == 2"
          - "'connection: local' in build_verify_playbook_text"
          - "'ignore_unreachable: true' in build_verify_playbook_text"
          - "'win_updates' not in build_verify_playbook_text"
          - "'win_reboot' not in build_verify_playbook_text"
          - "'servicenow' not in build_verify_playbook_text"
          - "'roles/report_email' not in build_verify_playbook_text"
          - "'community.general.mail' not in build_verify_playbook_text"
        fail_msg: Build verification must target windows_hosts twice and must not patch or email from play 1.

- name: Register fictional Windows build queries
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    build_query_2016: >-
      {"Caption":"Microsoft Windows Server 2016 Standard",
      "Version":"10.0.14393","BuildNumber":"14393","UBR":7699,
      "UbrAvailable":true,"FullBuild":"14393.7699",
      "CSName":"WIN-2016","FQDN":"win-2016.lab.example.internal"}
    build_query_2019: >-
      {"Caption":"Microsoft Windows Server 2019 Standard",
      "Version":"10.0.17763","BuildNumber":"17763","UBR":6530,
      "UbrAvailable":true,"FullBuild":"17763.6530",
      "CSName":"WIN-2019","FQDN":"win-2019.lab.example.internal"}
    build_query_2022: >-
      {"Caption":"Microsoft Windows Server 2022 Datacenter, Core",
      "Version":"10.0.20348","BuildNumber":"20348","UBR":2849,
      "UbrAvailable":true,"FullBuild":"20348.2849",
      "CSName":"WIN-2022","FQDN":"win-2022.lab.example.internal"}
    build_query_2025: >-
      {"Caption":"Microsoft Windows Server 2025 Datacenter",
      "Version":"10.0.26100","BuildNumber":"26100","UBR":2033,
      "UbrAvailable":true,"FullBuild":"26100.2033",
      "CSName":"WIN-2025","FQDN":"win-2025.lab.example.internal"}
    build_query_no_ubr: >-
      {"Caption":"Microsoft Windows Server 2016 Datacenter",
      "Version":"10.0.14393","BuildNumber":"14393","UBR":null,
      "UbrAvailable":false,"FullBuild":"14393",
      "CSName":"WIN-NOUBR","FQDN":"win-noubr.lab.example.internal"}
  tasks:
    - name: Add a successful Windows Server 2016 host
      ansible.builtin.add_host:
        name: win-2016
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: Datacenter-East
        build_expected_status: success
        build_expected_build: "14393.7699"
        build_expected_os: Microsoft Windows Server 2016 Standard
        build_expected_location: Datacenter-East
        windows_build_query:
          failed: false
          unreachable: false
          rc: 0
          stdout: "{{ build_query_2016 }}"

    - name: Add a successful Windows Server 2019 host
      ansible.builtin.add_host:
        name: win-2019
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: Azure-East
        build_expected_status: success
        build_expected_build: "17763.6530"
        build_expected_os: Microsoft Windows Server 2019 Standard
        build_expected_location: Azure-East
        windows_build_query:
          failed: false
          unreachable: false
          rc: 0
          stdout: "{{ build_query_2019 }}"

    - name: Add a successful Windows Server 2022 host
      ansible.builtin.add_host:
        name: win-2022
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: "East \"1\""
        build_expected_status: success
        build_expected_build: "20348.2849"
        build_expected_os: "Microsoft Windows Server 2022 Datacenter, Core"
        build_expected_location: "East \"1\""
        windows_build_query:
          failed: false
          unreachable: false
          rc: 0
          stdout: "{{ build_query_2022 }}"

    - name: Add a successful Windows Server 2025 host
      ansible.builtin.add_host:
        name: win-2025
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: Datacenter-West
        build_expected_status: success
        build_expected_build: "26100.2033"
        build_expected_os: Microsoft Windows Server 2025 Datacenter
        build_expected_location: Datacenter-West
        windows_build_query:
          failed: false
          unreachable: false
          rc: 0
          stdout: "{{ build_query_2025 }}"

    - name: Add a host whose UBR revision is unavailable
      ansible.builtin.add_host:
        name: win-noubr
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: London
        build_expected_status: success
        build_expected_build: "14393 (revision unavailable)"
        build_expected_os: Microsoft Windows Server 2016 Datacenter
        build_expected_location: London
        windows_build_query:
          failed: false
          unreachable: false
          rc: 0
          stdout: "{{ build_query_no_ubr }}"

    - name: Add an unreachable host
      ansible.builtin.add_host:
        name: win-down
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: Datacenter-West
        build_expected_status: unreachable
        build_expected_build: not_available
        build_expected_os: not_available
        build_expected_location: Datacenter-West
        windows_build_query:
          unreachable: true
          msg: WinRM connection timed out

    - name: Add a host whose OS query failed
      ansible.builtin.add_host:
        name: win-osfail
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: Physical
        build_expected_status: failed
        build_expected_build: not_available
        build_expected_os: not_available
        build_expected_location: Physical
        windows_build_query:
          failed: true
          rc: 1
          stdout: ""
          msg: Get-CimInstance failed

    - name: Add a successful host with no inventory location
      ansible.builtin.add_host:
        name: win-noloc
        groups: build_verify_cases
        patch_environment: LAB
        build_expected_status: success
        build_expected_build: "17763.6530"
        build_expected_os: Microsoft Windows Server 2019 Standard
        build_expected_location: ""
        windows_build_query:
          failed: false
          unreachable: false
          rc: 0
          stdout: "{{ build_query_2019 | regex_replace('WIN-2019', 'WIN-NOLOC') | regex_replace('win-2019', 'win-noloc') }}"

- name: Convert fictional OS queries into build records
  hosts: build_verify_cases
  connection: local
  gather_facts: false
  tasks:
    - name: Include the production build record task
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/windows/tasks/build_verification_record.yml"

    - name: Assert the recorded build, status, OS, and location
      ansible.builtin.assert:
        that:
          - windows_build_record.collection_status == build_expected_status
          - windows_build_record.current_build == build_expected_build
          - windows_build_record.os_release == build_expected_os
          - windows_build_record.location == build_expected_location
          - windows_build_record.patched is not defined
          - windows_build_record.collection_status in ['success', 'failed', 'unreachable']
          - windows_build_record.collection_time_utc is match('^[0-9]{4}-')
        fail_msg: "{{ inventory_hostname }} build record did not match the fictional query."

- name: Aggregate the fictional build verification with email disabled
  hosts: build_verify_cases
  connection: local
  gather_facts: false
  vars:
    report_email_enabled: false
    build_verify_output_dir: /tmp/aap-build-verification-test
  tasks:
    - name: Include the production report task
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/windows/tasks/build_verification_report.yml"
      run_once: true

    - name: Assert totals, CSV, environment, and that email was not sent
      ansible.builtin.assert:
        that:
          - (windows_build_verification_report.total_systems | int) == 8
          - (windows_build_verification_report.systems_succeeded | int) == 6
          - (windows_build_verification_report.systems_failed | int) == 1
          - (windows_build_verification_report.systems_unreachable | int) == 1
          - windows_build_verification_report.patch_environment == 'LAB'
          - windows_build_verification_report.schema_version == '1'
          - windows_build_verification_report.report_source == 'windows_build_verification'
          - windows_build_verification_report.email_delivery == 'skipped'
          - windows_build_email_result is skipped
          - "'AAP Windows Build Verification | LAB |' in windows_build_email_subject"
          - "'Total systems targeted: 8' in windows_build_email_body"
          - "'Systems successfully queried: 6' in windows_build_email_body"
          - "'Systems failed or unreachable: 2' in windows_build_email_body"
          - "'No updates were installed' in windows_build_email_body"
          - windows_build_verification_csv is match('(?s)^\ufeff"Hostname","FQDN","OS Release"')
          - "'14393.7699' in windows_build_verification_csv"
          - "'17763.6530' in windows_build_verification_csv"
          - "'20348.2849' in windows_build_verification_csv"
          - "'26100.2033' in windows_build_verification_csv"
          - "'14393 (revision unavailable)' in windows_build_verification_csv"
          - ('"' ~ 'Microsoft Windows Server 2022 Datacenter, Core' ~ '"') in windows_build_verification_csv
          - ('East ' ~ '""1""') in windows_build_verification_csv
          - (windows_build_verification_csv.splitlines() | length) == 9
        fail_msg: Build verification CSV or totals did not match the fictional hosts.
      run_once: true

- name: Reject email when it is enabled without an SMTP host
  hosts: build_verify_cases
  connection: local
  gather_facts: false
  vars:
    report_email_enabled: true
    report_email_smtp_host: ""
    report_email_smtp_port: 25
    report_email_smtp_secure: "never"
    report_email_from: ""
    report_email_to: []
    report_email_attach_csv: true
    report_email_fail_on_error: true
    build_verify_email_expect_invalid: true
    build_verify_output_dir: /tmp/aap-build-verification-test
  tasks:
    - name: Include the production report task with email enabled
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/windows/tasks/build_verification_report.yml"
      run_once: true

    - name: Assert validation failed before community.general.mail
      ansible.builtin.assert:
        that:
          - windows_build_email_validation is failed
          - "'report_email_smtp_host' in (windows_build_email_validation.msg | default(''))"
          - windows_build_email_result is skipped
          - windows_build_verification_csv is defined
        fail_msg: Email-enabled build verification did not fail closed before sending mail.
      run_once: true

- name: Register two environments for the aggregate label
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add a LAB host
      ansible.builtin.add_host:
        name: env-lab
        groups: build_verify_environments
        windows_build_record:
          inventory_hostname: env-lab
          hostname: ENV-LAB
          fqdn: env-lab.lab.example.internal
          os_release: Microsoft Windows Server 2022 Datacenter
          os_version: "10.0.20348"
          current_build: "20348.2849"
          location: Datacenter-East
          patch_environment: LAB
          collection_status: success
          collection_time_utc: "2026-10-29T17:00:00Z"
          diagnostic: ""

    - name: Add an IST host
      ansible.builtin.add_host:
        name: env-ist
        groups: build_verify_environments
        windows_build_record:
          inventory_hostname: env-ist
          hostname: ENV-IST
          fqdn: env-ist.ist.example.internal
          os_release: Microsoft Windows Server 2019 Standard
          os_version: "10.0.17763"
          current_build: "17763.6530"
          location: London
          patch_environment: IST
          collection_status: success
          collection_time_utc: "2026-10-29T17:00:00Z"
          diagnostic: ""

- name: Label mixed inventory environments as inconsistent
  hosts: build_verify_environments
  connection: local
  gather_facts: false
  vars:
    report_email_enabled: false
    build_verify_output_dir: /tmp/aap-build-verification-test
  tasks:
    - name: Include the production report task
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/windows/tasks/build_verification_report.yml"
      run_once: true

    - name: Assert mixed environments are not collapsed to one hardcoded name
      ansible.builtin.assert:
        that:
          - windows_build_verification_report.patch_environment == 'inconsistent'
          - windows_build_verification_report.patch_environments == ['IST', 'LAB']
          - "'| inconsistent |' in windows_build_email_subject"
        fail_msg: Mixed patch_environment values must be reported as inconsistent.
      run_once: true
