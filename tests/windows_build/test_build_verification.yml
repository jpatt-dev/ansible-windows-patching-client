---
# Local checks for Windows build verification. No WinRM and no SMTP.
#   ansible-playbook tests/windows_build/test_build_verification.yml

- name: Check the build verification playbook stays read-only
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read the build verification files
      ansible.builtin.set_fact:
        build_verify_playbook_text: "{{ lookup('file', playbook_dir ~ '/../../playbooks/windows/build_verification.yml') }}"
        build_verify_report_text: "{{ lookup('file', playbook_dir ~ '/../../playbooks/build_verification/tasks/report.yml') }}"
        build_verify_email_text: "{{ lookup('file', playbook_dir ~ '/../../playbooks/build_verification/tasks/email.yml') }}"
        build_verify_record_text: "{{ lookup('file', playbook_dir ~ '/../../playbooks/windows/tasks/build_verification_record.yml') }}"
      changed_when: false

    - name: Require read-only collection, one-pass aggregation, and optional SMTP
      ansible.builtin.assert:
        that:
          - "build_verify_playbook_text | regex_findall('(?m)^  hosts: windows_hosts$') | length == 2"
          - "'connection: local' in build_verify_playbook_text"
          - "'ignore_unreachable: true' in build_verify_playbook_text"
          - "'timeout: 120' in build_verify_playbook_text"
          - "'ErrorActionPreference' in build_verify_playbook_text"
          - "'DNSHostName' in build_verify_playbook_text"
          - "'rescue:' in build_verify_playbook_text"
          - "'failed_when:' not in build_verify_playbook_text"
          - "'build_verification_limit.yml' not in build_verify_playbook_text"
          - "'win_updates' not in build_verify_playbook_text"
          - "'win_reboot' not in build_verify_playbook_text"
          - "'servicenow' not in build_verify_playbook_text"
          - "'build_verification/tasks/report.yml' in build_verify_playbook_text"
          - "'community.general' not in build_verify_playbook_text"
          - "'community.general' not in build_verify_report_text"
          - "\"'extract', hostvars\" in build_verify_report_text"
          - "'build_verification_hosts | default([]) +' not in build_verify_report_text"
          - "'schema_version: \"2\"' in build_verify_report_text"
          - "'community.general.mail' in build_verify_email_text"
          - "'is mapping' in build_verify_record_text"
        fail_msg: Build verification no longer matches the read-only reporting contract.

- name: Register fictional Windows build queries
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    build_query_2016: >-
      {"Caption":"Microsoft Windows Server 2016 Standard",
      "Version":"10.0.14393","BuildNumber":"14393","UBR":7699,
      "UbrAvailable":true,"FullBuild":"14393.7699",
      "DNSHostName":"WIN-2016-FULL","CSName":"WIN-2016",
      "FQDN":"win-2016.lab.example.internal"}
    build_query_2022: >-
      {"Caption":"Microsoft Windows Server 2022 Datacenter, Core",
      "Version":"10.0.20348","BuildNumber":"20348","UBR":2849,
      "UbrAvailable":true,"FullBuild":"20348.2849",
      "DNSHostName":"WIN-2022","CSName":"WIN-2022",
      "FQDN":"win-2022.lab.example.internal"}
    build_query_2025: >-
      {"Caption":"Microsoft Windows Server 2025 Datacenter",
      "Version":"10.0.26100","BuildNumber":"26100","UBR":2033,
      "UbrAvailable":true,"FullBuild":"26100.2033",
      "DNSHostName":"WIN-2025","CSName":"WIN-2025",
      "FQDN":"win-2025.lab.example.internal"}
    build_query_no_ubr: >-
      {"Caption":"Microsoft Windows Server 2016 Datacenter",
      "Version":"10.0.14393","BuildNumber":"14393","UBR":null,
      "UbrAvailable":false,"FullBuild":"14393",
      "DNSHostName":"WIN-NOUBR","CSName":"WIN-NOUBR",
      "FQDN":"win-noubr.lab.example.internal"}
    build_query_partial: >-
      {"Caption":"Microsoft Windows Server 2022 Datacenter",
      "Version":"10.0.20348","BuildNumber":"","UbrAvailable":false,
      "FullBuild":"","DNSHostName":"WIN-PARTIAL","CSName":"WIN-PARTIAL",
      "FQDN":"win-partial.lab.example.internal"}
    build_query_noloc: >-
      {"Caption":"Microsoft Windows Server 2019 Standard",
      "Version":"10.0.17763","BuildNumber":"17763","UBR":6530,
      "UbrAvailable":true,"FullBuild":"17763.6530",
      "DNSHostName":"WIN-NOLOC","CSName":"WIN-NOLOC",
      "FQDN":"win-noloc.lab.example.internal"}
  tasks:
    - name: Add a Windows Server 2016 host
      ansible.builtin.add_host:
        name: win-2016
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: São Paulo
        cmdb_fqdn: win-2016.cmdb.example
        cmdb_os_release: Windows Server 2016
        sys_id: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
        build_expected_status: success
        build_expected_build: "14393.7699"
        build_expected_version: "10.0.14393"
        build_expected_fqdn: win-2016.cmdb.example
        build_expected_os: Windows Server 2016
        build_expected_diagnostic: ""
        windows_build_query:
          failed: false
          unreachable: false
          rc: 0
          stdout: "{{ build_query_2016 }}"

    - name: Add a Windows Server 2019 host with an already decoded payload
      ansible.builtin.add_host:
        name: win-2019
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: Azure-East
        cmdb_fqdn: win-2019.cmdb.example
        cmdb_os_release: Windows Server 2019
        sys_id: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
        build_expected_status: success
        build_expected_build: "17763.6530"
        build_expected_version: "10.0.17763"
        build_expected_fqdn: win-2019.cmdb.example
        build_expected_os: Windows Server 2019
        build_expected_diagnostic: ""
        windows_build_query:
          failed: false
          unreachable: false
          rc: 0
          stdout:
            Caption: Microsoft Windows Server 2019 Standard
            Version: "10.0.17763"
            BuildNumber: "17763"
            UBR: 6530
            UbrAvailable: true
            FullBuild: "17763.6530"
            DNSHostName: WIN-2019
            CSName: WIN-2019
            FQDN: win-2019.lab.example.internal

    - name: Add a Windows Server 2022 host
      ansible.builtin.add_host:
        name: win-2022
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: "East \"1\""
        cmdb_fqdn: win-2022.cmdb.example
        cmdb_os_release: Windows Server 2022
        sys_id: cccccccccccccccccccccccccccccccc
        build_expected_status: success
        build_expected_build: "20348.2849"
        build_expected_version: "10.0.20348"
        build_expected_fqdn: win-2022.cmdb.example
        build_expected_os: Windows Server 2022
        build_expected_diagnostic: ""
        windows_build_query:
          failed: false
          unreachable: false
          rc: 0
          stdout: "{{ build_query_2022 }}"

    - name: Add a Windows Server 2025 host
      ansible.builtin.add_host:
        name: win-2025
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: "Datacenter, West"
        cmdb_fqdn: win-2025.cmdb.example
        cmdb_os_release: Windows Server 2025
        sys_id: dddddddddddddddddddddddddddddddd
        build_expected_status: success
        build_expected_build: "26100.2033"
        build_expected_version: "10.0.26100"
        build_expected_fqdn: win-2025.cmdb.example
        build_expected_os: Windows Server 2025
        build_expected_diagnostic: ""
        windows_build_query:
          failed: false
          unreachable: false
          rc: 0
          stdout: "{{ build_query_2025 }}"

    - name: Add a host whose UBR revision is unavailable
      ansible.builtin.add_host:
        name: win-noubr
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: London
        cmdb_fqdn: win-noubr.cmdb.example
        cmdb_os_release: Windows Server 2016
        sys_id: eeeeeeeeeeeeeeeeeeeeeeeeeeeeeeee
        build_expected_status: success
        build_expected_build: "14393 (revision unavailable)"
        build_expected_version: "10.0.14393"
        build_expected_fqdn: win-noubr.cmdb.example
        build_expected_os: Windows Server 2016
        build_expected_diagnostic: "revision unavailable."
        windows_build_query:
          failed: false
          unreachable: false
          rc: 0
          stdout: "{{ build_query_no_ubr }}"

    - name: Add an unreachable host
      ansible.builtin.add_host:
        name: win-down
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: Datacenter-West
        cmdb_fqdn: "  "
        cmdb_os_release: ""
        build_expected_status: unreachable
        build_expected_build: not_available
        build_expected_version: not_available
        build_expected_fqdn: not_available
        build_expected_os: not_available
        build_expected_diagnostic: "Host unreachable."
        windows_build_query:
          unreachable: true
          msg: WinRM connection timed out

    - name: Add a host whose CIM query failed
      ansible.builtin.add_host:
        name: win-osfail
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: Physical
        build_expected_status: failed
        build_expected_build: not_available
        build_expected_version: not_available
        build_expected_fqdn: not_available
        build_expected_os: not_available
        build_expected_diagnostic: "OS query failed."
        windows_build_query:
          failed: true
          rc: 1
          stdout: ""
          msg: Get-CimInstance failed

    - name: Add a host whose OS query timed out
      ansible.builtin.add_host:
        name: win-timeout
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: London
        build_expected_status: failed
        build_expected_build: not_available
        build_expected_version: not_available
        build_expected_fqdn: not_available
        build_expected_os: not_available
        build_expected_diagnostic: "WinRM query timed out."
        windows_build_query:
          failed: true
          rc: 1
          stdout: ""
          msg: The win_shell action timed out after 120 seconds

    - name: Add a host with incomplete OS data
      ansible.builtin.add_host:
        name: win-partial
        groups: build_verify_cases
        patch_environment: LAB
        patch_location: Datacenter-East
        cmdb_os_release: Windows Server 2022
        build_expected_status: failed
        build_expected_build: not_available
        build_expected_version: "10.0.20348"
        build_expected_fqdn: not_available
        build_expected_os: Windows Server 2022
        build_expected_diagnostic: "OS information incomplete."
        windows_build_query:
          failed: false
          unreachable: false
          rc: 0
          stdout: "{{ build_query_partial }}"

    - name: Add a successful host with no inventory location
      ansible.builtin.add_host:
        name: win-noloc
        groups: build_verify_cases
        patch_environment: LAB
        build_expected_status: success
        build_expected_build: "17763.6530"
        build_expected_version: "10.0.17763"
        build_expected_fqdn: not_available
        build_expected_os: not_available
        build_expected_diagnostic: >-
          Inventory FQDN was not available. Inventory OS release was not available.
          Inventory CI sys_id was not available.
        windows_build_query:
          failed: false
          unreachable: false
          rc: 0
          stdout: "{{ build_query_noloc }}"

- name: Convert fictional OS queries into build records
  hosts: build_verify_cases
  connection: local
  gather_facts: false
  tasks:
    - name: Include the production build record task
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/windows/tasks/build_verification_record.yml"

    - name: Assert the recorded build comes from inventory plus the live query
      ansible.builtin.assert:
        that:
          - build_verification_record.collection_status == build_expected_status
          - build_verification_record.current_build == build_expected_build
          - build_verification_record.os_version == build_expected_version
          - build_verification_record.hostname == inventory_hostname
          - build_verification_record.fqdn == build_expected_fqdn
          - build_verification_record.os_release == build_expected_os
          - "'Microsoft Windows' not in build_verification_record.os_release"
          - build_verification_record.platform == 'windows'
          - build_verification_record.current_build_kind == 'windows_build'
          - >-
            build_verification_record.snow_ci_sys_id == 'not_available'
            or build_verification_record.snow_ci_sys_id == (sys_id | default(''))
          - build_expected_diagnostic in build_verification_record.diagnostic
          - >-
            build_expected_status != 'success'
            or build_verification_record.diagnostic == build_expected_diagnostic
          - >-
            (sys_id | default('') | length == 0)
            or 'Inventory CI sys_id was not available.' not in build_verification_record.diagnostic
          - build_verification_record.patched is not defined
          - build_verification_record.collection_time_utc is match('^[0-9]{4}-')
        fail_msg: "{{ inventory_hostname }} build record did not match the fictional query."

    - name: Add one row whose fields could be Excel formulas
      ansible.builtin.add_host:
        name: win-formula
        groups: build_verify_cases
        build_verification_record:
          inventory_hostname: win-formula
          hostname: "=cmd|'/c calc'!A0"
          fqdn: +plus.example
          os_release: -minus
          os_version: "@at"
          current_build: "\r20348"
          location: "\tEast"
          patch_environment: LAB
          collection_status: success
          collection_time_utc: "2026-10-29T18:00:00Z"
          diagnostic: "=hidden"
      run_once: true

- name: Aggregate the fictional build verification with email disabled
  hosts: build_verify_cases
  connection: local
  gather_facts: false
  vars:
    report_email_enabled: false
    build_verify_output_dir: /tmp/aap-build-verification-test
    build_verify_email_tasks: "{{ playbook_dir }}/../../playbooks/build_verification/tasks/email.yml"
  tasks:
    - name: Include the production report task
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/build_verification/tasks/report.yml"
      run_once: true

    - name: Remember dangerous CSV fragments
      ansible.builtin.set_fact:
        build_formula_equals: "{{ \"'\" ~ \"=cmd|'/c calc'!A0\" }}"
        build_formula_plus: "'+plus.example"
        build_formula_minus: "'-minus"
        build_formula_at: "'@at"
        build_formula_cr: "' 20348"
        build_formula_tab: "{{ \"'\" ~ ('%c' | format(9)) ~ 'East' }}"
        build_formula_diag: "'=hidden"
      run_once: true
      changed_when: false

    - name: Assert totals, escaping, formulas, and that email was not loaded
      ansible.builtin.assert:
        that:
          - (build_verification_report.total_systems | int) == 11
          - (build_verification_report.systems_succeeded | int) == 7
          - (build_verification_report.systems_failed | int) == 3
          - (build_verification_report.systems_unreachable | int) == 1
          - build_verification_report.patch_environment == 'LAB'
          - build_verification_report.schema_version == '2'
          - build_verification_report.email_delivery == 'skipped'
          - "'windows_build_verification_report' in build_verify_published"
          - "'windows_build_verification_csv' in build_verify_published"
          - build_verification_email_result is not defined
          - "'AAP Windows Build Verification | LAB |' in build_verification_email_subject"
          - "'Current Build / Kernel is the Windows build number.' in build_verification_email_body"
          - "'Total systems targeted: 11' in build_verification_email_body"
          - "'Systems successfully queried: 7' in build_verification_email_body"
          - "'Systems failed or unreachable: 4' in build_verification_email_body"
          - >-
            build_verification_csv.startswith(
            ('%c' | format(65279)) ~ '"Hostname","FQDN","Platform","OS Release","OS Version","Current Build / Kernel"')
          - ('"' ~ 'Diagnostic' ~ '"') in build_verification_csv
          - ('"' ~ 'Environment' ~ '"') in build_verification_csv
          - "'14393.7699' in build_verification_csv"
          - "'17763.6530' in build_verification_csv"
          - "'20348.2849' in build_verification_csv"
          - "'26100.2033' in build_verification_csv"
          - "'14393 (revision unavailable)' in build_verification_csv"
          - "'São Paulo' in build_verification_csv"
          - "'win-2016.cmdb.example' in build_verification_csv"
          - "'Windows Server 2016' in build_verification_csv"
          - "'win-2016.lab.example.internal' not in build_verification_csv"
          - "'Microsoft Windows Server 2016 Standard' not in build_verification_csv"
          - "'Microsoft Windows Server 2022 Datacenter, Core' not in build_verification_csv"
          - ('"' ~ 'Datacenter, West' ~ '"') in build_verification_csv
          - ('East ""1""') in build_verification_csv
          - build_formula_equals in build_verification_csv
          - build_formula_plus in build_verification_csv
          - build_formula_minus in build_verification_csv
          - build_formula_at in build_verification_csv
          - build_formula_cr in build_verification_csv
          - build_formula_tab in build_verification_csv
          - build_formula_diag in build_verification_csv
          - (build_verification_csv.splitlines() | length) == 12
        fail_msg: Build verification CSV or totals did not match the fictional hosts.
      run_once: true

- name: Reject email when it is enabled without an SMTP host
  hosts: build_verify_cases
  connection: local
  gather_facts: false
  vars:
    report_email_enabled: true
    report_email_smtp_host: ""
    report_email_smtp_port: 25
    report_email_smtp_secure: "never"
    report_email_from: ""
    report_email_to: []
    report_email_attach_csv: true
    report_email_fail_on_error: true
    build_verify_email_expect_invalid: true
    build_verify_output_dir: /tmp/aap-build-verification-test
    build_verify_email_tasks: "{{ playbook_dir }}/../../playbooks/build_verification/tasks/email.yml"
  tasks:
    - name: Include the production report task with email enabled
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/build_verification/tasks/report.yml"
      run_once: true

    - name: Assert validation failed before community.general.mail
      ansible.builtin.assert:
        that:
          - build_verification_email_validation is failed
          - "'report_email_smtp_host' in (build_verification_email_validation.msg | default(''))"
          - build_verification_email_result is skipped
          - build_verification_csv is defined
        fail_msg: Email-enabled build verification did not fail closed before sending mail.
      run_once: true

- name: Register an all-failed collection
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add failed collection hosts
      ansible.builtin.add_host:
        name: "win-failed-{{ item }}"
        groups: build_verify_all_failed
        build_verification_record:
          inventory_hostname: "win-failed-{{ item }}"
          hostname: "win-failed-{{ item }}"
          fqdn: not_available
          os_release: not_available
          os_version: not_available
          current_build: not_available
          location: ""
          patch_environment: UAT
          collection_status: failed
          collection_time_utc: "2026-10-29T18:05:00Z"
          diagnostic: OS query failed.
      loop:
        - a
        - b
        - c

- name: Report a collection where every host failed
  hosts: build_verify_all_failed
  connection: local
  gather_facts: false
  vars:
    report_email_enabled: false
    build_verify_output_dir: /tmp/aap-build-verification-test
    build_verify_email_tasks: "{{ playbook_dir }}/../../playbooks/build_verification/tasks/email.yml"
  tasks:
    - name: Include the production report task
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/build_verification/tasks/report.yml"
      run_once: true

    - name: Assert the report still contains every failed host
      ansible.builtin.assert:
        that:
          - (build_verification_report.total_systems | int) == 3
          - (build_verification_report.systems_succeeded | int) == 0
          - (build_verification_report.systems_failed | int) == 3
          - (build_verification_csv.splitlines() | length) == 4
          - build_verification_report.patch_environment == 'UAT'
        fail_msg: A fully failed collection must still produce the CSV.
      run_once: true

- name: Register a host that produced no build record
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add a host without a collection record
      ansible.builtin.add_host:
        name: win-missing
        groups: build_verify_missing
        patch_environment: IST
        patch_location: London

- name: Synthesize a row when collection produced nothing
  hosts: build_verify_missing
  connection: local
  gather_facts: false
  vars:
    report_email_enabled: false
    build_verify_output_dir: /tmp/aap-build-verification-test
    build_verify_email_tasks: "{{ playbook_dir }}/../../playbooks/build_verification/tasks/email.yml"
  tasks:
    - name: Include the production report task
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/build_verification/tasks/report.yml"
      run_once: true

    - name: Assert the missing host is still in the report
      ansible.builtin.assert:
        that:
          - (build_verification_report.total_systems | int) == 1
          - (build_verification_report.systems_failed | int) == 1
          - "'Build record was not produced' in build_verification_csv"
        fail_msg: A host with no collection record must still appear in the CSV.
      run_once: true

- name: Register a large synthetic population
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add five hundred successful build records
      ansible.builtin.add_host:
        name: "win-scale-{{ '%03d' | format(item) }}"
        groups: build_verify_scale
        build_verification_record: "{{ scale_row }}"
      vars:
        scale_row:
          inventory_hostname: "win-scale-{{ '%03d' | format(item) }}"
          hostname: "WIN-SCALE-{{ '%03d' | format(item) }}"
          fqdn: "win-scale-{{ '%03d' | format(item) }}.lab.example.internal"
          os_release: Microsoft Windows Server 2022 Datacenter
          os_version: "10.0.20348"
          current_build: "20348.2849"
          location: Datacenter-East
          patch_environment: LAB
          collection_status: success
          collection_time_utc: "2026-10-29T18:10:00Z"
          diagnostic: ""
      loop: "{{ range(1, 501) | list }}"
      loop_control:
        label: "{{ item }}"

- name: Aggregate five hundred build records in one pass
  hosts: build_verify_scale
  connection: local
  gather_facts: false
  vars:
    report_email_enabled: false
    build_verify_output_dir: /tmp/aap-build-verification-test
    build_verify_email_tasks: "{{ playbook_dir }}/../../playbooks/build_verification/tasks/email.yml"
  tasks:
    - name: Include the production report task
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/build_verification/tasks/report.yml"
      run_once: true

    - name: Assert the large population reconciles
      ansible.builtin.assert:
        that:
          - (build_verification_report.total_systems | int) == 500
          - (build_verification_report.systems_succeeded | int) == 500
          - (build_verification_hosts | length) == 500
          - (build_verification_csv.splitlines() | length) == 501
          - "'20348.2849' in build_verification_csv"
        fail_msg: The 500-host build report did not reconcile.
      run_once: true
