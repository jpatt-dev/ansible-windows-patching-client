---
# Exemption tests. Does not contact Windows hosts or ServiceNow.
#   ANSIBLE_ROLES_PATH=roles ansible-playbook tests/patch_cycle_exception/test_exemptions.yml

- name: Register mock hosts for Git and AAP-group exemption membership
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add permanently patch-exempt Git inventory host
      ansible.builtin.add_host:
        name: win-perm-patch
        groups: mock_exempt_ok
        ansible_connection: local
        patching_exception_enabled: true
        patching_exception_reference: EXC-GIT-PATCH
        patching_reboot_allowed: true
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add permanently reboot-exempt Git inventory host
      ansible.builtin.add_host:
        name: win-perm-reboot
        groups: mock_exempt_ok
        ansible_connection: local
        patching_reboot_exception_enabled: true
        patching_reboot_exception_reference: EXC-GIT-REBOOT
        patching_reboot_allowed: true
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add temporary AAP patch-exemption host
      ansible.builtin.add_host:
        name: win-temp-patch
        groups:
          - mock_exempt_ok
          - windows_patch_exempt_temp
        ansible_connection: local
        patch_temp_reference: EXC-AAP-PATCH
        patch_temp_expires_at: "2099-01-01T00:00:00Z"
        patching_reboot_allowed: true
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add temporary AAP reboot-exemption host
      ansible.builtin.add_host:
        name: win-temp-reboot
        groups:
          - mock_exempt_ok
          - windows_reboot_exempt_temp
        ansible_connection: local
        reboot_temp_reference: EXC-AAP-REBOOT
        reboot_temp_expires_at: "2099-01-01T00:00:00Z"
        patching_reboot_allowed: true
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add host with both Git patch and Git reboot exemptions
      ansible.builtin.add_host:
        name: win-both-perm
        groups: mock_exempt_ok
        ansible_connection: local
        patching_exception_enabled: true
        patching_exception_reference: EXC-GIT-BOTH-PATCH
        patching_reboot_exception_enabled: true
        patching_reboot_exception_reference: EXC-GIT-BOTH-REBOOT
        patching_reboot_allowed: true
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add host with Git patch exemption and temporary AAP patch membership
      ansible.builtin.add_host:
        name: win-perm-and-temp
        groups:
          - mock_exempt_ok
          - windows_patch_exempt_temp
        ansible_connection: local
        patching_exception_enabled: true
        patching_exception_reference: EXC-GIT-WINS
        patch_temp_reference: EXC-AAP-IGNORED
        patch_temp_expires_at: "2099-01-01T00:00:00Z"
        patching_reboot_allowed: true
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add host with both temporary patch and reboot exemptions
      ansible.builtin.add_host:
        name: win-both-temp
        groups:
          - mock_exempt_ok
          - windows_patch_exempt_temp
          - windows_reboot_exempt_temp
        ansible_connection: local
        patch_temp_reference: EXC-AAP-BOTH-PATCH
        patch_temp_expires_at: "2099-01-01T00:00:00Z"
        reboot_temp_reference: EXC-AAP-BOTH-REBOOT
        reboot_temp_expires_at: "2099-01-01T00:00:00Z"
        patching_reboot_allowed: true
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add host with permanent Git reboot exemption and temporary AAP patch exemption
      ansible.builtin.add_host:
        name: win-git-reboot-aap-patch
        groups:
          - mock_exempt_ok
          - windows_patch_exempt_temp
        ansible_connection: local
        patching_reboot_exception_enabled: true
        patching_reboot_exception_reference: EXC-GIT-REBOOT-MIX
        patch_temp_reference: EXC-AAP-PATCH-MIX
        patch_temp_expires_at: "2099-06-15T12:00:00Z"
        patching_reboot_allowed: true
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add host with a valid future leap-day temporary patch exemption
      ansible.builtin.add_host:
        name: win-leap-active
        groups:
          - mock_exempt_ok
          - windows_patch_exempt_temp
        ansible_connection: local
        patch_temp_reference: EXC-AAP-LEAP
        patch_temp_expires_at: "2096-02-29T00:00:00Z"
        patching_reboot_allowed: true
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add host with no exemptions
      ansible.builtin.add_host:
        name: win-none
        groups: mock_exempt_ok
        ansible_connection: local
        patching_reboot_allowed: true
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add host with denied reboot permission and no exemption
      ansible.builtin.add_host:
        name: win-nreboot
        groups: mock_exempt_ok
        ansible_connection: local
        patching_reboot_allowed: false
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add expired temporary patch-exemption host
      ansible.builtin.add_host:
        name: win-expired
        groups:
          - mock_exempt_expired
          - windows_patch_exempt_temp
        ansible_connection: local
        patch_temp_reference: EXC-AAP-EXPIRED
        patch_temp_expires_at: "2020-01-01T00:00:00Z"
        patching_reboot_allowed: true
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add expired valid leap-day temporary patch-exemption host
      ansible.builtin.add_host:
        name: win-leap-expired
        groups:
          - mock_exempt_expired
          - windows_patch_exempt_temp
        ansible_connection: local
        patch_temp_reference: EXC-AAP-LEAP-EXPIRED
        patch_temp_expires_at: "2024-02-29T00:00:00Z"
        patching_reboot_allowed: true
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add invalid expiration temporary patch-exemption host
      ansible.builtin.add_host:
        name: win-bad-exp
        groups:
          - mock_exempt_invalid
          - windows_patch_exempt_temp
        ansible_connection: local
        patch_temp_reference: EXC-AAP-BAD-EXP
        patch_temp_expires_at: "not-a-timestamp"
        windows_connectivity_ok: true

    - name: Add missing-reference temporary patch-exemption host
      ansible.builtin.add_host:
        name: win-missref
        groups:
          - mock_exempt_missref
          - windows_patch_exempt_temp
        ansible_connection: local
        patch_temp_reference: ""
        patch_temp_expires_at: "2099-01-01T00:00:00Z"
        windows_connectivity_ok: true

    - name: Add non-member host with leftover exemption metadata
      ansible.builtin.add_host:
        name: win-nomember
        groups: mock_exempt_nomember
        ansible_connection: local
        patch_temp_reference: EXC-SHOULD-IGNORE
        patch_temp_expires_at: "not-a-timestamp"
        patching_reboot_allowed: true
        windows_connectivity_ok: true
        patch_host_eligible: true

    - name: Add hosts whose expiration matches ISO-8601 Z but is not a real UTC date
      ansible.builtin.add_host:
        name: "{{ item.name }}"
        groups:
          - mock_exempt_badcal
          - windows_patch_exempt_temp
        ansible_connection: local
        patch_temp_reference: "{{ item.reference }}"
        patch_temp_expires_at: "{{ item.expires }}"
        windows_connectivity_ok: true
      loop:
        - name: win-cal-feb30
          reference: EXC-AAP-FEB30
          expires: "2026-02-30T00:00:00Z"
        - name: win-cal-noleap
          reference: EXC-AAP-NOLEAP
          expires: "2026-02-29T00:00:00Z"
        - name: win-cal-apr31
          reference: EXC-AAP-APR31
          expires: "2026-04-31T00:00:00Z"
        - name: win-cal-hour24
          reference: EXC-AAP-HOUR24
          expires: "2026-01-01T24:00:00Z"
        - name: win-cal-2100
          reference: EXC-AAP-2100
          expires: "2100-02-29T00:00:00Z"

- name: Permanent, temporary, combined, and unlisted exemption resolution
  hosts: mock_exempt_ok
  connection: local
  gather_facts: false
  tasks:
    - name: Resolve exemptions
      ansible.builtin.include_role:
        name: patch_cycle_exception

    - name: Skip Apply for exempt hosts without calling win_updates
      ansible.builtin.include_role:
        name: windows_patch
        tasks_from: apply.yml
      when: "patching_exception_active | bool"

    - name: Derive reboot gate the same way reboot.yml does
      ansible.builtin.set_fact:
        windows_reboot_should_run: "{{ (not (patching_exception_active | default(false) | bool)) and true and true and (patching_reboot_allowed | default(false) | bool) and true }}"
      changed_when: false

    - name: Build final report for exempt hosts
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_build.yml
      when: "patching_exception_active | bool"

    - name: Assert permanent Git patch exemption
      ansible.builtin.assert:
        that:
          - "patching_exception_enabled | bool"
          - "patching_exception_active | bool"
          - "patching_exception_kind == 'patch'"
          - "patching_exception_status == 'active'"
          - "patching_exception_source == 'inventory'"
          - "patching_exception_reference == 'EXC-GIT-PATCH'"
          - "patching_exception_reference_effective == 'EXC-GIT-PATCH'"
          - "windows_apply_status == 'excluded'"
          - "not (patch_attempted | bool)"
          - "not (windows_reboot_should_run | bool)"
          - "patch_final_result.result == 'exempt'"
          - "patch_final_result.patching_exception_source == 'inventory'"
          - "patch_final_result.patching_exception_kind == 'patch'"
          - "'windows_patch_exempt_temp' not in (group_names | default([]))"
        fail_msg: Permanent Git patch exemption must skip install/reboot and keep the inventory reference.
      when: inventory_hostname == 'win-perm-patch'

    - name: Assert permanent Git reboot exemption
      ansible.builtin.assert:
        that:
          - "patching_reboot_exception_enabled | bool"
          - "patching_reboot_exception_active | bool"
          - "patching_exception_active | bool"
          - "patching_exception_kind == 'reboot'"
          - "patching_exception_status == 'active'"
          - "patching_exception_source == 'inventory'"
          - "patching_reboot_exception_reference_effective == 'EXC-GIT-REBOOT'"
          - "windows_apply_status == 'excluded'"
          - "not (patch_attempted | bool)"
          - "not (windows_reboot_should_run | bool)"
          - "patch_final_result.result == 'exempt'"
          - "patch_final_result.patching_reboot_exception_active | bool"
        fail_msg: Permanent Git reboot exemption must skip install and both reboot phases.
      when: inventory_hostname == 'win-perm-reboot'

    - name: Assert temporary AAP patch exemption
      ansible.builtin.assert:
        that:
          - "not (patching_exception_enabled | default(false) | bool)"
          - "patching_exception_active | bool"
          - "patching_exception_kind == 'patch'"
          - "patching_exception_status == 'active'"
          - "patching_exception_source == 'aap_group'"
          - "'windows_patch_exempt_temp' in group_names"
          - "patching_exception_reference == ''"
          - "patching_exception_reference_effective == 'EXC-AAP-PATCH'"
          - "patching_exception_expires_at == '2099-01-01T00:00:00Z'"
          - "windows_apply_status == 'excluded'"
          - "not (patch_attempted | bool)"
          - "not (windows_reboot_should_run | bool)"
          - "patch_final_result.result == 'exempt'"
          - "patch_final_result.patching_exception_source == 'aap_group'"
        fail_msg: Temporary AAP patch exemption must skip install/reboot and use group metadata.
      when: inventory_hostname == 'win-temp-patch'

    - name: Assert temporary AAP reboot exemption
      ansible.builtin.assert:
        that:
          - "patching_exception_active | bool"
          - "patching_reboot_exception_active | bool"
          - "patching_exception_kind == 'reboot'"
          - "patching_exception_source == 'aap_group'"
          - "'windows_reboot_exempt_temp' in group_names"
          - "patching_reboot_exception_reference_effective == 'EXC-AAP-REBOOT'"
          - "windows_apply_status == 'excluded'"
          - "not (windows_reboot_should_run | bool)"
          - "patch_final_result.result == 'exempt'"
        fail_msg: Temporary AAP reboot exemption must skip install and both reboot phases.
      when: inventory_hostname == 'win-temp-reboot'

    - name: Assert both Git exemption types stay independent
      ansible.builtin.assert:
        that:
          - "patching_exception_kind == 'patch_and_reboot'"
          - "patching_exception_source == 'inventory'"
          - "patching_exception_reference_effective == 'EXC-GIT-BOTH-PATCH'"
          - "patching_reboot_exception_reference_effective == 'EXC-GIT-BOTH-REBOOT'"
          - "windows_apply_status == 'excluded'"
          - "not (windows_reboot_should_run | bool)"
        fail_msg: Permanent patch and reboot exemptions must resolve independently.
      when: inventory_hostname == 'win-both-perm'

    - name: Assert Git permanent exemption is not overwritten by temporary AAP metadata
      ansible.builtin.assert:
        that:
          - "patching_exception_enabled | bool"
          - "patching_exception_active | bool"
          - "patching_exception_source == 'inventory'"
          - "patching_exception_reference == 'EXC-GIT-WINS'"
          - "patching_exception_reference_effective == 'EXC-GIT-WINS'"
          - "patching_exception_reference_effective != 'EXC-AAP-IGNORED'"
          - "windows_apply_status == 'excluded'"
        fail_msg: Temporary AAP metadata must not disable a Git exemption or overwrite its reference.
      when: inventory_hostname == 'win-perm-and-temp'

    - name: Assert both temporary exemption types
      ansible.builtin.assert:
        that:
          - "patching_exception_kind == 'patch_and_reboot'"
          - "patching_exception_source == 'aap_group'"
          - "patching_exception_reference_effective == 'EXC-AAP-BOTH-PATCH'"
          - "patching_reboot_exception_reference_effective == 'EXC-AAP-BOTH-REBOOT'"
          - "windows_apply_status == 'excluded'"
          - "not (windows_reboot_should_run | bool)"
        fail_msg: Active temporary patch and reboot exemptions must both skip remediation.
      when: inventory_hostname == 'win-both-temp'

    - name: Assert mixed Git reboot and AAP patch exemptions keep independent snapshot fields
      ansible.builtin.assert:
        that:
          - "patching_exception_active | bool"
          - "patching_exception_kind == 'patch_and_reboot'"
          - "patching_exception_status == 'active'"
          - "patching_exception_source == 'inventory'"
          - "patching_exception_reference_effective == 'EXC-AAP-PATCH-MIX'"
          - "patching_reboot_exception_reference_effective == 'EXC-GIT-REBOOT-MIX'"
          - "patching_exception_patch_source == 'aap_group'"
          - "patching_exception_patch_reference == 'EXC-AAP-PATCH-MIX'"
          - "patching_exception_patch_expires_at == '2099-06-15T12:00:00Z'"
          - "patching_reboot_exception_source == 'inventory'"
          - "patching_reboot_exception_expires_at == ''"
          - "patch_final_result.schema_version == '3'"
          - "patch_final_result.patching_exception_source == 'inventory'"
          - "patch_final_result.patching_exception_kind == 'patch_and_reboot'"
          - "patch_final_result.patching_exception_patch_source == 'aap_group'"
          - "patch_final_result.patching_exception_patch_reference == 'EXC-AAP-PATCH-MIX'"
          - "patch_final_result.patching_exception_patch_expires_at == '2099-06-15T12:00:00Z'"
          - "patch_final_result.patching_reboot_exception_source == 'inventory'"
          - "patch_final_result.patching_reboot_exception_reference == 'EXC-GIT-REBOOT-MIX'"
          - "patch_final_result.patching_reboot_exception_expires_at == ''"
          - "windows_apply_status == 'excluded'"
          - "not (windows_reboot_should_run | bool)"
        fail_msg: Mixed Git reboot and AAP patch exemptions must keep independent source, reference, and expiration.
      when: inventory_hostname == 'win-git-reboot-aap-patch'

    - name: Assert a valid future leap-day expiration remains active
      ansible.builtin.assert:
        that:
          - "patching_exception_active | bool"
          - "patching_exception_status == 'active'"
          - "patching_exception_kind == 'patch'"
          - "patching_exception_source == 'aap_group'"
          - "patching_exception_expires_at == '2096-02-29T00:00:00Z'"
          - "patching_exception_patch_source == 'aap_group'"
          - "patching_exception_patch_expires_at == '2096-02-29T00:00:00Z'"
          - "windows_apply_status == 'excluded'"
          - "patch_final_result.result == 'exempt'"
        fail_msg: A real UTC leap-day expiration in the future must remain an active temporary exemption.
      when: inventory_hostname == 'win-leap-active'

    - name: Assert unlisted host is not exempt and reboot remains eligible
      ansible.builtin.assert:
        that:
          - "not (patching_exception_enabled | default(false) | bool)"
          - "not (patching_exception_active | bool)"
          - "patching_exception_kind == 'none'"
          - "patching_exception_status == 'none'"
          - "patching_exception_source == 'inventory'"
          - "patching_reboot_allowed | bool"
          - "windows_reboot_should_run | bool"
          - "'windows_patch_exempt_temp' not in (group_names | default([]))"
        fail_msg: Hosts with no exemptions must remain eligible for the existing two-reboot cycle.
      when: inventory_hostname == 'win-none'

    - name: Assert denied reboot permission is not an exemption
      ansible.builtin.assert:
        that:
          - "not (patching_exception_active | bool)"
          - "not (patching_reboot_exception_active | bool)"
          - "patching_exception_kind == 'none'"
          - "not (patching_reboot_allowed | bool)"
          - "not (windows_reboot_should_run | bool)"
        fail_msg: patching_reboot_allowed=false must block reboot without granting exemption status.
      when: inventory_hostname == 'win-nreboot'

- name: Expired temporary exemption no longer grants exemption status
  hosts: mock_exempt_expired
  connection: local
  gather_facts: false
  tasks:
    - name: Resolve expired temporary membership
      ansible.builtin.include_role:
        name: patch_cycle_exception

    - name: Derive reboot gate after expired exemption
      ansible.builtin.set_fact:
        windows_reboot_should_run: "{{ (not (patching_exception_active | default(false) | bool)) and true and true and (patching_reboot_allowed | default(false) | bool) and true }}"
      changed_when: false

    - name: Build final report for expired membership
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_build.yml

    - name: Assert expired membership is stale and not exempt
      ansible.builtin.assert:
        that:
          - "'windows_patch_exempt_temp' in group_names"
          - "not (patching_exception_active | bool)"
          - "patching_exception_status == 'expired'"
          - "patching_exception_kind == 'patch'"
          - "patching_exception_source == 'inventory'"
          - "windows_reboot_should_run | bool"
          - "patch_final_result.result != 'exempt'"
          - "not (patch_final_result.exempt | bool)"
          - "patch_final_result.patching_exception_status == 'expired'"
          - "patching_exception_patch_source == 'aap_group'"
        fail_msg: A correctly expired temporary exemption must not skip patch or reboot.

    - name: Assert an expired leap-day timestamp is treated as expired, not invalid
      ansible.builtin.assert:
        that:
          - "patching_exception_status == 'expired'"
          - "not (patching_exception_active | bool)"
          - "patching_exception_patch_expires_at == '2024-02-29T00:00:00Z'"
          - "patch_final_result.result != 'exempt'"
        fail_msg: A real UTC leap-day expiration in the past must be expired, not rejected as invalid.
      when: inventory_hostname == 'win-leap-expired'

- name: Non-member metadata is ignored
  hosts: mock_exempt_nomember
  connection: local
  gather_facts: false
  tasks:
    - name: Resolve host that is not in a temporary exemption group
      ansible.builtin.include_role:
        name: patch_cycle_exception

    - name: Assert leftover metadata without group membership is ignored
      ansible.builtin.assert:
        that:
          - "not (patching_exception_active | bool)"
          - "patching_exception_status == 'none'"
          - "'windows_patch_exempt_temp' not in (group_names | default([]))"
        fail_msg: Temporary metadata must be ignored unless the host is in the AAP group.

- name: Survey fields, skip wiring, reboot modes, and wave allowlist
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load Full Patch survey
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../surveys/windows_patch_workflow_survey.yml"
      register: _full_survey_slurp

    - name: Load reboot tasks
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../roles/windows_patch/tasks/reboot.yml"
      register: _reboot_slurp

    - name: Load Apply tasks
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../roles/windows_patch/tasks/apply.yml"
      register: _apply_slurp

    - name: Load patch_common defaults
      ansible.builtin.include_vars:
        file: "{{ playbook_dir }}/../../roles/patch_common/defaults/main.yml"

    - name: Parse survey and task text
      ansible.builtin.set_fact:
        _full_survey_vars: "{{ (_full_survey_slurp.content | b64decode | from_yaml).spec | map(attribute='variable') | list }}"
        _reboot_text: "{{ _reboot_slurp.content | b64decode }}"
        _apply_text: "{{ _apply_slurp.content | b64decode }}"

    - name: Assert survey, skip wiring, reboot modes, and allowlist
      ansible.builtin.assert:
        that:
          - "'patch_temporary_exempt_hosts' not in _full_survey_vars"
          - "'patch_temporary_exemption_reference' not in _full_survey_vars"
          - "'operator_authorize_patch_install' in _full_survey_vars"
          - "'operator_allow_pre_patch_reboot' in _full_survey_vars"
          - "'operator_allow_post_patch_reboot' in _full_survey_vars"
          - "'change_ticket_id' in _full_survey_vars"
          - "'patching_exception_reference' not in _full_survey_vars"
          - "'not (patching_exception_active | default(false) | bool)' in _reboot_text"
          - "'when: windows_reboot_should_run | bool' in _reboot_text"
          - "'patch_cycle_exception' in _reboot_text"
          - "'windows_pre_patch_reboot_mode' in _reboot_text"
          - "'windows_post_patch_reboot_mode' in _reboot_text"
          - "'when: patching_exception_active | default(false) | bool' in _apply_text"
          - "'windows_apply_status: excluded' in _apply_text"
          - "'windows_canary' in approved_patch_targets"
          - "'windows_wave_1' in approved_patch_targets"
          - "'windows_wave_20' in approved_patch_targets"
          - "'windows_wave_21' not in approved_patch_targets"
          - "(approved_patch_targets | length) == 21"
        fail_msg: Survey must drop hostname exemptions; Apply/reboot skip and wave allowlist must stay unchanged.

- name: Invalid expiration still produces host and aggregate reports
  hosts: mock_exempt_invalid
  connection: local
  gather_facts: false
  vars:
    patch_require_explicit_limit: false
    patch_enforce_scoped_target: false
  tasks:
    - name: Resolve invalid expiration through patch_common lifecycle handling
      ansible.builtin.include_role:
        name: patch_common

    - name: Build per-host result after exemption validation failure
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_build.yml

    - name: Aggregate after invalid-expiration failure
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_aggregate.yml
      run_once: true

    - name: Assert invalid expiration fails closed and still reports
      ansible.builtin.assert:
        that:
          - "patch_lifecycle_failed | bool"
          - "not (patch_host_eligible | default(true) | bool)"
          - "not (patching_exception_active | default(false) | bool)"
          - "patching_exception_status == 'invalid'"
          - "patch_final_result.result == 'failed'"
          - "not (patch_final_result.patched | bool)"
          - "(patch_workflow_report.status_counts.failed | default(0) | int) == 1"
        fail_msg: Invalid temporary expiration must fail closed and still produce aggregate reporting.
      run_once: true

- name: Missing temporary reference still produces host and aggregate reports
  hosts: mock_exempt_missref
  connection: local
  gather_facts: false
  vars:
    patch_require_explicit_limit: false
    patch_enforce_scoped_target: false
  tasks:
    - name: Reset leftover exemption facts
      ansible.builtin.set_fact:
        patch_lifecycle_failed: false
        patching_exception_active: false
        patching_exception_status: none

    - name: Resolve missing reference through patch_common
      ansible.builtin.include_role:
        name: patch_common

    - name: Build per-host result after missing-reference failure
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_build.yml

    - name: Aggregate after missing-reference failure
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_aggregate.yml
      run_once: true

    - name: Assert missing reference fails closed and still reports
      ansible.builtin.assert:
        that:
          - "patch_lifecycle_failed | bool"
          - "not (patch_host_eligible | default(true) | bool)"
          - "patching_exception_status == 'invalid'"
          - "patch_final_result.result == 'failed'"
          - "not (patch_final_result.patched | bool)"
          - "(patch_workflow_report.status_counts.failed | default(0) | int) == 1"
        fail_msg: Missing temporary exemption reference must fail closed and still produce aggregate reporting.
      run_once: true

- name: Impossible calendar dates fail closed before remediation
  hosts: mock_exempt_badcal
  connection: local
  gather_facts: false
  vars:
    patch_require_explicit_limit: false
    patch_enforce_scoped_target: false
  tasks:
    - name: Reset leftover exemption facts before calendar validation
      ansible.builtin.set_fact:
        patch_lifecycle_failed: false
        patching_exception_active: false
        patching_exception_status: none

    - name: Resolve impossible calendar dates through patch_common
      ansible.builtin.include_role:
        name: patch_common

    - name: Build per-host result after calendar-date failure
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_build.yml

    - name: Aggregate after calendar-date failures
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_aggregate.yml
      run_once: true

    - name: Assert ISO-shaped impossible dates are invalid, not active or expired
      ansible.builtin.assert:
        that:
          - "patch_lifecycle_failed | bool"
          - "not (patch_host_eligible | default(true) | bool)"
          - "not (patching_exception_active | default(false) | bool)"
          - "patching_exception_status == 'invalid'"
          - "patch_final_result.result == 'failed'"
          - "not (patch_final_result.patched | bool)"
          - "patch_final_result.patching_exception_status == 'invalid'"
        fail_msg: Impossible UTC calendar dates must fail closed before remediation and still report.

    - name: Assert calendar-date failures remain in the aggregate report
      ansible.builtin.assert:
        that:
          - "(patch_workflow_report.status_counts.failed | default(0) | int) == 5"
        fail_msg: Impossible UTC calendar dates must still produce aggregate failed counts.
      run_once: true

