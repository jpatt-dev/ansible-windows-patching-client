---
# Offline operations CSV. Synthetic host results only.
# No Windows patching and no ServiceNow requests.

- name: Operations report with approved maintenance window
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    patch_final_report_timestamp: "2026-11-23T15-00-00"
    patch_report_output_dir: "{{ lookup('ansible.builtin.env', 'TEMP') | default('/tmp', true) }}/aap-operations-report-test"
    maintenance_window_start: "2026-11-23T01:00:00Z"
    maintenance_window_end: "2026-11-23T05:00:00Z"
    patch_workflow_report:
      report_generated_at_utc: "2026-11-23T15:05:00Z"
      hosts:
        - hostname: WIN-PATCHED
          patch_environment: prod
          os_version: "Windows Server 2022"
          os_build_pre: "20348.1000"
          os_build: "20348.2345"
          aap_job_id: "9001"
          patch_execution_started_at_utc: "2026-11-23T02:00:00Z"
          result: success
          updates_installed: 2
          updates_installed_kbs:
            - "5034123"
            - "5034124"
          patch_wave: wave_1
          patching_exception_status: none
          change_ticket_id: CHG0010001
          pre_patch_reboot_required: false
          pre_patch_reboot_performed: false
          post_patch_reboot_required: true
          post_patch_reboot_performed: true
          pending_reboot: false
          reason_code: PATCH_SUCCEEDED
        - hostname: WIN-COMPLIANT
          patch_environment: prod
          os_version: "Windows Server 2019"
          os_build_pre: "17763.1000"
          os_build: "17763.1000"
          aap_job_id: "9001"
          patch_execution_started_at_utc: "2026-11-23T02:00:00Z"
          result: already_compliant
          updates_installed: 0
          updates_installed_kbs: []
          patch_wave: wave_1
          patching_exception_status: none
          change_ticket_id: CHG0010001
          pre_patch_reboot_required: false
          pre_patch_reboot_performed: false
          post_patch_reboot_required: false
          post_patch_reboot_performed: false
          pending_reboot: false
          reason_code: NO_APPLICABLE_UPDATES
        - hostname: WIN-EXEMPT
          patch_environment: prod
          os_version: "Windows Server 2022"
          os_build_pre: "20348.1000"
          os_build: "20348.1000"
          aap_job_id: "9001"
          patch_execution_started_at_utc: "2026-11-23T02:00:00Z"
          result: exempt
          updates_installed_kbs: not_available
          patch_wave: wave_1
          patching_exception_status: active
          patching_exception_reference: EXC-PERM-100
          change_ticket_id: CHG0010001
          reason_code: PATCH_EXEMPTION
        - hostname: WIN-TEMP-EXEMPT
          patch_environment: test
          os_version: "Windows Server 2022"
          os_build_pre: "20348.1000"
          os_build: "20348.1000"
          aap_job_id: "9001"
          patch_execution_started_at_utc: "2026-11-23T02:00:00Z"
          result: exempt
          updates_installed_kbs: not_available
          patch_wave: wave_1
          patching_exception_status: active
          patching_exception_reference: EXC-TEMP-200
          patching_reboot_exception_active: true
          patching_reboot_exception_reference: EXC-REBOOT-9
          change_ticket_id: CHG0010001
          reason_code: PATCH_EXEMPTION
        - hostname: WIN-EXPIRED
          patch_environment: prod
          os_version: "Windows Server 2019"
          os_build_pre: "17763.1000"
          os_build: "17763.1000"
          aap_job_id: "9001"
          patch_execution_started_at_utc: "2026-11-23T02:00:00Z"
          result: failed
          updates_installed_kbs: not_available
          patch_wave: wave_1
          patching_exception_status: expired
          patching_exception_reference: ""
          patching_exception_patch_reference: EXC-OLD-1
          change_ticket_id: CHG0010001
          pre_patch_reboot_required: false
          post_patch_reboot_required: false
          pending_reboot: false
          reason_code: PATCH_INSTALL_FAILED
        - hostname: WIN-BLOCKED
          patch_environment: prod
          os_version: "Windows Server 2016"
          os_build_pre: "14393.100"
          os_build: "14393.100"
          aap_job_id: "9001"
          patch_execution_started_at_utc: "2026-11-23T02:00:00Z"
          result: blocked
          updates_installed_kbs: not_available
          patch_wave: wave_1
          patching_exception_status: none
          change_ticket_id: CHG0010001
          reason_code: PRECHECK_BLOCKED
        - hostname: WIN-FAILED
          patch_environment: prod
          os_version: "Windows Server 2022"
          os_build_pre: "20348.1000"
          os_build: "20348.1000"
          aap_job_id: "9001"
          patch_execution_started_at_utc: "2026-11-23T02:00:00Z"
          result: failed
          updates_installed: 1
          updates_installed_kbs:
            - "5034000"
          patch_wave: wave_1
          patching_exception_status: none
          change_ticket_id: CHG0010001
          post_patch_reboot_required: true
          post_patch_reboot_performed: false
          pending_reboot: true
          reason_code: PATCH_INSTALL_FAILED
        - hostname: WIN-UNREACHABLE
          patch_environment: prod
          os_version: not_available
          os_build_pre: not_available
          os_build: ""
          aap_job_id: "9001"
          patch_execution_started_at_utc: "2026-11-23T02:00:00Z"
          result: failed
          updates_installed_kbs: not_available
          patch_wave: wave_1
          patching_exception_status: none
          change_ticket_id: CHG0010001
          reason_code: UNREACHABLE
        - hostname: WIN-NO-KB
          patch_environment: prod
          os_version: "Windows Server 2022"
          os_build_pre: "20348.1000"
          os_build: "20348.2345"
          aap_job_id: "9001"
          patch_execution_started_at_utc: "2026-11-23T02:00:00Z"
          result: success
          updates_installed: 2
          updates_installed_kbs: not_available
          patch_wave: wave_1
          patching_exception_status: none
          change_ticket_id: CHG0010001
          post_patch_reboot_required: true
          post_patch_reboot_performed: true
          pending_reboot: false
          reason_code: PATCH_SUCCEEDED
        - hostname: WIN-EMPTY-KB
          patch_environment: prod
          os_version: "Windows Server 2022"
          os_build_pre: "20348.1000"
          os_build: "20348.2345"
          aap_job_id: "9001"
          patch_execution_started_at_utc: "2026-11-23T02:00:00Z"
          result: success
          updates_installed: 2
          updates_installed_kbs: []
          patch_wave: wave_1
          patching_exception_status: none
          change_ticket_id: CHG0010001
          reason_code: PATCH_SUCCEEDED
        - hostname: WIN-NO-START
          patch_environment: prod
          os_version: "Windows Server 2022"
          os_build_pre: "20348.1000"
          os_build: "20348.2345"
          aap_job_id: "9001"
          result: success
          updates_installed: 1
          updates_installed_kbs:
            - "5034123"
          patch_wave: wave_1
          patching_exception_status: none
          change_ticket_id: CHG0010001
          post_patch_reboot_required: true
          post_patch_reboot_performed: true
          pending_reboot: false
          reason_code: PATCH_SUCCEEDED
        - hostname: 'SRV "1", East'
          patch_environment: prod
          os_version: "Windows Server 2022"
          os_build_pre: "20348.1000"
          os_build: "20348.2345"
          aap_job_id: "9001"
          patch_execution_started_at_utc: "2026-11-23T02:00:00Z"
          result: success
          updates_installed: 1
          updates_installed_kbs:
            - not a kb
          patch_wave: wave_1
          patching_exception_status: none
          change_ticket_id: CHG0010001
          reason_code: PATCH_SUCCEEDED
  tasks:
    - name: Render the operations CSV
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: operations_csv.yml

    - name: Split the published operations CSV
      ansible.builtin.set_fact:
        _ops_lines: "{{ (patch_operations_report_csv | trim).splitlines() }}"

    - name: Assert the operations CSV rows
      ansible.builtin.assert:
        that:
          - (_ops_lines | length) == 13
          - (_ops_lines[0] | regex_findall('","') | length) == 17
          - (_ops_lines[0].split(',') | first) == '"Report Date (UTC)"'
          - (_ops_lines[0].split(',') | last) == '"Reason Code"'
          - _ops_lines[1] is search('"2026-11-23T15:05:00Z","WIN-PATCHED","prod"')
          - _ops_lines[1] is search('"20348.1000","20348.2345","9001"')
          - _ops_lines[1] is search('"2026-11-23T02:00:00Z","success","KB5034123; KB5034124"')
          - _ops_lines[1] is search('"2026-11-23T01:00:00Z","2026-11-23T05:00:00Z","wave_1"')
          - _ops_lines[1] is search('"none","not_available","CHG0010001","performed","PATCH_SUCCEEDED"$')
          - _ops_lines[2] is search('"already_compliant","none"')
          - _ops_lines[2] is search('"not_required","NO_APPLICABLE_UPDATES"$')
          - _ops_lines[3] is search('"exempt","not_available"')
          - _ops_lines[3] is search('"PATCH_EXEMPTION"$')
          - _ops_lines[3] is search('"active","EXC-PERM-100"')
          - _ops_lines[4] is search('"active","EXC-TEMP-200; EXC-REBOOT-9"')
          - _ops_lines[5] is search('"expired","EXC-OLD-1"')
          - ('"active"' not in _ops_lines[5])
          - _ops_lines[6] is search('"blocked"')
          - _ops_lines[6] is search('"PRECHECK_BLOCKED"$')
          - _ops_lines[7] is search('"failed","KB5034000"')
          - _ops_lines[7] is search('"required_not_performed","PATCH_INSTALL_FAILED"$')
          - _ops_lines[8] is search('"failed","not_available"')
          - _ops_lines[8] is search('"not_available","UNREACHABLE"$')
          - ('unreachable' not in _ops_lines[8])
          - _ops_lines[9] is search('"success","not_available"')
          - (_ops_lines[9].split('","')[9] == 'not_available')
          - _ops_lines[10] is search('"success","not_available","2026-11-23T01:00:00Z"')
          - (_ops_lines[10].split('","')[9] == 'not_available')
          - (_ops_lines[2].split('","')[9] == 'none')
          - _ops_lines[11] is search('"9001","not_available","success","KB5034123"')
          - _ops_lines[12] is search('"SRV ""1"", East"')
          - _ops_lines[12] is search('"success","not_available"')
          - patch_operations_report_filename | trim == 'windows-patch-operations-report-2026-11-23T15-00-00.csv'
          - ('KB5034123' not in _ops_lines[9])
        fail_msg: "Operations CSV did not match the synthetic cases: {{ _ops_lines }}"

- name: Operations report without a maintenance window
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    patch_final_report_timestamp: "2026-11-23T16-00-00"
    patch_report_output_dir: "{{ lookup('ansible.builtin.env', 'TEMP') | default('/tmp', true) }}/aap-operations-report-test"
    patch_workflow_report:
      report_generated_at_utc: "2026-11-23T16:05:00Z"
      hosts:
        - hostname: WIN-NO-WINDOW
          patch_environment: prod
          os_version: "Windows Server 2022"
          os_build_pre: "20348.1000"
          os_build: "20348.2345"
          aap_job_id: "9002"
          patch_execution_started_at_utc: "2026-11-23T02:00:00Z"
          result: blocked
          updates_installed_kbs: not_available
          patch_wave: wave_2
          patching_exception_status: none
          change_ticket_id: CHG0010002
          reason_code: PRECHECK_BLOCKED
  tasks:
    - name: Render the operations CSV without a window
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: operations_csv.yml

    - name: Assert a missing maintenance window stays not_available
      ansible.builtin.assert:
        that:
          - patch_operations_report_csv is search('"WIN-NO-WINDOW"')
          - patch_operations_report_csv is search('"not_available","not_available","wave_2"')
          - "'2026-11-23T01:00:00Z' not in patch_operations_report_csv"
        fail_msg: "A missing maintenance window was not reported as not_available."

- name: Operations report regressions for KB, reboot, and exemptions
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    patch_final_report_timestamp: "2026-11-23T17-00-00"
    patch_report_output_dir: "{{ lookup('ansible.builtin.env', 'TEMP') | default('/tmp', true) }}/aap-operations-report-test"
    maintenance_window_start: "2026-11-23T01:00:00Z"
    maintenance_window_end: "2026-11-23T05:00:00Z"
    patch_workflow_report:
      report_generated_at_utc: "2026-11-23T17:05:00Z"
      hosts:
        - hostname: WIN-KB-MIXED
          result: success
          updates_installed: 2
          updates_installed_kbs:
            - "5034123"
            - KB5034123
            - "5034999"
          reason_code: PATCH_SUCCEEDED
        - hostname: WIN-REBOOT-ONLY
          result: exempt
          updates_installed_kbs: not_available
          patching_exception_status: active
          patching_exception_reference: EXC-REBOOT-9
          patching_reboot_exception_active: true
          patching_reboot_exception_reference: EXC-REBOOT-9
          reason_code: PATCH_EXEMPTION
        - hostname: WIN-POST-MISSED
          result: failed
          updates_installed_kbs: not_available
          pre_patch_reboot_required: true
          pre_patch_reboot_performed: true
          post_patch_reboot_required: true
          post_patch_reboot_performed: false
          pending_reboot: true
          reason_code: REBOOT_FAILED
        - hostname: WIN-POST-UNKNOWN
          result: failed
          updates_installed_kbs: not_available
          pre_patch_reboot_required: true
          pre_patch_reboot_performed: true
          post_patch_reboot_required: true
          post_patch_reboot_performed: false
          reason_code: REBOOT_FAILED
        - hostname: WIN-POST-FALSE
          result: failed
          updates_installed_kbs: not_available
          pre_patch_reboot_required: true
          pre_patch_reboot_performed: true
          post_patch_reboot_required: true
          post_patch_reboot_performed: false
          pending_reboot: false
          reason_code: REBOOT_FAILED
        - hostname: WIN-ALL-DONE
          result: success
          updates_installed: 1
          updates_installed_kbs:
            - "5034100"
          pre_patch_reboot_required: true
          pre_patch_reboot_performed: true
          post_patch_reboot_required: true
          post_patch_reboot_performed: true
          pending_reboot: false
          reason_code: PATCH_SUCCEEDED
        - hostname: WIN-NO-REBOOT
          result: already_compliant
          updates_installed: 0
          updates_installed_kbs: []
          pre_patch_reboot_required: false
          pre_patch_reboot_performed: false
          post_patch_reboot_required: false
          post_patch_reboot_performed: false
          pending_reboot: false
          reason_code: NO_APPLICABLE_UPDATES
        - hostname: WIN-STILL-PENDING
          result: degraded
          updates_installed: 1
          updates_installed_kbs:
            - "5034101"
          pre_patch_reboot_required: true
          pre_patch_reboot_performed: true
          post_patch_reboot_required: false
          post_patch_reboot_performed: false
          pending_reboot: true
          reason_code: PENDING_REBOOT
        - hostname: WIN-NO-EVIDENCE
          result: unknown
          updates_installed_kbs: not_available
          reason_code: UNKNOWN_RESULT
        - hostname: WIN-INVALID-REF
          result: failed
          updates_installed_kbs: not_available
          patching_exception_status: invalid
          patching_exception_reference: ""
          patching_exception_patch_reference: EXC-BAD-1
          reason_code: UNKNOWN_RESULT
        - hostname: WIN-EXPIRED-EMPTY
          result: failed
          updates_installed_kbs: not_available
          patching_exception_status: expired
          patching_exception_reference: ""
          patching_exception_patch_reference: ""
          reason_code: UNKNOWN_RESULT
  tasks:
    - name: Render the regression CSV
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: operations_csv.yml

    - name: Split the regression CSV
      ansible.builtin.set_fact:
        _reg_lines: "{{ (patch_operations_report_csv | trim).splitlines() }}"

    - name: Assert KB, reboot, and exemption regressions
      ansible.builtin.assert:
        that:
          - (_reg_lines | length) == 12
          - (_reg_lines[1].split('","')[9] == 'KB5034123; KB5034999')
          - ('KBKB' not in _reg_lines[1])
          - (_reg_lines[2].split('","')[14] == 'EXC-REBOOT-9')
          - ('EXC-REBOOT-9; EXC-REBOOT-9' not in _reg_lines[2])
          - (_reg_lines[3].split('","')[16] == 'required_not_performed')
          - (_reg_lines[4].split('","')[16] == 'required_not_performed')
          - (_reg_lines[5].split('","')[16] == 'required_not_performed')
          - (_reg_lines[6].split('","')[16] == 'performed')
          - (_reg_lines[7].split('","')[16] == 'not_required')
          - (_reg_lines[8].split('","')[16] == 'pending')
          - (_reg_lines[9].split('","')[16] == 'not_available')
          - (_reg_lines[10].split('","')[13] == 'invalid')
          - (_reg_lines[10].split('","')[14] == 'EXC-BAD-1')
          - (_reg_lines[11].split('","')[13] == 'expired')
          - (_reg_lines[11].split('","')[14] == 'not_available')
        fail_msg: "Operations regressions did not match: {{ _reg_lines }}"

- name: Confirm an operations CSV failure stays after the canonical reports
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read the final report writer
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../roles/patch_report/tasks/final_write.yml"
      register: _final_write

    - name: Assert the optional CSV is rescued after canonical generation
      ansible.builtin.assert:
        that:
          - "_write_text is search('Write Final Report JSON from patch_workflow_report')"
          - "_write_text is search('include_tasks: operations_csv.yml')"
          - "_write_text is search('optional Windows patch operations CSV was not produced')"
          - "(_write_text.find('Write Final Report JSON') | int) < (_write_text.find('include_tasks: operations_csv.yml') | int)"
          - "(_write_text.find('include_tasks: operations_csv.yml') | int) < (_write_text.find('rescue:') | int)"
          - "(_write_text.find('Publish Final Report CSV string artifact') | int) < (_write_text.find('include_tasks: operations_csv.yml') | int)"
        fail_msg: "Optional operations CSV is not isolated from canonical reporting."
      vars:
        _write_text: "{{ _final_write.content | b64decode }}"
