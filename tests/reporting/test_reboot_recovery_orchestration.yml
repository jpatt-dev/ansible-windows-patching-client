    - name: Assert authorization did not start reboot recovery
      ansible.builtin.assert:
        that:
          - patch_lifecycle_last_completed_phase == 'discovery'
          - patch_lifecycle_failed_phase == ''
          - patch_lifecycle_reboot_recovery_failed == 'not_available'
