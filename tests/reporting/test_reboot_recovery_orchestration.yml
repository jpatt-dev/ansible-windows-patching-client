  gather_facts: false
  vars:
    change_ticket_id: CHG001
    patch_wave_name: windows_wave_1
    patch_host_eligible: true
    windows_connectivity_ok: true
    pending_reboot: false
  tasks:
    - name: Record precheck and discovery
      ansible.builtin.include_tasks: record_prior_phases.yml
      vars:
        prior_phases:
          - phase: precheck
            result:
              precheck_status: passed
          - phase: discovery
            result:
              patch_status: ""

    - name: Stub win_reboot success and an unreachable post-reboot win_ping
      ansible.builtin.set_fact:
        reboot_phase: pre
        windows_reboot_result:
          changed: true
          failed: false
          rebooted: true
        windows_post_reboot_ping:
          unreachable: true
          msg: Data could not be sent to remote host
        patch_result:
          phase: reboot_pre
          patch_status: ok
          reboot_performed: true

    - name: Record the pre-patch reboot the way full_patch.yml does
      ansible.builtin.include_tasks: full_patch_reboot_outcome.yml
      vars:
        reboot_outcome_phase: pre_patch_reboot
        reboot_result_phase: reboot_pre

    - name: Record apply and postcheck after the ignored unreachable check
      ansible.builtin.include_tasks: record_prior_phases.yml
      vars:
        prior_phases:
          - phase: apply
            result:
              patch_status: ok
          - phase: postcheck
            result:
              postcheck_status: ok

    - name: Preserve a successful postcheck and a fresh WinRM answer
      ansible.builtin.set_fact:
        windows_connectivity_ok: true
        windows_winrm_ping:
          ping: pong
          failed: false
        windows_update_search:
          found_update_count: 0
        pending_reboot: false
        patch_phase_apply: >-
          {{
            {
              inventory_hostname: {
                'patch_attempted': true,
                'updates_installed': 4,
                'updates_failed': 0,
                'patch_status': 'success'
              }
            }
          }}
        patch_phase_postcheck: >-
          {{
            {
              inventory_hostname: {
                'postcheck_status': 'ok'
              }
            }
          }}

    - name: Build and assert the recovered WinRM check is not a terminal failure
      ansible.builtin.include_tasks: tasks/lifecycle_phase_assert.yml
      vars:
        expected_result: success
