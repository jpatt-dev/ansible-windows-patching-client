- name: Full patch records reboot outcome before the next phase
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Read the full patch play and the reboot role
      ansible.builtin.slurp:
        src: "{{ item }}"
      loop:
        - "{{ playbook_dir }}/../../playbooks/windows/full_patch.yml"
        - "{{ playbook_dir }}/../../roles/windows_patch/tasks/reboot.yml"
        - "{{ playbook_dir }}/../../playbooks/windows/tasks/record_phase_outcome.yml"
      register: _recovery_slurp

    - name: Locate the reboot outcome tasks in full_patch.yml
      ansible.builtin.set_fact:
        _full_patch_text: "{{ _recovery_slurp.results[0].content | b64decode }}"
        _reboot_text: "{{ _recovery_slurp.results[1].content | b64decode }}"
        _outcome_text: "{{ _recovery_slurp.results[2].content | b64decode }}"

    - name: Assert reboot recovery is judged from the role results before the next phase
      ansible.builtin.assert:
        that:
          - (_pre_outcome | int) > 0
          - (_mark_apply | int) > (_pre_outcome | int)
          - (_post_outcome | int) > 0
          - (_mark_postcheck | int) > (_post_outcome | int)
          - "'register: windows_reboot_result' in _reboot_text"
          - "'register: windows_post_reboot_ping' in _reboot_text"
          - "'ansible.windows.win_reboot:' in _reboot_text"
          - "'ansible.windows.win_ping:' in _reboot_text"
          - "'windows_reboot_result is unreachable' in _outcome_text"
          - "'windows_post_reboot_ping is unreachable' in _outcome_text"
        fail_msg: full_patch.yml no longer records reboot outcome before the next phase.
      vars:
        _pre_outcome: "{{ _full_patch_text.find('Record the pre-patch reboot lifecycle outcome') }}"
        _mark_apply: "{{ _full_patch_text.find('Mark apply as the current lifecycle phase') }}"
        _post_outcome: "{{ _full_patch_text.find('Record the post-patch reboot lifecycle outcome') }}"
        _mark_postcheck: "{{ _full_patch_text.find('Mark postcheck as the current lifecycle phase') }}"
