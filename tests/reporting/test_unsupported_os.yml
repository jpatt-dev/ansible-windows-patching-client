---
# Unsupported OS is reported without installing or rebooting.
# Authorized remediation is failed so existing CTask selection includes it.
# Check-only execution is blocked.

- name: Seed unsupported OS hosts
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Add check-only unknown Windows version
      ansible.builtin.add_host:
        name: win-unknown-check
        groups: unsupported_os_hosts
        ansible_connection: local
        patch_host_eligible: true
        patch_apply_enabled: false
        operator_authorize_patch_install: false
        windows_patch_mode: check_only
        windows_os_policy_supported: false
        windows_connectivity_ok: true
        precheck_status: passed
        pending_reboot: true
        windows_critical_services_ok: true
        windows_disk_low: false
        windows_update_search_ok: true
        updates_found: 0
        windows_update_search:
          found_update_count: 0
          skipped: true
          failed: false
        expected_result: blocked
        expected_reason_code: UNSUPPORTED_OS

    - name: Add authorized unknown Windows version
      ansible.builtin.add_host:
        name: win-unknown-install
        groups: unsupported_os_hosts
        ansible_connection: local
        patch_host_eligible: true
        patch_apply_enabled: true
        operator_authorize_patch_install: true
        windows_patch_mode: direct_win_updates
        windows_os_policy_supported: false
        windows_connectivity_ok: true
        precheck_status: passed
        pending_reboot: false
        windows_critical_services_ok: true
        windows_disk_low: false
        windows_update_search_ok: true
        updates_found: 0
        windows_update_search:
          found_update_count: 0
          skipped: true
          failed: false
        expected_result: failed
        expected_reason_code: UNSUPPORTED_OS

- name: Classify unsupported OS hosts
  hosts: unsupported_os_hosts
  connection: local
  gather_facts: false
  vars:
    change_ticket_id: CHG001
    patch_wave_name: windows_wave_1
    awx_job_id: "4242"
    snow_ctask_assignment_group: windows-patch-followup
  tasks:
    - name: Build the per-host report
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_build.yml

    - name: Assert unsupported OS, with no install and no reboot
      ansible.builtin.assert:
        that:
          - patch_final_result.result == expected_result
          - patch_final_result.reason_code == expected_reason_code
          - "'OS has no supported patch policy' in patch_final_result.reason"
          - (patch_final_result.manual_followup_required | bool) == (inventory_hostname == 'win-unknown-install')
          - not (patch_final_result.patched | bool)
          - (patch_final_result.pre_patch_reboot_performed | string) != 'true'
          - (patch_final_result.post_patch_reboot_performed | string) != 'true'
          - (patch_final_result.updates_installed | string) in ['0', 'not_available']
        fail_msg: >-
          {{ inventory_hostname }} result={{ patch_final_result.result }}
          reason_code={{ patch_final_result.reason_code }}
          reason={{ patch_final_result.reason | default('') }}

    - name: Assert check-only still records the pending reboot
      when: inventory_hostname == 'win-unknown-check'
      ansible.builtin.assert:
        that:
          - patch_final_result.pending_reboot | bool
          - patch_final_result.result == 'blocked'
        fail_msg: Check-only unsupported OS hid the pending reboot or looked compliant.

- name: Select the authorized unsupported host for change task follow-up
  hosts: unsupported_os_hosts
  connection: local
  gather_facts: false
  vars:
    change_ticket_id: CHG001
    patch_wave_name: windows_wave_1
    awx_job_id: "4242"
    snow_ctask_assignment_group: windows-patch-followup
  tasks:
    - name: Aggregate the unsupported OS hosts
      ansible.builtin.include_role:
        name: patch_report
        tasks_from: final_aggregate.yml
      run_once: true

    - name: Build change task batches from the report
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../playbooks/windows/tasks/snow_ctask_prepare.yml"
      run_once: true

    - name: Assert only the authorized failure is selected
      ansible.builtin.assert:
        that:
          - (snow_ctask_requests | length) == 1
          - (snow_ctask_requests[0].hosts | length) == 1
          - snow_ctask_requests[0].hosts[0].hostname == 'win-unknown-install'
          - snow_ctask_requests[0].hosts[0].status == 'failed'
          - snow_ctask_requests[0].hosts[0].reason_code == 'UNSUPPORTED_OS'
        fail_msg: >-
          Authorized unsupported OS was not selected for change task follow-up.
          requests={{ snow_ctask_requests | default([]) }}
      run_once: true
