- name: WSUS missing is distinct from an unreachable registry probe
  hosts: localhost
  connection: local
  gather_facts: false
  vars:
    windows_wsus_url_regex: '^https?://[^/\s]+'
  tasks:
    - name: Validate reachable host with missing WSUS keys
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/windows_patch_source/tasks/wsus_validate.yml"
      vars:
        windows_wsus_current_server_url: ""
        windows_wsus_current_status_server_url: ""
        windows_wsus_current_use_wu_server: ""
        windows_wsus_reg_wuserver:
          failed: false
          unreachable: false
        windows_wsus_reg_wustatus:
          failed: false
          unreachable: false
        windows_wsus_reg_usewu:
          failed: false
          unreachable: false

    - name: Record reachable missing WSUS status
      ansible.builtin.set_fact:
        _wsus_reachable_missing: "{{ windows_wsus_validation_status }}"
        _wsus_reachable_provider: "{{ windows_patch_provider_effective }}"

    - name: Validate unreachable WSUS registry probe
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/windows_patch_source/tasks/wsus_validate.yml"
      vars:
        windows_wsus_current_server_url: ""
        windows_wsus_current_status_server_url: ""
        windows_wsus_current_use_wu_server: ""
        windows_wsus_reg_wuserver:
          failed: true
          unreachable: true
        windows_wsus_reg_wustatus:
          failed: true
          unreachable: true
        windows_wsus_reg_usewu:
          failed: true
          unreachable: true

    - name: Assert reachable missing vs unreachable WSUS status
      ansible.builtin.assert:
        that:
          - _wsus_reachable_missing == 'missing'
          - _wsus_reachable_provider == 'unknown'
          - windows_wsus_validation_status == 'not_available'
          - windows_patch_provider_effective == 'unknown'
          - not (windows_wsus_configured | bool)
        fail_msg: WSUS validation mixed missing keys with an unreachable host.

    - name: Validate reachable valid WSUS configuration
      ansible.builtin.include_tasks: "{{ playbook_dir }}/../../roles/windows_patch_source/tasks/wsus_validate.yml"
      vars:
        windows_wsus_current_server_url: "http://wsus.example.test"
        windows_wsus_current_status_server_url: "http://wsus.example.test"
        windows_wsus_current_use_wu_server: "1"
        windows_wsus_reg_wuserver:
          failed: false
          unreachable: false
        windows_wsus_reg_wustatus:
          failed: false
          unreachable: false
        windows_wsus_reg_usewu:
          failed: false
          unreachable: false

    - name: Assert reachable valid WSUS remains wsus
      ansible.builtin.assert:
        that:
          - windows_wsus_validation_status == 'valid'
          - windows_patch_provider_effective == 'wsus'
          - windows_wsus_configured | bool
        fail_msg: Reachable valid WSUS configuration was not preserved.

- name: Final job failure remains after reporting and SMTP
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Load Full Patch playbook
      ansible.builtin.slurp:
        src: "{{ playbook_dir }}/../../playbooks/windows/full_patch.yml"
      register: _full_patch_slurp

    - name: Parse Full Patch task names
      ansible.builtin.set_fact:
        _full_patch_plays: "{{ _full_patch_slurp.content | b64decode | from_yaml }}"
        _agg_task_names: "{{ ((_full_patch_slurp.content | b64decode | from_yaml)[1].tasks | map(attribute='name') | list) }}"
        _agg_task_blob: "{{ ((_full_patch_slurp.content | b64decode | from_yaml)[1].tasks | map(attribute='name') | list) | join('\n') }}"

    - name: Assert reporting and SMTP run before the final failure
      ansible.builtin.assert:
        that:
          - "'Aggregate Final Patch Report and print summary' in _agg_task_names"
          - "'Write canonical Final Report JSON/CSV/Markdown from patch_workflow_report' in _agg_task_names"
          - "'Email Windows patching report' in _agg_task_names"
          - "'Attach Final Report files to ServiceNow change' in _agg_task_names"
          - "'Fail after reporting if any host failed' in _agg_task_names"
          - _agg_task_blob is search('(?s)Aggregate Final Patch Report.*Write canonical Final Report.*Email Windows patching report.*Attach Final Report files to ServiceNow change.*Fail after reporting if any host failed')
        fail_msg: Final AAP failure assertion is not after reporting and SMTP.

