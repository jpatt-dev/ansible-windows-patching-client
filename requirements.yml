---
# Ansible collection dependencies (public Galaxy).
#
# Install locally (lint/dev only):
#   ansible-galaxy collection install -r requirements.yml
#
# Production runtime collections come from the Execution Environment
# (execution-environments/windows-patch-ee/) — do not vendor collections/ into git.
#
# ServiceNow: this pack uses ansible.builtin.uri stubs. Do not add
# servicenow.itsm unless a client fork replaces the stubs.

collections:
  - name: ansible.windows
    version: ">=2.3.0"
  # community.general.mail for optional SMTP report delivery.
  # Pin stays on ansible-core 2.16 (AAP 2.7). Rebuild the EE after changing this.
  - name: community.general
    version: ">=9.5.0,<11.0.0"
