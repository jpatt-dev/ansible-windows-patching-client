---
# Ansible collection dependencies (public Galaxy).
#
# Install locally (lint/dev only):
#   ansible-galaxy collection install -r requirements.yml
#
# Production runtime collections come from the Execution Environment
# (execution-environments/windows-patch-ee/) — do not vendor collections/ into git.
#
# servicenow.itsm is used by roles/servicenow_patching_change,
# roles/servicenow_incident, and playbooks/tests/. Full Patch calls
# servicenow_patching_change only when an administrator enables the post-report
# change update or report attachment. The published windows-patch-ee image does
# not contain this collection until that image is rebuilt.

collections:
  - name: ansible.windows
    version: ">=2.3.0"
  - name: servicenow.itsm
    version: ">=2.6.3"
